function simpanSetting(){

  if(!settingSudahAda){
    const missing = [];
    if(!set_sekolah.value.trim()) missing.push('Nama Sekolah');
    if(!set_tahun.value.trim()) missing.push('Tahun Pelajaran');
    if(!set_semester.value.trim()) missing.push('Semester');
    if(!set_guru.value.trim()) missing.push('Nama Guru');
    if(!set_kelas_diampu.value.trim()) missing.push('Kelas Diampu');
    if(document.querySelectorAll('.mapel-cb:checked').length === 0) missing.push('Mata Pelajaran (centang minimal 1)');
    if(missing.length){
      alert('⚠️ Lengkapi data berikut terlebih dahulu:\n- ' + missing.join('\n- '));
      return;
    }
  }

  startProgress();

  uploadLogoIfAny(function(logoUrl){

    const payload = {
      sekolah          : set_sekolah.value.trim(),
      tahun_pelajaran  : set_tahun.value.trim(),
      semester         : set_semester.value.trim(),
      nama_guru        : set_guru.value.trim(),
      nip_guru         : set_nip_guru.value.trim(),
      mata_pelajaran   : [...document.querySelectorAll('.mapel-cb:checked')].map(cb=>cb.value).join(', '),
      kelas_diampu     : set_kelas_diampu.value.trim(),
      app_logo_url     : logoUrl || ''
    };

    pendingSettingPayload = payload;

    // 🔥 COBA SIMPAN SETTING LANGSUNG
    google.script.run
      .withSuccessHandler(function(){ _afterSettingSaved_(payload); })
      .withFailureHandler(function(err){

        endProgress();

        // 🎓 MASA TRIAL HABIS / AKUN BELUM DIAKTIFKAN — bukan lagi lewat
        // input kode lisensi manual, tapi menunggu SuperAdmin approve.
        if(err.message === 'TRIAL_EXPIRED' || err.message === 'AKUN_TIDAK_AKTIF'){
          const msg = err.message === 'TRIAL_EXPIRED'
            ? '⏰ Masa uji coba 30 hari sudah berakhir. Hubungi SuperAdmin untuk aktivasi penuh.'
            : '⚠️ Akun Anda belum aktif. Hubungi SuperAdmin untuk aktivasi.';
          if(typeof showToast === 'function') showToast(msg, 'warning', 8000);
          else alert(msg);
          return;
        }

        // 🔥 JIKA BUTUH LISENSI SEKOLAH (school-wide, dikelola SuperAdmin)
        if(
          err.message === 'INPUT_LICENSE' ||
          err.message === 'LISENSI_EXPIRED'
        ){

          openLicenseModal(function(key){

            if(!key){
              alert('Kode lisensi wajib diisi');
              return;
            }

            startProgress();

            // 🔑 AKTIVASI LISENSI
            google.script.run
              .withSuccessHandler(function(res){

                if(!res || res.status !== true){
                  endProgress();
                  alert('❌ Kode lisensi tidak valid');
                  return;
                }

                // ✅ AKTIVASI SUKSES → SIMPAN SETTING ULANG
                google.script.run
                  .withSuccessHandler(function(){
                    closeLicenseModal();
                    _afterSettingSaved_(pendingSettingPayload, '✅ Lisensi aktif 1 tahun\nBerlaku sampai: ' + (res.expired || '-'));
                  })
                  .withFailureHandler(function(e){
                    endProgress();
                    alert('❌ Gagal simpan setting:\n' + e.message);
                  })
                  .saveSetting(pendingSettingPayload);

              })
              .withFailureHandler(function(e){
                endProgress();
                alert('❌ Aktivasi lisensi gagal:\n' + e.message);
              })
              .activateLicense(key);

          });

          return;
        }

        alert('❌ Gagal menyimpan setting:\n' + err.message);

      })
      .saveSetting(payload);

  });
}

/**
 * _afterSettingSaved_(payload, successMessageOverride)
 * Dipanggil setelah saveSetting() sukses, baik dari jalur simpan langsung
 * maupun jalur retry setelah aktivasi lisensi sekolah. Melanjutkan simpan
 * Kelas & Mapel Diampu ke GuruMengajar (dulu cuma bisa lewat wizard
 * terpisah — sekarang jadi satu langkah dengan Simpan Setting), lalu cek
 * transisi tahun ajaran kalau tahun/semester berubah dari sebelumnya.
 */
function _afterSettingSaved_(payload, successMessageOverride){
  const prevPeriod = window._settingLoadedPeriod || { tahun:'', semester:'' };
  const kelas = (payload.kelas_diampu || '').split(',').map(function(v){ return v.trim(); }).filter(Boolean);
  const mapel = (payload.mata_pelajaran || '').split(',').map(function(v){ return v.trim(); }).filter(Boolean);

  google.script.run
    .withSuccessHandler(function(){
      endProgress();

      settingSudahAda = true;
      applyLockUI(true);
      lockSiswaUpload(true);
      pendingSettingPayload = null;

      const changed = prevPeriod.tahun && (prevPeriod.tahun !== payload.tahun_pelajaran || prevPeriod.semester !== payload.semester);
      window._settingLoadedPeriod = { tahun: payload.tahun_pelajaran, semester: payload.semester };

      loadSettingForm();
      checkLicenseStatus();

      alert(successMessageOverride || '✅ Setting berhasil disimpan');

      if(changed) checkJadwalTransition_(payload.tahun_pelajaran, payload.semester);
    })
    .withFailureHandler(function(err){
      endProgress();
      settingSudahAda = true;
      applyLockUI(true);
      lockSiswaUpload(true);
      pendingSettingPayload = null;
      loadSettingForm();
      checkLicenseStatus();
      alert('⚠️ Setting tersimpan, tapi Kelas/Mapel Diampu gagal disimpan:\n' + err.message + '\nKlik ✏️ Edit Setting lalu simpan ulang.');
    })
    .saveGuruMengajarSetting({
      tahun_pelajaran: payload.tahun_pelajaran,
      semester: payload.semester,
      kelas: kelas,
      mapel: mapel
    });
}

async function cropToSquare(base64, size = 96){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2;
      const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      resolve(canvas.toDataURL('image/png'));
    };
    img.src = base64;
  });
}

async function uploadLogoIfAny(callback){

  if(!logoFile.files.length){
    callback(null);
    return;
  }

  const file = logoFile.files[0];
  const reader = new FileReader();

  reader.onload = async e => {

    const croppedBase64 = await cropToSquare(e.target.result, 96);

    google.script.run
      .withSuccessHandler(url => {
        callback(url);
      })
      .withFailureHandler(err => {

        // ===============================
        // 🎓 MASA TRIAL HABIS / AKUN BELUM AKTIF
        // ===============================
        if(err.message === 'TRIAL_EXPIRED' || err.message === 'AKUN_TIDAK_AKTIF'){
          const msg = err.message === 'TRIAL_EXPIRED'
            ? '⏰ Masa uji coba 30 hari sudah berakhir. Hubungi SuperAdmin untuk aktivasi penuh.'
            : '⚠️ Akun Anda belum aktif. Hubungi SuperAdmin untuk aktivasi.';
          if(typeof showToast === 'function') showToast(msg, 'warning', 8000);
          else alert(msg);
          callback(null);
          return;
        }

        // ===============================
        // 🔑 TRIGGER INPUT LICENSE (lisensi sekolah, dikelola SuperAdmin)
        // ===============================
        if(
            err.message &&
            (
              err.message.includes('TRIGGER_INPUT_LICENSE') ||
              err.message.includes('LISENSI_DIBUTUHKAN') ||
              err.message.includes('LISENSI_EXPIRED')
            )
          ){

          openLicenseModal(function(key){

            startProgress();

            google.script.run
              .withSuccessHandler(function(){
                endProgress();

                // 🔁 ulang upload setelah aktivasi
                setTimeout(function(){
                  uploadLogoIfAny(callback);
                },300);

              })
              .withFailureHandler(function(e){
                endProgress();
                alert('❌ Aktivasi lisensi gagal:\n' + e.message);
                callback(null);
              })
              .activateLicense(key);

          });

          return;
        }

        // ===============================
        // ERROR LAIN
        // ===============================
        alert('Upload logo gagal:\n' + err.message);
        callback(null);

      })
      .uploadLogoSekolah({
        data: croppedBase64,
        type: 'image/png',
        name: 'logo.png'
      });
  };

  reader.readAsDataURL(file);
}

function fileToBase64(file){
  return new Promise(function(resolve){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        // Kompres: max 1280px lebar, 72% quality JPEG
        const MAX_W = 1280, QUALITY = 0.72;
        let w = img.width, h = img.height;
        if(w > MAX_W){ h = Math.round(h * MAX_W / w); w = MAX_W; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', QUALITY);
        resolve({
          name: file.name.replace(/\.[^.]+$/, '.jpg'),
          type: 'image/jpeg',
          data: compressed
        });
      };
      img.onerror = function(){
        // Fallback ke data asli jika canvas gagal (misal SVG)
        resolve({ name: file.name, type: file.type, data: e.target.result });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// dipanggil saat klik tab Setting
function loadSettingForm(){

  google.script.run.withSuccessHandler(function(d){

    if(!d) return;

    // ===============================
    // FIX: mapping sesuai ID HTML
    // ===============================

    set_sekolah.value     = d.sekolah || '';
    populateTahunPelajaranSelect_(document.getElementById('set_tahun'), d.tahun_pelajaran || '');
    set_semester.value    = d.semester || 'Ganjil';
    set_guru.value        = d.nama_guru || '';
    set_nip_guru.value    = d.nip_guru || '';
    // Centang mata pelajaran yang tersimpan
    const savedMapels = (d.mata_pelajaran || '').split(/,\s*/).map(s=>s.trim()).filter(Boolean);
    document.querySelectorAll('.mapel-cb').forEach(cb=>{
      cb.checked = savedMapels.some(m=>m.toLowerCase()===cb.value.toLowerCase());
    });
    syncMapelSelects();

    // Snapshot periode yang sedang termuat, dipakai _afterSettingSaved_
    // untuk mendeteksi apakah tahun/semester benar-benar berubah saat
    // Simpan Setting berikutnya (baru trigger cek transisi kalau berubah).
    window._settingLoadedPeriod = { tahun: d.tahun_pelajaran || '', semester: d.semester || '' };

    // ===============================
    // LOGO FIX (TIDAK pakai ?v=)
    // ===============================
    const img = document.getElementById('appLogo');

    if(d.app_logo_url){
      img.src = d.app_logo_url;   // ⬅️ HAPUS cache buster
      img.style.display = 'block';

      logoPreview.src = d.app_logo_url;
      logoPreview.style.display = 'inline-block';
    }else{
      img.removeAttribute('src');
      img.style.display = 'none';
      logoPreview.style.display = 'none';
    }

    // ===============================
    // LOCK STATUS
    // ===============================
    if(d.lock_status === 'LOCKED'){
      applyLockUI(true);
      document.getElementById('btnEditSetting').style.display = 'inline-block';
    }else{
      applyLockUI(false);
    }

    // ===============================
    // UPDATE HEADER META SPANS
    // ===============================
    _applySettingToHeader_(d);
    refreshAcademicQuickInfo();

  }).getSetting();
}

/**
 * Mengisi span meta header (dipakai oleh syncSidebarProfile_)
 * dari data setting yang sudah diambil.
 */
function _applySettingToHeader_(d){
  if(!d) return;
  // Cache globally for other tabs (e.g. Input Nilai) to use immediately
  window._settingCache = d;

  var fields = {
    sekolah        : d.sekolah         || '',
    tahun_pelajaran: d.tahun_pelajaran  || '',
    semester       : d.semester        || '',
    mata_pelajaran : d.mata_pelajaran   || '',
    nama_guru      : d.nama_guru        || ''
  };

  // 1. Populate hidden meta spans (used by syncSidebarProfile_ / MutationObserver)
  var metaMap = {
    metaSekolah  : fields.sekolah,
    metaTahun    : fields.tahun_pelajaran,
    metaSemester : fields.semester,
    metaMapel    : fields.mata_pelajaran,
    metaGuru     : fields.nama_guru
  };
  Object.keys(metaMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = metaMap[id];
  });

  // 2. Update sbTop elements DIRECTLY (do not rely on syncSidebarProfile_ alone)
  var sbMap = {
    sbTopSekolah : fields.sekolah,
    sbTopTahun   : fields.tahun_pelajaran,
    sbTopSemester: fields.semester,
    sbTopMapel   : fields.mata_pelajaran,
    sbTopGuru    : fields.nama_guru
  };
  Object.keys(sbMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el && sbMap[id]) el.textContent = sbMap[id];
  });

  // Logo
  var img = document.getElementById('appLogo');
  if(img && d.app_logo_url){
    img.src           = d.app_logo_url;
    img.style.display = 'block';
  }

  // Sync greeting
  if(typeof updateGreeting_ === 'function') updateGreeting_();
}

/* ===== SYNC JADWAL MAPEL SELECT + PREVIEW FROM CHECKED MAPEL ===== */
function syncMapelSelects() {
  const checked = [...document.querySelectorAll('.mapel-cb:checked')].map(cb=>cb.value);

  // Update select di jadwal
  const sel = document.getElementById('jadwal_mapel');
  if (sel) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
    checked.forEach(m => {
      const o = document.createElement('option');
      o.value = o.textContent = m;
      sel.appendChild(o);
    });
    if (cur && checked.includes(cur)) sel.value = cur;
  }

  // Update preview teks di bawah pill
  const preview = document.getElementById('mapelSelectedPreview');
  if (preview) {
    if (checked.length === 0) {
      preview.textContent = '';
    } else {
      preview.innerHTML = '✅ Terpilih: ' + checked.map(m =>
        `<span style="background:#ede9fe;color:#6C63FF;border-radius:6px;padding:1px 8px;margin:0 2px;font-size:11.5px">${m}</span>`
      ).join('');
    }
  }
}

function refreshAcademicQuickInfo(){
  const el = document.getElementById('academicQuickInfo');
  if(!el) return;
  google.script.run
    .withSuccessHandler(function(cfg){
      const user = cfg && cfg.user ? cfg.user : {};
      const kelasList = (cfg && cfg.kelas_diampu) || [];
      const mapel = (cfg && cfg.mapel_diampu || []).length;
      el.innerHTML =
        'Aktif: <b>' + (user.tahun_pelajaran || '-') + '</b> | <b>' + (user.semester || '-') + '</b>' +
        ' | Kelas Diampu: <b>' + kelasList.length + '</b>' +
        ' | Mapel Diampu: <b>' + mapel + '</b>';

      // Pre-fill Kelas Diampu di form utama kalau masih kosong dan user
      // sedang tidak mengetik di situ (hindari menimpa input yang sedang diisi).
      const kEl = document.getElementById('set_kelas_diampu');
      if(kEl && document.activeElement !== kEl && !kEl.value.trim()){
        kEl.value = kelasList.join(', ');
      }
      refreshSiswaKelasHint_();
    })
    .withFailureHandler(function(err){
      el.textContent = 'Gagal memuat data akademik: ' + (err.message || err);
    })
    .getAcademicConfig();
}

/* ===== Tahun Pelajaran: opsi dropdown "2026/2027" dst, dihitung dari
   tahun berjalan (tahun-1 s/d tahun+2), dipakai di form Setting utama
   dan di modal-modal akademik (promosi/clone) supaya konsisten. ===== */
function buildTahunPelajaranOptions_(){
  const y = new Date().getFullYear();
  return [y - 1, y, y + 1, y + 2].map(function(yr){ return yr + '/' + (yr + 1); });
}
function _tahunOptionsHtml_(selected){
  const opts = buildTahunPelajaranOptions_();
  if(selected && opts.indexOf(selected) === -1) opts.unshift(selected);
  return opts.map(function(y){ return '<option value="' + y + '"' + (y === selected ? ' selected' : '') + '>' + y + '</option>'; }).join('');
}
function populateTahunPelajaranSelect_(selectEl, selectedValue){
  if(!selectEl) return;
  selectEl.innerHTML = _tahunOptionsHtml_(selectedValue);
  if(selectedValue) selectEl.value = selectedValue;
}

/* ===== Bantuan generator Kelas Diampu (jenjang + jumlah rombel) =====
   Kelas Diampu tetap field teks bebas (fleksibel untuk sekolah dengan
   penamaan non-standar), generator ini cuma bantu isi otomatis supaya
   nama kelas KONSISTEN dengan yang nanti diketik di kolom "kelas" pada
   upload CSV data siswa — sumber kebanyakan masalah "kelas kosong di
   dashboard" sebelumnya adalah nama kelas yang beda persis (typo). */
const JENJANG_TINGKAT_ = {
  'PAUD/TK': ['PG', 'TK A', 'TK B'],
  'SD': ['1','2','3','4','5','6'],
  'SMP': ['7','8','9'],
  'SMA': ['10','11','12'],
  'SMK': ['10','11','12']
};

function renderGenTingkat_(){
  const jenjang = (document.getElementById('genJenjang') || {}).value || '';
  const box = document.getElementById('genTingkatRows');
  if(!box) return;
  const tingkatList = JENJANG_TINGKAT_[jenjang];
  if(!tingkatList){
    box.innerHTML = '';
    return;
  }
  box.innerHTML = tingkatList.map(function(t){
    const safe = _escSetting_(t);
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">' +
      '<label style="display:flex;gap:4px;align-items:center;min-width:90px;font-size:13px">' +
        '<input type="checkbox" class="genTingkatCb" value="' + safe + '" checked> ' + safe +
      '</label>' +
      '<span class="muted" style="font-size:12px">Jumlah rombel:</span>' +
      '<input type="number" class="genRombelInput" value="1" min="1" max="12" style="width:60px">' +
    '</div>';
  }).join('');
  // Live-apply: setiap ubah centang/jumlah rombel langsung update Kelas
  // Diampu, tidak perlu tombol terpisah — supaya tidak ada keraguan
  // "apakah sudah kepencet atau belum".
  document.querySelectorAll('.genTingkatCb, .genRombelInput').forEach(function(el){
    el.addEventListener('change', applyGeneratedKelas_);
    el.addEventListener('input', applyGeneratedKelas_);
  });
  applyGeneratedKelas_();
}

/**
 * applyGeneratedKelas_()
 * Live-generate nama kelas dari pilihan jenjang+rombel, lalu GANTI
 * (bukan gabung) isi Kelas Diampu dengan hasilnya — supaya field selalu
 * persis mencerminkan pengaturan generator yang sedang aktif, tidak ada
 * sisa teks lama yang membingungkan. Kalau sekolah butuh kelas dengan
 * nama non-standar, ketik manual SETELAH generator selesai dipakai.
 */
function applyGeneratedKelas_(){
  try {
    const genEl = document.getElementById('genJenjang');
    const kEl = document.getElementById('set_kelas_diampu');
    if(!genEl || !kEl || kEl.disabled) return;
    const jenjang = genEl.value || '';

    const checkedBoxes = document.querySelectorAll('.genTingkatCb:checked');
    if(!checkedBoxes.length) return;

    const names = [];
    checkedBoxes.forEach(function(cb){
      const tingkat = cb.value;
      const row = cb.closest('div');
      const rombelInput = row ? row.querySelector('.genRombelInput') : null;
      const rombel = Math.max(1, parseInt((rombelInput && rombelInput.value) || '1', 10) || 1);
      if(rombel === 1){
        names.push(tingkat);
      } else if(jenjang === 'PAUD/TK'){
        for(let i = 1; i <= rombel; i++) names.push(tingkat + ' ' + i);
      } else {
        for(let i = 0; i < rombel; i++) names.push(tingkat + String.fromCharCode(65 + i));
      }
    });
    if(!names.length) return;

    kEl.value = names.join(', ');
    kEl.dispatchEvent(new Event('input', { bubbles: true }));
    refreshSiswaKelasHint_();
  } catch (e) {
    console.error('[applyGeneratedKelas_]', e);
  }
}

/**
 * refreshSiswaKelasHint_()
 * Tampilkan daftar Kelas Diampu yang sedang diketik/tersimpan di dekat
 * tombol Upload Data Siswa, supaya guru menyalin nama kelas yang PERSIS
 * sama ke kolom "kelas" di CSV (bukan mengetik ulang dari ingatan).
 */
function refreshSiswaKelasHint_(){
  const hint = document.getElementById('siswaKelasHint');
  const kEl = document.getElementById('set_kelas_diampu');
  if(!hint || !kEl) return;
  const list = kEl.value.split(',').map(function(v){ return v.trim(); }).filter(Boolean);
  hint.innerHTML = list.length
    ? 'Kelas terdaftar (salin persis ke kolom <b>kelas</b> di CSV): <b>' + list.map(_escSetting_).join(', ') + '</b>'
    : '';
}

/* ===================================================================
   TRANSISI JADWAL MENGAJAR SAAT GANTI TAHUN/SEMESTER
   Setelah periode aktif berubah, cek apakah periode baru sudah punya
   jadwal (kelas+mapel diampu). Kalau kosong tapi ada jadwal periode
   lain, tawarkan pilihan: Lanjutkan jadwal sebelumnya, atau Mulai Baru.
   =================================================================== */
function checkJadwalTransition_(tahun, semester){
  if(!tahun || !semester) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || res.hasCurrent) return; // periode ini sudah punya jadwal, tidak perlu tanya
      if(res.hasPrevious){
        openJadwalTransitionModal_(tahun, semester, res);
      } else if(typeof showToast === 'function'){
        showToast('📋 Belum ada jadwal mengajar di periode ini. Silakan isi Kelas & Mata Pelajaran Diampu.', 'info', 6000);
      }
    })
    .withFailureHandler(function(err){ console.warn('[checkJadwalTransition_]', err && err.message); })
    .checkGuruMengajarTransition(tahun, semester);
}

function openJadwalTransitionModal_(tahun, semester, info){
  const m = document.getElementById('academicWizardModal');
  const t = document.getElementById('academicWizardTitle');
  const b = document.getElementById('academicWizardBody');
  const a = document.getElementById('academicWizardActions');
  const p = document.getElementById('academicWizardProgress');
  if(!m || !t || !b || !a || !p) return;

  const kelasTxt = (info.kelas || []).join(', ') || '-';
  const mapelTxt = (info.mapel || []).join(', ') || '-';
  const jadwalCount = info.jadwal_count || 0;
  const prev = info.previous_period || {};

  t.textContent = 'Jadwal Mengajar Periode Baru';
  p.style.width = '90%';
  b.innerHTML =
    '<p style="margin:0 0 10px">Anda pindah ke <b>' + _escSetting_(tahun) + ' | ' + _escSetting_(semester) + '</b> dan belum punya jadwal mengajar (kelas &amp; mapel diampu, maupun jadwal hari/jam) di periode ini.</p>' +
    '<p style="margin:0 0 6px">Jadwal terakhir Anda di <b>' + _escSetting_(prev.tahun_pelajaran || '-') + ' | ' + _escSetting_(prev.semester || '-') + '</b>:</p>' +
    '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px">' +
      '<b>Kelas:</b> ' + _escSetting_(kelasTxt) + '<br><b>Mapel:</b> ' + _escSetting_(mapelTxt) +
      '<br><b>Jadwal Hari/Jam:</b> ' + jadwalCount + ' entri' +
    '</div>' +
    '<p class="muted" style="font-size:12px">Pilih salah satu: lanjutkan jadwal ini (kelas, mapel, & hari/jam) ke periode baru, atau mulai baru dari kosong.</p>';
  a.innerHTML =
    '<button class="ghost" onclick="_resetJadwalTransition_()">🆕 Mulai Baru</button>' +
    '<button onclick="_continueJadwalTransition_(\'' + _escSetting_(tahun) + '\',\'' + _escSetting_(semester) + '\',\'' + _escSetting_(prev.tahun_pelajaran || '') + '\',\'' + _escSetting_(prev.semester || '') + '\')">🔁 Lanjutkan Jadwal Sebelumnya</button>';
  m.style.display = 'flex';
}

function _escSetting_(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _continueJadwalTransition_(toTahun, toSemester, fromTahun, fromSemester){
  startProgress();
  google.script.run
    .withSuccessHandler(function(res){
      endProgress();
      closeAcademicModal();
      refreshAcademicQuickInfo();
      loadSettingForm();
      window._lastTransition = { fromTahun: fromTahun, fromSemester: fromSemester, toTahun: toTahun, toSemester: toSemester };
      showAcademicToast('✅ Jadwal mengajar dilanjutkan (' + (res.copied || 0) + ' kombinasi kelas/mapel, ' + (res.copied_jadwal || 0) + ' entri hari/jam)', 'success');
      setTimeout(function(){
        showAcademicToast('📈 Siswa di kelas lama naik tingkat? Buka Promosi Siswa di bagian "Riwayat & Kenaikan Kelas".', 'info');
      }, 1200);
    })
    .withFailureHandler(function(err){ endProgress(); showAcademicToast('Gagal melanjutkan jadwal: ' + err.message, 'error'); })
    .continueGuruMengajarToPeriod({ from_tahun: fromTahun, from_semester: fromSemester, to_tahun: toTahun, to_semester: toSemester });
}

function _resetJadwalTransition_(){
  closeAcademicModal();
  showAcademicToast('Kelas & Mapel Diampu periode ini masih kosong. Isi lewat form Setting di bawah, lalu klik Simpan Setting.', 'info');
  const el = document.getElementById('set_kelas_diampu');
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetJadwalMengajarUI(){
  const tahun = (window._settingCache && window._settingCache.tahun_pelajaran) || (document.getElementById('set_tahun') || {}).value || '';
  const semester = (window._settingCache && window._settingCache.semester) || (document.getElementById('set_semester') || {}).value || '';
  if(!tahun || !semester) return showAcademicToast('Tahun/semester aktif belum diketahui', 'warning');
  if(!confirm('Reset jadwal mengajar (Kelas & Mapel Diampu + jadwal hari/jam) untuk periode ' + tahun + ' | ' + semester + '?\nJurnal/absensi yang sudah tersimpan TIDAK terhapus.')) return;

  startProgress();
  google.script.run
    .withSuccessHandler(function(res){
      endProgress();
      refreshAcademicQuickInfo();
      if(typeof loadJadwalSetting === 'function') loadJadwalSetting();
      showAcademicToast('✅ Jadwal direset (' + (res.deleted || 0) + ' kombinasi kelas/mapel, ' + (res.deleted_jadwal || 0) + ' entri hari/jam)', 'success');
    })
    .withFailureHandler(function(err){ endProgress(); showAcademicToast('Gagal reset jadwal: ' + err.message, 'error'); })
    .resetGuruMengajarForPeriod(tahun, semester);
}

function runCloneAcademicWizard(){
  const source = (document.getElementById('wizCloneSource') || {}).value || '';
  const dest = (document.getElementById('wizCloneDest') || {}).value || '';
  if(!source.trim() || !dest.trim()) return showAcademicToast('Source dan destination wajib diisi', 'warning');
  if(!confirm('Clone akan menyalin Guru Mengajar dan pengaturan tahun. Jurnal/absensi tidak disalin. Lanjutkan?')) return;

  startProgress();
  google.script.run
    .withSuccessHandler(function(res){
      endProgress();
      closeAcademicModal();
      refreshAcademicQuickInfo();
      showAcademicToast('Clone selesai. Baris guru mengajar: ' + (res.cloned_guru_mengajar || 0), 'success');
    })
    .withFailureHandler(function(err){ endProgress(); showAcademicToast('Gagal clone: ' + err.message, 'error'); })
    .cloneAcademicYearWizard(source.trim(), dest.trim());
}

/**
 * loadKelasForPromosi_()
 * Muat kelas yang diampu guru ini di periode "Tahun/Semester Lama" yang
 * dipilih, lalu render satu baris pilihan per kelas (bukan textarea
 * mapping mentah lagi) supaya guru tinggal pilih, tidak perlu mengetik
 * format khusus.
 */
function loadKelasForPromosi_(){
  const fromYear = (document.getElementById('wizPromFromYear') || {}).value || '';
  const fromSem  = (document.getElementById('wizPromFromSem')  || {}).value || '';
  const box = document.getElementById('promKelasRows');
  if(!box || !fromYear || !fromSem) return;
  box.innerHTML = '<p class="muted">Memuat kelas...</p>';
  google.script.run
    .withSuccessHandler(function(res){
      const kelasList  = (res && res.kelas_diampu) || [];
      const siswaCount = (res && res.siswa_per_kelas) || {};
      if(!kelasList.length){
        box.innerHTML = '<p class="muted">Tidak ada siswa/kelas tercatat untuk Anda di periode ini.</p>';
        return;
      }
      const legacyNote = (res && res.from_legacy_siswa)
        ? '<div style="font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;margin-bottom:8px">'+
            'ℹ️ Kelas diambil langsung dari data siswa yang sudah ada (belum pernah diisi lewat "Kelas Diampu").</div>'
        : '';
      box.innerHTML =
        legacyNote +
        '<div style="font-size:12px;color:#4b5563;margin-bottom:8px">'+
          '✅ Centang kelas yang Anda ajar di tahun baru — siswa otomatis naik ke kelas tersebut, tanpa perlu upload ulang.</div>' +
        kelasList.map(function(k){
          const safe  = _escSetting_(k);
          const sug   = _escSetting_(_suggestNextKelas_(k));
          const count = siswaCount[k] || 0;
          return '<div class="prom-row" data-alumni="0"'+
            ' style="display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:8px 10px;border-radius:8px;border:1px solid #6366f1;background:#f5f3ff">' +
            '<input type="checkbox" class="promKelasCheck" data-from="' + safe + '" id="ck_' + safe + '"'+
              ' style="width:16px;height:16px;flex-shrink:0" checked onchange="_onPromRowChange_(this)">' +
            '<label for="ck_' + safe + '" style="flex:0 0 auto;cursor:pointer;font-size:13px">'+
              '<b>' + safe + '</b> <span style="color:#9ca3af;font-size:11px">(' + count + ' siswa)</span>'+
            '</label>' +
            '<span style="color:#9ca3af;font-size:12px;flex:0 0 auto">→ naik ke</span>' +
            '<input class="promKelasTarget" data-from="' + safe + '" value="' + sug + '"'+
              ' placeholder="Kelas tujuan" style="flex:1;min-width:60px;font-size:13px">' +
            '<button type="button" onclick="_toggleAlumniRow_(this)"'+
              ' style="background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;flex-shrink:0">Alumni</button>' +
          '</div>';
        }).join('');
    })
    .withFailureHandler(function(err){ box.innerHTML = '<p style="color:red">Gagal: ' + (err.message || err) + '</p>'; })
    .getAcademicHistorySummary(fromYear, fromSem);
}

function _suggestNextKelas_(kelas) {
  const m = String(kelas || '').match(/^(\d+)(.*)/);
  if(m) return (parseInt(m[1], 10) + 1) + m[2];
  return '';
}

function _onPromRowChange_(cb){
  const row = cb.closest('.prom-row');
  if(!row) return;
  const isAlumni = row.getAttribute('data-alumni') === '1';
  row.style.borderColor = cb.checked ? (isAlumni ? '#f59e0b' : '#6366f1') : '#e5e7eb';
  row.style.background  = cb.checked ? (isAlumni ? '#fffbeb' : '#f5f3ff') : '#fafafa';
}

function _toggleAlumniRow_(btn){
  const row = btn.closest('.prom-row');
  if(!row) return;
  const isAlumni = row.getAttribute('data-alumni') === '1';
  const cb    = row.querySelector('.promKelasCheck');
  const input = row.querySelector('.promKelasTarget');
  if(!isAlumni){
    row.setAttribute('data-alumni','1');
    row.style.borderColor = '#f59e0b'; row.style.background = '#fffbeb';
    if(cb) cb.checked = true;
    if(input){ input.value = 'ALUMNI'; input.disabled = true; }
    btn.textContent = '↩ Batal'; btn.style.background = '#fef3c7'; btn.style.color = '#92400e';
  } else {
    row.setAttribute('data-alumni','0');
    row.style.borderColor = '#6366f1'; row.style.background = '#f5f3ff';
    const from = (cb && cb.getAttribute('data-from')) || '';
    if(input){ input.value = _suggestNextKelas_(from); input.disabled = false; }
    if(cb) cb.checked = true;
    btn.textContent = 'Alumni'; btn.style.background = '#fee2e2'; btn.style.color = '#991b1b';
  }
}

function _togglePromTarget_(selectEl){
  const row = selectEl.closest('div');
  const input = row ? row.querySelector('.promKelasTarget') : null;
  if(!input) return;
  if(selectEl.value === 'alumni'){
    input.value = 'ALUMNI';
    input.disabled = true;
  } else if(selectEl.value === 'stop'){
    input.value = '';
    input.disabled = true;
  } else {
    input.disabled = false;
    if(input.value === 'ALUMNI') input.value = '';
  }
}

function runPromosiWizard(){
  const fromYear = (document.getElementById('wizPromFromYear') || {}).value || '';
  const fromSem  = (document.getElementById('wizPromFromSem')  || {}).value || '';
  const toYear   = (document.getElementById('wizPromToYear')   || {}).value || '';
  const toSem    = (document.getElementById('wizPromToSem')    || {}).value || '';

  const mapping = [];
  document.querySelectorAll('.promKelasCheck').forEach(function(cb){
    if(!cb.checked) return;
    const from  = cb.getAttribute('data-from');
    const row   = cb.closest('.prom-row');
    const input = row ? row.querySelector('.promKelasTarget') : null;
    const to    = input ? input.value.trim() : '';
    if(to) mapping.push({ from: from, to: to });
  });

  // Kelas baru (angkatan baru) dari input Section ②
  const newKelasRaw = ((document.getElementById('wizNewKelasInput') || {}).value || '');
  const newKelas = newKelasRaw.split(',').map(function(k){ return k.trim(); }).filter(Boolean);

  // Mapel baru dari input Section ③
  const mapelRaw = ((document.getElementById('wizNewMapelInput') || {}).value || '');
  const mapelBaru = mapelRaw ? mapelRaw.split(',').map(function(m){ return m.trim(); }).filter(Boolean) : null;

  if(!fromYear || !fromSem || !toYear || !toSem || (mapping.length === 0 && newKelas.length === 0)){
    return showAcademicToast('Pilih minimal satu kelas yang dicentang atau tambahkan kelas baru', 'warning');
  }
  if(!confirm('Proses ini akan:\n• Memindahkan siswa sesuai pemetaan kelas di atas\n• Memperbarui daftar kelas yang Anda ajar di tahun baru\n\nJurnal/absensi lama TIDAK dihapus.\nLanjutkan?')) return;

  startProgress();
  google.script.run
    .withSuccessHandler(function(res){
      endProgress();
      closeAcademicModal();
      refreshAcademicQuickInfo();
      if(typeof loadSettingForm === 'function') loadSettingForm();
      var msg = '✅ Promosi selesai. Siswa diproses: ' + (res.processed || 0) +
        ' | Kelas baru disiapkan: ' + ((res.all_new_kelas || []).join(', ') || '-');
      showAcademicToast(msg, 'success', 9000);
      if((res.kelas_perlu_siswa_baru || []).length){
        setTimeout(function(){
          showAcademicToast('📂 Kelas ' + res.kelas_perlu_siswa_baru.join(', ') + ' memerlukan upload siswa baru. Gunakan tombol "Upload Siswa" di Setting.', 'info', 10000);
        }, 1000);
      }
      // Ikut naikkan siswa binaan (jurnal Guru Wali) dengan pemetaan yang sama,
      // supaya riwayat kelas 7/8/9 siswa binaan ikut tercatat tanpa upload ulang.
      // Best-effort: kalau guru ini tidak pakai fitur Guru Wali, cukup diabaikan.
      if(mapping.length && typeof google !== 'undefined'){
        google.script.run
          .withSuccessHandler(function(rb){
            if(rb && rb.processed) showAcademicToast('👨‍👩‍👧 Siswa binaan (Guru Wali) ikut naik kelas: ' + rb.processed + (rb.lulus ? ' | Lulus: ' + rb.lulus : ''), 'info', 8000);
          })
          .withFailureHandler(function(){ /* silent — fitur Guru Wali opsional */ })
          .promoteSiswaBinaan({ from_tahun: fromYear, to_tahun: toYear, mapping: mapping });
      }
    })
    .withFailureHandler(function(err){ endProgress(); showAcademicToast('Gagal promosi: ' + err.message, 'error'); })
    .promoteSiswaWizard({
      from_tahun    : fromYear,
      from_semester : fromSem,
      to_tahun      : toYear,
      to_semester   : toSem,
      mapping       : mapping,
      new_kelas     : newKelas,
      mapel_baru    : mapelBaru
    });
}

/**
 * loadRiwayatTahunAjaran_()
 * Modal "Lihat Tahun Sebelumnya" — murni baca, tidak mengubah periode
 * aktif guru sama sekali. Dipanggil saat modal dibuka & saat ganti pilihan periode.
 */
function loadRiwayatTahunAjaran_(){
  const sel = document.getElementById('wizRiwayatPeriod');
  if(!sel || !sel.value) return;
  const parts = sel.value.split('|');
  const box = document.getElementById('wizRiwayatResult');
  if(!box) return;
  box.innerHTML = '<p class="muted">Memuat...</p>';
  google.script.run
    .withSuccessHandler(function(res){
      window._riwayatPeriod = { tahun: parts[0], semester: parts[1] };
      const siswaPerKelas = res.siswa_per_kelas || {};
      const kelasList = res.kelas_diampu || [];
      const mapelList = res.mapel_diampu || [];
      const kelasRows = kelasList.map(function(k){
        return '<tr><td>' + _escSetting_(k) + '</td><td>' + (siswaPerKelas[k] || 0) + '</td></tr>';
      }).join('') || '<tr><td colspan="2" class="muted">Tidak ada kelas tercatat</td></tr>';

      let html =
        '<p><b>Mapel Diampu:</b> ' + (mapelList.join(', ') || '-') + '</p>' +
        '<p><b>Jadwal Hari/Jam:</b> ' + (res.jadwal_count || 0) + ' entri</p>' +
        '<table><thead><tr><th>Kelas</th><th>Jumlah Siswa</th></tr></thead><tbody>' + kelasRows + '</tbody></table>';

      if(kelasList.length && mapelList.length){
        html +=
          '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb">' +
            '<label>Lihat Daftar Nilai</label>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
              '<select id="wizRiwayatKelas">' + kelasList.map(function(k){ return '<option>' + _escSetting_(k) + '</option>'; }).join('') + '</select>' +
              '<select id="wizRiwayatMapel">' + mapelList.map(function(m){ return '<option>' + _escSetting_(m) + '</option>'; }).join('') + '</select>' +
              '<button type="button" class="ghost" onclick="loadRiwayatNilai_()">Tampilkan Nilai</button>' +
            '</div>' +
            '<div id="wizRiwayatNilaiResult" style="margin-top:10px"></div>' +
          '</div>';
      }

      box.innerHTML = html;
    })
    .withFailureHandler(function(err){ box.innerHTML = '<p style="color:red">Gagal: ' + (err.message || err) + '</p>'; })
    .getAcademicHistorySummary(parts[0], parts[1]);
}

/**
 * loadRiwayatNilai_()
 * Daftar nilai (baca-saja) untuk 1 kelas+mapel di periode yang sedang
 * dilihat di modal "Lihat Tahun Sebelumnya". Pakai getRankingNilai() yang
 * sudah ada (dipakai juga oleh tab Input Nilai), tidak ada endpoint baru.
 */
function loadRiwayatNilai_(){
  const p = window._riwayatPeriod;
  const kelasEl = document.getElementById('wizRiwayatKelas');
  const mapelEl = document.getElementById('wizRiwayatMapel');
  const box = document.getElementById('wizRiwayatNilaiResult');
  if(!p || !kelasEl || !mapelEl || !box) return;
  box.innerHTML = '<p class="muted">Memuat nilai...</p>';
  google.script.run
    .withSuccessHandler(function(rows){
      if(!rows || !rows.length){
        box.innerHTML = '<p class="muted">Belum ada nilai tersimpan untuk kelas &amp; mapel ini.</p>';
        return;
      }
      const trs = rows.map(function(r){
        const nilai = (r.nilai_akhir !== null && r.nilai_akhir !== '' && r.nilai_akhir !== undefined) ? r.nilai_akhir : '-';
        return '<tr><td>' + (r.ranking != null ? r.ranking : '-') + '</td><td>' + _escSetting_(r.nama_siswa || '-') + '</td><td>' + _escSetting_(r.nis || '-') + '</td><td>' + nilai + '</td></tr>';
      }).join('');
      box.innerHTML =
        '<table><thead><tr><th>Rank</th><th>Nama</th><th>NIS</th><th>Nilai Akhir</th></tr></thead><tbody>' + trs + '</tbody></table>';
    })
    .withFailureHandler(function(err){ box.innerHTML = '<p style="color:red">Gagal memuat nilai: ' + (err.message || err) + '</p>'; })
    .getRankingNilai(kelasEl.value, mapelEl.value, p.tahun, p.semester);
}
