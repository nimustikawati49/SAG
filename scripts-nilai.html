<script>
/** Normalisasi nilai semester ke 'Ganjil' atau 'Genap' */
function normalizeSemester_(raw) {
  const s = String(raw || '').toLowerCase().trim();
  // Genap: mengandung 'genap', 'ii', diakhiri ' 2', atau tepat '2'
  if (s.includes('genap') || s.includes('ii') || s === '2' || s.endsWith(' 2')) return 'Genap';
  // Ganjil: mengandung 'ganjil', diakhiri ' i' / ' 1', atau tepat 'i'/'1'
  if (s.includes('ganjil') || s.endsWith(' i') || s === 'i' || s === '1' || s.endsWith(' 1')) return 'Ganjil';
  return raw; // kembalikan apa adanya
}

function _setMuatBtn_(ready) {
  const btn = document.getElementById('btnMuatNilai');
  if (!btn) return;
  if (ready) {
    btn.disabled = false;
    btn.title = '';
    btn.style.opacity = '';
  } else {
    btn.disabled = true;
    btn.title = 'Menunggu data setting...';
    btn.style.opacity = '0.5';
  }
}

function _semesterOptionsHtml_nilai_(selected) {
  const norm = normalizeSemester_(selected);
  return '<option value="Ganjil"' + (norm === 'Ganjil' ? ' selected' : '') + '>Ganjil</option>' +
         '<option value="Genap"'  + (norm === 'Genap'  ? ' selected' : '') + '>Genap</option>';
}

/** true jika tahun/semester yang dipilih di tab Nilai = periode aktif guru saat ini */
function _isActiveNilaiPeriode_(tahun, semester) {
  const cache = window._settingCache || {};
  const activeTahun = String(cache.tahun_pelajaran || '').trim();
  const activeSem   = normalizeSemester_(cache.semester);
  return String(tahun || '').trim() === activeTahun && String(semester || '').trim() === activeSem;
}

/**
 * initTabNilai()
 * Tahun Pelajaran & Semester TIDAK lagi terkunci ke periode aktif saja —
 * guru bisa membuka/mengisi nilai periode manapun yang pernah tercatat
 * (mis. nilai kelas 7 tahun lalu), sesuai tingkat kelas siswa saat itu.
 * Kelas & Mapel ikut dimuat ulang setiap kali periode berubah.
 */
// (filterStatusStart_/filterStatusStop_ — versi generik dipakai di sini —
// didefinisikan di scripts-init.html, dipakai ulang oleh banyak tab lain
// yang punya filter cascading, bukan spesifik ke Nilai saja.)

// Kalau Mapel cuma 1 pilihan, langsung dipakai TANPA perlu dipilih ulang
// user (dropdown dikunci/disabled, bukan sekadar di-default) — kalau ada
// 2+ baru tampil sebagai pilihan aktif seperti biasa.
function _isiMapelSelect_(sel, mapels) {
  if (mapels.length === 1) {
    sel.innerHTML = '<option value="' + mapels[0] + '" selected>' + mapels[0] + '</option>';
    sel.disabled = true;
  } else {
    sel.disabled = false;
    sel.innerHTML = '<option value="">-- Pilih Mapel --</option>' +
      mapels.map(m => '<option value="' + m + '">' + m + '</option>').join('');
  }
}

function initTabNilai() {
  _setMuatBtn_(false);
  filterStatusStart_('nilaiFilterStatus', '⏳ Memuat pilihan tahun & semester...');

  const ensureSettingCache = (cb) => {
    if (window._settingCache) { cb(window._settingCache); return; }
    google.script.run
      .withSuccessHandler(s => { window._settingCache = s || {}; cb(window._settingCache); })
      .withFailureHandler(() => cb({}))
      .getSetting();
  };

  ensureSettingCache(() => {
    google.script.run
      .withSuccessHandler(res => {
        const periods = (res && res.periods) || [];
        const active  = (res && res.active) || {};

        const tahunList = [...new Set(periods.map(p => p.tahun).filter(Boolean))];
        if (active.tahun && tahunList.indexOf(active.tahun) === -1) tahunList.unshift(active.tahun);
        tahunList.sort().reverse();

        const tSel = document.getElementById('nilaiTahunInput');
        if (tSel) {
          tSel.innerHTML = tahunList.length
            ? tahunList.map(y => '<option value="' + y + '">' + y + '</option>').join('')
            : '<option value="">-- Tidak ada data --</option>';
          if (active.tahun) tSel.value = active.tahun;
        }
        const sSel = document.getElementById('nilaiSemesterSelect');
        if (sSel) sSel.innerHTML = _semesterOptionsHtml_nilai_(active.semester);

        refreshNilaiKelasDropdown_();
      })
      .withFailureHandler(err => {
        console.error('[NILAI] getRiwayatPeriodeNilai:', err && err.message);
        filterStatusStop_('nilaiFilterStatus');
        const cache = window._settingCache || {};
        const tSel = document.getElementById('nilaiTahunInput');
        if (tSel) tSel.innerHTML = '<option value="' + (cache.tahun_pelajaran || '') + '">' + (cache.tahun_pelajaran || '-') + '</option>';
        const sSel = document.getElementById('nilaiSemesterSelect');
        if (sSel) sSel.innerHTML = _semesterOptionsHtml_nilai_(cache.semester);
        refreshNilaiKelasDropdown_();
      })
      .getRiwayatPeriodeNilai();
  });
}

/** Dipanggil saat dropdown Tahun Pelajaran / Semester berubah */
function onNilaiPeriodeChange_() {
  refreshNilaiKelasDropdown_();
}

/** Muat ulang daftar Kelas sesuai Tahun/Semester yang dipilih */
function refreshNilaiKelasDropdown_() {
  const tahun = (document.getElementById('nilaiTahunInput') || {}).value || '';
  const sem   = (document.getElementById('nilaiSemesterSelect') || {}).value || '';
  const sel   = document.getElementById('nilaiKelasSelect');
  if (!sel) return;
  if (!tahun || !sem) {
    sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    _setMuatBtn_(false);
    filterStatusStop_('nilaiFilterStatus');
    return;
  }

  _setMuatBtn_(false);
  sel.innerHTML = '<option value="">Memuat...</option>';
  filterStatusStart_('nilaiFilterStatus', '⏳ Memuat daftar kelas...');
  google.script.run
    .withSuccessHandler(list => {
      sel.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
        (list || []).map(k => '<option value="' + k + '">' + k + '</option>').join('');
      refreshNilaiMapelDropdown_();
    })
    .withFailureHandler(err => {
      console.error('[NILAI] getKelasNilaiUntukPeriode:', err && err.message);
      filterStatusStop_('nilaiFilterStatus');
      sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      _setMuatBtn_(true);
    })
    .getKelasNilaiUntukPeriode(tahun, sem);
}

/** Daftar mapel guru (dari Setting) kalau punya persis 1 mapel — sumber sama dengan Modul Ajar (getMapelListGuru) */
function _mapelTunggalGuru_() {
  const cache = window._settingCache || {};
  const raw = String(cache.mata_pelajaran || '').split(/,\s*/).map(m => m.trim()).filter(Boolean);
  // Dedupe case-insensitive — kolom Mata Pelajaran di Setting kadang
  // ke-input dobel/beda kapital ("IPA, IPA" / "IPA, ipa") padahal
  // sebenarnya cuma 1 mapel yang diampu.
  const seen = new Set();
  const unique = [];
  raw.forEach(m => {
    const key = m.toLowerCase();
    if (!seen.has(key)) { seen.add(key); unique.push(m); }
  });
  return unique;
}

/** Muat ulang daftar Mapel sesuai Kelas/Tahun/Semester yang dipilih */
function refreshNilaiMapelDropdown_() {
  const tahun = (document.getElementById('nilaiTahunInput') || {}).value || '';
  const sem   = (document.getElementById('nilaiSemesterSelect') || {}).value || '';
  const kelas = (document.getElementById('nilaiKelasSelect') || {}).value || '';
  const sel   = document.getElementById('nilaiMapelSelect');
  if (!sel) return;

  // Guru yang cuma ampu 1 mapel: langsung kunci begitu Setting termuat,
  // tidak perlu menunggu Kelas dipilih dulu ataupun panggilan server —
  // mapelnya sudah pasti itu-itu saja di kelas manapun.
  const mapelTunggal = _mapelTunggalGuru_();
  if (mapelTunggal.length === 1) {
    _isiMapelSelect_(sel, mapelTunggal);
    _setMuatBtn_(!!kelas);
    filterStatusStop_('nilaiFilterStatus');
    return;
  }

  if (!kelas) {
    sel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
    _setMuatBtn_(true);
    filterStatusStop_('nilaiFilterStatus');
    return;
  }

  sel.innerHTML = '<option value="">Memuat...</option>';
  filterStatusStart_('nilaiFilterStatus', '⏳ Memuat daftar mapel...');
  google.script.run
    .withSuccessHandler(list => {
      filterStatusStop_('nilaiFilterStatus');
      _isiMapelSelect_(sel, list || []);
      _setMuatBtn_(true);
    })
    .withFailureHandler(err => {
      console.error('[NILAI] getMapelNilaiUntukPeriode:', err && err.message);
      filterStatusStop_('nilaiFilterStatus');
      sel.disabled = false;
      sel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
      _setMuatBtn_(true);
    })
    .getMapelNilaiUntukPeriode(kelas, tahun, sem);
}

/* =====================================================================
   MONITORING: RIWAYAT NILAI — cek kelengkapan nilai murni per kelas.
   Numpang lengkap ke server function yang sama dengan tab Input Nilai
   (getRiwayatPeriodeNilai/getKelasNilaiUntukPeriode/
   getMapelNilaiUntukPeriode/getDataSiswaUntukNilai/getNilaiBundle) —
   endpoint yang sama, sudah terbukti reliable, cuma cara tampilnya beda
   (baca-saja, tanpa edit/Katrol/draft).
   ===================================================================== */
function initMonitoringNilai() {
  filterStatusStart_('monNilaiFilterStatus', '⏳ Memuat pilihan tahun & semester...');
  const ensureSettingCache = (cb) => {
    if (window._settingCache) { cb(window._settingCache); return; }
    google.script.run
      .withSuccessHandler(s => { window._settingCache = s || {}; cb(window._settingCache); })
      .withFailureHandler(() => cb({}))
      .getSetting();
  };

  ensureSettingCache(() => {
    google.script.run
      .withSuccessHandler(res => {
        const periods = (res && res.periods) || [];
        const active  = (res && res.active) || {};

        const tahunList = [...new Set(periods.map(p => p.tahun).filter(Boolean))];
        if (active.tahun && tahunList.indexOf(active.tahun) === -1) tahunList.unshift(active.tahun);
        tahunList.sort().reverse();

        const tSel = document.getElementById('monNilaiTahunInput');
        if (tSel) {
          tSel.innerHTML = tahunList.length
            ? tahunList.map(y => '<option value="' + y + '">' + y + '</option>').join('')
            : '<option value="">-- Tidak ada data --</option>';
          if (active.tahun) tSel.value = active.tahun;
        }
        const sSel = document.getElementById('monNilaiSemesterSelect');
        if (sSel) sSel.innerHTML = _semesterOptionsHtml_nilai_(active.semester);

        refreshMonNilaiKelasDropdown_();
      })
      .withFailureHandler(err => {
        console.error('[MON-NILAI] getRiwayatPeriodeNilai:', err && err.message);
        filterStatusStop_('monNilaiFilterStatus');
        const cache = window._settingCache || {};
        const tSel = document.getElementById('monNilaiTahunInput');
        if (tSel) tSel.innerHTML = '<option value="' + (cache.tahun_pelajaran || '') + '">' + (cache.tahun_pelajaran || '-') + '</option>';
        const sSel = document.getElementById('monNilaiSemesterSelect');
        if (sSel) sSel.innerHTML = _semesterOptionsHtml_nilai_(cache.semester);
        refreshMonNilaiKelasDropdown_();
      })
      .getRiwayatPeriodeNilai();
  });
}

function onMonNilaiPeriodeChange_() {
  refreshMonNilaiKelasDropdown_();
}

function refreshMonNilaiKelasDropdown_() {
  const tahun = (document.getElementById('monNilaiTahunInput') || {}).value || '';
  const sem   = (document.getElementById('monNilaiSemesterSelect') || {}).value || '';
  const sel   = document.getElementById('monNilaiKelasSelect');
  const btn   = document.getElementById('btnMonMuatNilai');
  if (!sel) return;
  if (!tahun || !sem) {
    sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    if (btn) btn.disabled = true;
    filterStatusStop_('monNilaiFilterStatus');
    return;
  }
  if (btn) btn.disabled = true;
  sel.innerHTML = '<option value="">Memuat...</option>';
  filterStatusStart_('monNilaiFilterStatus', '⏳ Memuat daftar kelas...');
  google.script.run
    .withSuccessHandler(list => {
      sel.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
        (list || []).map(k => '<option value="' + k + '">' + k + '</option>').join('');
      refreshMonNilaiMapelDropdown_();
    })
    .withFailureHandler(err => {
      console.error('[MON-NILAI] getKelasNilaiUntukPeriode:', err && err.message);
      filterStatusStop_('monNilaiFilterStatus');
      sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    })
    .getKelasNilaiUntukPeriode(tahun, sem);
}

function refreshMonNilaiMapelDropdown_() {
  const tahun = (document.getElementById('monNilaiTahunInput') || {}).value || '';
  const sem   = (document.getElementById('monNilaiSemesterSelect') || {}).value || '';
  const kelas = (document.getElementById('monNilaiKelasSelect') || {}).value || '';
  const sel   = document.getElementById('monNilaiMapelSelect');
  const btn   = document.getElementById('btnMonMuatNilai');
  if (!sel) return;

  const mapelTunggal = _mapelTunggalGuru_();
  if (mapelTunggal.length === 1) {
    _isiMapelSelect_(sel, mapelTunggal);
    if (btn) btn.disabled = !kelas;
    filterStatusStop_('monNilaiFilterStatus');
    return;
  }

  if (!kelas) {
    sel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
    if (btn) btn.disabled = true;
    filterStatusStop_('monNilaiFilterStatus');
    return;
  }
  sel.innerHTML = '<option value="">Memuat...</option>';
  filterStatusStart_('monNilaiFilterStatus', '⏳ Memuat daftar mapel...');
  google.script.run
    .withSuccessHandler(list => {
      filterStatusStop_('monNilaiFilterStatus');
      _isiMapelSelect_(sel, list || []);
      if (btn) btn.disabled = false;
    })
    .withFailureHandler(err => {
      console.error('[MON-NILAI] getMapelNilaiUntukPeriode:', err && err.message);
      filterStatusStop_('monNilaiFilterStatus');
      sel.disabled = false;
      sel.innerHTML = '<option value="">-- Pilih Mapel --</option>';
    })
    .getMapelNilaiUntukPeriode(kelas, tahun, sem);
}

function muatMonitoringNilai() {
  const kelas = (document.getElementById('monNilaiKelasSelect')  || {}).value || '';
  const mapel = (document.getElementById('monNilaiMapelSelect')  || {}).value || '';
  const tahun = (document.getElementById('monNilaiTahunInput')   || {}).value || '';
  const sem   = (document.getElementById('monNilaiSemesterSelect')|| {}).value || '';
  const wrap  = document.getElementById('monNilaiWrap');
  if (!kelas || !mapel || !tahun || !sem) { alert('Pilih Tahun Pelajaran, Semester, Kelas, dan Mapel terlebih dahulu'); return; }

  const isActivePeriode = _isActiveNilaiPeriode_(tahun, sem);
  const btn = document.getElementById('btnMonMuatNilai');
  if (btn) btn.disabled = true;
  if (typeof startProgress === 'function') startProgress();
  const stopElapsed = startElapsedNotice_(btn, '⏳ Memuat...');
  if (wrap) wrap.innerHTML = '<p class="muted">⏳ Memuat data...</p>';

  const done = { siswa: isActivePeriode ? false : true, nilai: false, setting: false };
  let siswaData = [], nilaiData = [], kkmValue = 70;

  const tryRender = () => {
    if (!done.siswa || !done.nilai || !done.setting) return;
    stopElapsed();
    if (typeof endProgress === 'function') endProgress();
    if (btn) { btn.disabled = false; btn.textContent = '🔎 Tampilkan'; }

    const nilaiMap = {};
    nilaiData.forEach(n => { if (n.nis) nilaiMap[String(n.nis).trim()] = n; });

    const rows = siswaData.map(s => {
      const saved = nilaiMap[String(s.nis || '').trim()] || {};
      const raw = {
        nis: s.nis, nama_siswa: s.nama,
        tgs1: saved.tgs1, tgs2: saved.tgs2, tgs3: saved.tgs3,
        tgsk1: saved.tgsk1, tgsk2: saved.tgsk2, tgsk3: saved.tgsk3,
        uh1: saved.uh1, uh2: saved.uh2, uh3: saved.uh3,
        pts: saved.pts, pas: saved.pas, pat: saved.pat
      };
      // Hitung ULANG rata_uh/nilai_asli dari komponen mentah, jangan
      // percaya kolom tersimpan — bisa basi kalau baris itu terakhir
      // disimpan sebelum formula nilai_asli direnormalisasi.
      const calc = nilaiHitungRow_(raw, sem);
      raw.rata_uh = calc.rata_uh;
      raw.nilai_asli = calc.nilai_asli;
      return raw;
    });

    _renderMonitoringNilaiTable_(rows, sem, kkmValue);
  };

  if (isActivePeriode) {
    google.script.run
      .withSuccessHandler(d => { siswaData = d || []; done.siswa = true; tryRender(); })
      .withFailureHandler(e => {
        console.error('[MON-NILAI] getDataSiswaUntukNilai:', e && e.message);
        siswaData = []; done.siswa = true; tryRender();
      })
      .getDataSiswaUntukNilai(kelas);
  }

  google.script.run
    .withSuccessHandler(d => {
      nilaiData = d?.rows || [];
      if (!isActivePeriode) {
        siswaData = nilaiData
          .map(n => ({ nis: n.nis, nama: n.nama_siswa }))
          .sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || '')));
        done.siswa = true;
      }
      done.nilai = true;
      tryRender();
    })
    .withFailureHandler(e => {
      console.error('[MON-NILAI] getNilaiBundle:', e && e.message);
      nilaiData = [];
      if (!isActivePeriode) { siswaData = []; done.siswa = true; }
      done.nilai = true;
      tryRender();
    })
    .getNilaiBundle(kelas, mapel, tahun, sem);

  // KKM khusus kelas+mapel ini (SETTING_NILAI) — dipakai utk Tuntas/Belum
  // Tuntas di kartu statistik Nilai Murni, sama sumbernya dgn kartu KKM di
  // Input Nilai (bukan 70 generik).
  google.script.run
    .withSuccessHandler(s => { kkmValue = Number((s && s.kkm) || 70); done.setting = true; tryRender(); })
    .withFailureHandler(() => { kkmValue = 70; done.setting = true; tryRender(); })
    .getSettingNilai(kelas, mapel, tahun, sem);
}

// Sel ditandai ⚠️ HANYA kalau kosong DAN ada siswa lain di kelas/mapel
// yang sama sudah punya nilai untuk komponen itu (relatif terhadap
// teman sekelas) — bukan sekadar kosong sendirian (itu wajar kalau
// memang belum ada satu pun yang dinilai untuk komponen itu).
function _renderMonitoringNilaiTable_(rows, semester, kkm) {
  const wrap = document.getElementById('monNilaiWrap');
  if (!wrap) return;
  if (!rows.length) {
    wrap.innerHTML = '<p class="muted">📭 Belum ada siswa di kelas ini.</p>';
    return;
  }
  const isGenap = String(semester || '').toLowerCase().includes('genap');
  const labelUas = isGenap ? 'ASAT' : 'SAS';
  const isEmpty_ = v => v === null || v === undefined || v === '';
  const avg = arr => {
    const nums = arr.filter(v => !isEmpty_(v)).map(Number).filter(n => !isNaN(n));
    return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
  };

  rows.forEach(r => {
    r._tgsM = avg([r.tgs1, r.tgs2, r.tgs3]);
    r._tgsK = avg([r.tgsk1, r.tgsk2, r.tgsk3]);
    r._uas  = isGenap ? r.pat : r.pas;
  });

  const checkCols = ['_tgsM', '_tgsK', 'uh1', 'uh2', 'uh3', 'pts', '_uas'];
  const colLabel  = { _tgsM: 'Tugas Mandiri', _tgsK: 'Tugas Kelompok', uh1: 'UH1', uh2: 'UH2', uh3: 'UH3', pts: 'PTS', _uas: labelUas };
  const hasAny = {};
  checkCols.forEach(k => { hasAny[k] = rows.some(r => !isEmpty_(r[k])); });

  const fmt = v => isEmpty_(v) ? '-' : (Math.round(Number(v) * 100) / 100);
  const esc = s => String(s || '-').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cell = (key, r) => {
    const val = r[key];
    const warn = isEmpty_(val) && hasAny[key];
    return warn
      ? '<td style="text-align:center;background:#fef3c7" title="Sebagian besar teman sekelas sudah punya nilai ' + colLabel[key] + ', siswa ini belum">' + fmt(val) + ' ⚠️</td>'
      : '<td style="text-align:center">' + fmt(val) + '</td>';
  };

  // Ringkasan di atas tabel: berapa siswa yang belum punya nilai per
  // komponen (relatif — cuma dihitung utk komponen yang SUDAH diisi
  // sebagian besar teman sekelasnya, sama seperti logika ⚠️ di tiap sel).
  let summaryHtml = '';
  const missingList = checkCols
    .filter(k => hasAny[k])
    .map(k => ({ label: colLabel[k], jumlah: rows.filter(r => isEmpty_(r[k])).length }))
    .filter(m => m.jumlah > 0);
  if (missingList.length) {
    summaryHtml = '<div style="background:#fef3c7;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.7">' +
      '<b>⚠️ Ringkasan kelengkapan nilai:</b> ' +
      missingList.map(m => esc(m.label) + ' <b>' + m.jumlah + ' siswa</b> belum').join(', ') +
      '.</div>';
  }

  // Halaman ini baca-saja Nilai MURNI (sebelum Katrol) — jadi kartu
  // statistik di sini SENGAJA dari nilai_asli, bukan nilai_akhir, supaya
  // guru bisa lihat capaian KKTP murni sebelum disesuaikan Katrol. Sama
  // gaya kartunya dengan statistik di Input Nilai, cuma sumber datanya
  // beda (murni vs katrol).
  const kktpVals = rows.map(r => r.nilai_asli).filter(v => !isEmpty_(v)).map(Number).filter(n => !isNaN(n));
  if (kktpVals.length) {
    const kkmMurni = Number(kkm || 70);
    const rataMurni = kktpVals.reduce((a, b) => a + b, 0) / kktpVals.length;
    const tuntasMurni = kktpVals.filter(v => v >= kkmMurni).length;
    const kktpBand = _kktpBandDariNilai_(rataMurni);
    const statCard = (label, value, color) =>
      '<div class="card" style="text-align:center;padding:12px 6px;margin:0">' +
        '<div class="muted" style="font-size:11px">' + label + '</div>' +
        '<div style="font-size:20px;font-weight:700;color:' + color + '">' + value + '</div>' +
      '</div>';
    summaryHtml += '<div class="muted" style="font-size:11px;margin:4px 0">📊 Statistik Nilai Murni (sebelum Katrol):</div>' +
      '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px">' +
        statCard('Rata-rata Kelas', rataMurni.toFixed(2), '#6C63FF') +
        statCard('Nilai Tertinggi', Math.max(...kktpVals).toFixed(2), '#22c55e') +
        statCard('Nilai Terendah', Math.min(...kktpVals).toFixed(2), '#ef4444') +
        statCard('Tuntas (≥ KKM)', tuntasMurni, '#22c55e') +
        statCard('Belum Tuntas', kktpVals.length - tuntasMurni, '#ef4444') +
        statCard('% KKTP Kelas', rataMurni.toFixed(0) + '%<div class="muted" style="font-size:9.5px;font-weight:400">' + kktpBand.status + ' (' + kktpBand.kode + ')</div>', kktpBand.color) +
      '</div>';
  } else {
    // Jangan diam-diam sembunyikan kartu — jelaskan PERSISNYA kenapa belum
    // bisa dihitung, supaya guru tidak perlu menebak-nebak kenapa statistik
    // tidak muncul padahal tabel di bawah sudah terisi.
    summaryHtml += '<div class="alert-banner info" style="margin-bottom:14px">' +
      'ℹ️ <b>Statistik Nilai Murni belum bisa dihitung</b> — kolom <b>Nilai Akhir</b> di tabel bawah masih "-" untuk semua ' + rows.length + ' siswa ' +
      '(Nilai Total/nilai_asli belum tersimpan sama sekali untuk kelas+mapel+periode ini). ' +
      'Buka Input Nilai untuk kelas ini, pastikan ada yang terisi (minimal salah satu dari UH/Tugas/PTS/SAS/ASAT), lalu klik <b>💾 Simpan Nilai</b> — setelah itu kembali ke sini.' +
      '</div>';
  }

  let html = summaryHtml + '<div class="table-wrap"><table><thead><tr>' +
    '<th>No</th><th>NIS</th><th class="left">Nama Siswa</th>' +
    '<th>Tugas Mandiri</th><th>Tugas Kelompok</th>' +
    '<th>UH1</th><th>UH2</th><th>UH3</th>' +
    '<th>PTS</th><th>' + labelUas + '</th>' +
    '<th>Rata Harian</th><th>Nilai Akhir</th>' +
  '</tr></thead><tbody>';

  rows.forEach((r, i) => {
    html += '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + esc(r.nis) + '</td>' +
      '<td class="left">' + esc(r.nama_siswa) + '</td>' +
      cell('_tgsM', r) + cell('_tgsK', r) +
      cell('uh1', r) + cell('uh2', r) + cell('uh3', r) +
      cell('pts', r) + cell('_uas', r) +
      '<td style="text-align:center">' + fmt(r.rata_uh) + '</td>' +
      '<td style="text-align:center;font-weight:700">' + fmt(r.nilai_asli) + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

function updateNilaiKelengkapanInfo_() {
  const el = document.getElementById('nilaiKelengkapanInfo');
  if (!el) return;
  const rows = nilaiState.rows || [];
  if (!rows.length) {
    el.textContent = 'Kelengkapan: -';
    el.style.background = '#eef2ff';
    el.style.color = '#3730a3';
    return;
  }

  const isGenap = String(nilaiState.semester || '').toLowerCase().includes('genap');
  const requiredFields = ['tgs1','tgs2','tgs3','uh1','uh2','uh3','pts', isGenap ? 'pat' : 'pas'];

  let kosong = 0;
  rows.forEach(r => {
    requiredFields.forEach(f => {
      const v = r[f];
      if (v === null || v === undefined || String(v).trim() === '') kosong++;
    });
  });

  const total = rows.length * requiredFields.length;
  const terisi = total - kosong;
  const persen = total > 0 ? Math.round((terisi / total) * 100) : 0;

  el.textContent = `Kelengkapan: ${terisi}/${total} (${persen}%) • Kosong: ${kosong}`;
  if (kosong === 0) {
    el.style.background = '#dcfce7';
    el.style.color = '#166534';
  } else if (persen >= 70) {
    el.style.background = '#fef3c7';
    el.style.color = '#92400e';
  } else {
    el.style.background = '#fee2e2';
    el.style.color = '#991b1b';
  }
}

const NILAI_DRAFT_VERSION = 1;
const NILAI_DRAFT_FIELDS = ['uh1','uh2','uh3','tgs1','tgs2','tgs3','tgsk1','tgsk2','tgsk3','pts','pas','pat','nilai_remedial'];
let _nilaiAutosaveTimer = null;

/** State terpusat untuk tab Input Nilai */
let nilaiState = {
  kelas          : '',
  mapel          : '',
  tahun          : '',
  semester       : '',
  rows           : [],       // array of row objects {no_absen,nis,nama_siswa,jk,...}
  locked         : true,     // true = tampilan terkunci / read-only
  isDirty        : false,    // ada perubahan belum tersimpan
  dataVersion    : 0,
  lastAutosaveAt : 0,
  focusKomponen  : 'all',    // 'all' | 'uh1' | 'tgs1' | dll
  setting        : {},       // hasil getSettingNilai (kkm, nilai_min_target, dst)
  cetakPreviewOk : false,
  colVis         : { tgsk: false, rataDetail: false } // kolom opsional yang boleh disembunyikan
};

/** Dipanggil dari checkbox "Tampilkan kolom" di atas Tabel Nilai */
function toggleNilaiKolom_() {
  const tgskEl = document.getElementById('nilaiColTGSK');
  const rataEl = document.getElementById('nilaiColRataDetail');
  nilaiState.colVis.tgsk       = !!(tgskEl && tgskEl.checked);
  nilaiState.colVis.rataDetail = !!(rataEl && rataEl.checked);
  renderTabelNilai();
}

function setNilaiAutosaveInfo_(text, color) {
  const el = document.getElementById('nilaiAutosaveInfo');
  if (!el) return;
  el.textContent = text || 'Autosave: standby';
  el.style.color = color || '#6b7280';
}

function getNilaiDraftKey_(kelas, mapel, tahun, semester) {
  const parts = [kelas, mapel, tahun, semester]
    .map(v => String(v || '').trim().toLowerCase());
  if (parts.some(v => !v)) return '';
  return 'nilaiDraft:v' + NILAI_DRAFT_VERSION + ':' + parts.join('|');
}

function getNilaiDraftKeyFromState_() {
  return getNilaiDraftKey_(nilaiState.kelas, nilaiState.mapel, nilaiState.tahun, nilaiState.semester);
}

function sanitizeDraftNilai_(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (isNaN(n)) return '';
  const clamped = Math.min(100, Math.max(0, n));
  return Math.round(clamped * 100) / 100;
}

function scheduleNilaiAutosave_(delay = 1200) {
  if (!nilaiState.isDirty) return;
  if (_nilaiAutosaveTimer) clearTimeout(_nilaiAutosaveTimer);
  _nilaiAutosaveTimer = setTimeout(() => {
    _nilaiAutosaveTimer = null;
    saveNilaiDraftLocal_();
  }, delay);
}

function markNilaiDirty_() {
  nilaiState.isDirty = true;
  scheduleNilaiAutosave_();
}

function saveNilaiDraftLocal_() {
  const key = getNilaiDraftKeyFromState_();
  if (!key || !nilaiState.rows?.length || !nilaiState.isDirty) return;

  try {
    const payload = {
      v: NILAI_DRAFT_VERSION,
      savedAt: Date.now(),
      kelas: nilaiState.kelas,
      mapel: nilaiState.mapel,
      tahun: nilaiState.tahun,
      semester: nilaiState.semester,
      rows: nilaiState.rows.map(r => {
        const out = { nis: String(r.nis || ''), nama_siswa: String(r.nama_siswa || '') };
        NILAI_DRAFT_FIELDS.forEach(f => { out[f] = sanitizeDraftNilai_(r[f]); });
        return out;
      })
    };
    localStorage.setItem(key, JSON.stringify(payload));
    nilaiState.lastAutosaveAt = payload.savedAt;
    setNilaiAutosaveInfo_('Autosave: tersimpan ' + new Date(payload.savedAt).toLocaleTimeString('id-ID'), '#2563eb');
  } catch (e) {
    setNilaiAutosaveInfo_('Autosave: gagal menyimpan draft lokal', '#dc2626');
  }
}

function clearNilaiDraftLocal_() {
  const key = getNilaiDraftKeyFromState_();
  if (!key) return;
  try { localStorage.removeItem(key); } catch (_) {}
  nilaiState.isDirty = false;
  nilaiState.lastAutosaveAt = 0;
  setNilaiAutosaveInfo_('Autosave: tersinkron ke server', '#15803d');
}

function clearNilaiDraftManual_() {
  const key = getNilaiDraftKeyFromState_();
  if (!key) {
    alert('Muat data nilai terlebih dahulu.');
    return;
  }

  const draft = readNilaiDraftLocal_(nilaiState.kelas, nilaiState.mapel, nilaiState.tahun, nilaiState.semester);
  if (!draft) {
    setNilaiAutosaveInfo_('Autosave: tidak ada draft lokal', '#6b7280');
    if (typeof showSoftPopup === 'function') showSoftPopup('Info', 'Tidak ada draft lokal untuk dihapus');
    return;
  }

  const ok = confirm('Hapus draft autosave lokal untuk kelas/mapel ini?');
  if (!ok) return;

  try { localStorage.removeItem(key); } catch (_) {}
  nilaiState.lastAutosaveAt = 0;
  nilaiState.isDirty = false;
  setNilaiAutosaveInfo_('Autosave: draft lokal dihapus', '#6b7280');
  if (typeof showSoftPopup === 'function') showSoftPopup('Draft Dihapus', 'Draft autosave lokal berhasil dihapus');
}

function applyNilaiDraftToState_(draft, opts = {}) {
  if (!draft || !Array.isArray(draft.rows) || !draft.rows.length) return 0;
  const byNis = {};
  draft.rows.forEach(r => {
    const nis = String(r.nis || '').trim();
    if (nis) byNis[nis] = r;
  });

  let restored = 0;
  nilaiState.rows.forEach(r => {
    const nis = String(r.nis || '').trim();
    const d = byNis[nis];
    if (!d) return;

    NILAI_DRAFT_FIELDS.forEach(f => {
      if (d[f] !== undefined) r[f] = d[f];
    });
    const calc = nilaiHitungRow_(r, nilaiState.semester);
    Object.assign(r, calc);
    restored++;
  });

  if (restored > 0) {
    nilaiState.isDirty = true;
    nilaiState.lastAutosaveAt = Number(draft.savedAt || Date.now());
    nilaiHitungKatrolBatch_UI();
    // Draft yang dipulihkan mungkin bawa nilai tugas kelompok yang belum ada di data
    // sebelumnya — pastikan kolomnya ikut tampil supaya tidak ketutupan.
    if (!nilaiState.colVis.tgsk && nilaiState.rows.some(r =>
      (r.tgsk1 !== null && r.tgsk1 !== undefined && r.tgsk1 !== '') ||
      (r.tgsk2 !== null && r.tgsk2 !== undefined && r.tgsk2 !== '') ||
      (r.tgsk3 !== null && r.tgsk3 !== undefined && r.tgsk3 !== ''))) {
      nilaiState.colVis.tgsk = true;
      const tgskEl = document.getElementById('nilaiColTGSK');
      if (tgskEl) tgskEl.checked = true;
    }
    setNilaiEditMode_(false);
    updateStatistikUI_nilai();
    const infoText = opts.infoText || ('Autosave: draft dipulihkan (' + restored + ' siswa)');
    setNilaiAutosaveInfo_(infoText, '#92400e');
  }

  return restored;
}

function restoreNilaiDraftManual_() {
  const draft = readNilaiDraftLocal_(nilaiState.kelas, nilaiState.mapel, nilaiState.tahun, nilaiState.semester);
  if (!draft || !draft.rows?.length) {
    setNilaiAutosaveInfo_('Autosave: tidak ada draft lokal', '#6b7280');
    if (typeof showSoftPopup === 'function') showSoftPopup('Info', 'Tidak ada draft lokal untuk dipulihkan');
    return;
  }

  const savedAt = draft.savedAt ? new Date(draft.savedAt).toLocaleString('id-ID') : 'waktu tidak diketahui';
  const ok = confirm('Pulihkan draft autosave lokal (' + savedAt + ')?');
  if (!ok) return;

  const restored = applyNilaiDraftToState_(draft, { infoText: 'Autosave: draft dipulihkan manual (' + savedAt + ')' });
  if (!restored) {
    if (typeof showSoftPopup === 'function') showSoftPopup('Info', 'Tidak ada data siswa yang cocok untuk dipulihkan');
    return;
  }
  if (typeof showSoftPopup === 'function') {
    showSoftPopup('Draft Dipulihkan', restored + ' data siswa dipulihkan dari autosave');
  }
}

function readNilaiDraftLocal_(kelas, mapel, tahun, semester) {
  const key = getNilaiDraftKey_(kelas, mapel, tahun, semester);
  if (!key) return null;
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.rows)) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function nilaiSnapshotSignature_(rows) {
  return (rows || []).map(r => {
    const vals = [String(r.nis || '')];
    NILAI_DRAFT_FIELDS.forEach(f => vals.push(String(r[f] ?? '')));
    return vals.join('|');
  }).join('||');
}

function maybeRestoreNilaiDraft_() {
  const draft = readNilaiDraftLocal_(nilaiState.kelas, nilaiState.mapel, nilaiState.tahun, nilaiState.semester);
  if (!draft || !draft.rows?.length) {
    setNilaiAutosaveInfo_('Autosave: tidak ada draft lokal', '#6b7280');
    return;
  }

  const currentSig = nilaiSnapshotSignature_(nilaiState.rows);
  const draftSig   = nilaiSnapshotSignature_(draft.rows);
  if (currentSig === draftSig) {
    setNilaiAutosaveInfo_('Autosave: draft lokal sama dengan data saat ini', '#6b7280');
    return;
  }

  const savedAt = draft.savedAt ? new Date(draft.savedAt) : null;
  const stamp = savedAt ? savedAt.toLocaleString('id-ID') : 'waktu tidak diketahui';
  const ok = confirm('Ditemukan autosave lokal (' + stamp + '). Pulihkan pengerjaan terakhir?');
  if (!ok) {
    setNilaiAutosaveInfo_('Autosave: draft tersedia (belum dipulihkan)', '#b45309');
    return;
  }
  const restored = applyNilaiDraftToState_(draft);
  if (!restored) {
    setNilaiAutosaveInfo_('Autosave: draft tidak cocok dengan daftar siswa aktif', '#b45309');
    return;
  }
  if (typeof showSoftPopup === 'function') {
    showSoftPopup('Draft Dipulihkan', restored + ' data siswa dipulihkan dari autosave');
  }
}

window.addEventListener('beforeunload', () => {

/** Muat data siswa + nilai tersimpan + setting pengaturan */
function muatDataNilai(forceLocked = false) {
  const kelas = document.getElementById('nilaiKelasSelect').value;
  const mapel = (document.getElementById('nilaiMapelSelect')?.value || document.getElementById('nilaiMapelInput')?.value || '').trim();
  const tahun = (document.getElementById('nilaiTahunInput').value  || '').trim();
  const sem   = document.getElementById('nilaiSemesterSelect').value;

  if (!kelas) { alert('Pilih kelas terlebih dahulu'); return; }
  if (!mapel) { alert('Pilih mata pelajaran terlebih dahulu'); return; }
  if (!tahun || !sem) { alert('Tahun Pelajaran / Semester belum dimuat, coba lagi sesaat lagi.'); return; }

  nilaiState.kelas    = kelas;
  nilaiState.mapel    = mapel;
  nilaiState.tahun    = tahun;
  nilaiState.semester = sem;

  // Periode aktif (setting saat ini) ambil roster hidup dari sheet SISWA (bisa
  // tambah siswa baru). Periode riwayat (tahun/semester lalu) ambil roster dari
  // data nilai yang sudah tersimpan sendiri — sheet SISWA sudah berubah nama
  // kelasnya mengikuti kenaikan kelas periode aktif, jadi tidak bisa dipakai lagi
  // untuk merekonstruksi daftar siswa periode lama.
  const isActivePeriode = _isActiveNilaiPeriode_(tahun, sem);

  const btn = document.getElementById('btnMuatNilai');
  if (btn) btn.disabled = true;
  const stopMuatTimer = startElapsedNotice_(btn, '⏳ Memuat...');
  if (typeof startProgress === 'function') startProgress();

  const done = { siswa: isActivePeriode ? false : true, nilai: false, setting: false };
  let siswaData = [], nilaiData = [], nilaiVersion = 0, settingData = {};

  const tryRender = () => {
    if (!done.siswa || !done.nilai || !done.setting) return;
    if (typeof endProgress === 'function') endProgress();
    stopMuatTimer();
    if (btn) { btn.disabled = false; btn.textContent = '📂 Muat Data Siswa'; }

    const nilaiMap = {};
    nilaiData.forEach(n => { if (n.nis) nilaiMap[String(n.nis).trim()] = n; });

    nilaiState.setting = settingData;
    nilaiState.dataVersion = Number(nilaiVersion || 0);
    nilaiState.isDirty = false;
    nilaiState.lastAutosaveAt = 0;
    nilaiState.rows = siswaData.map(s => {
      const saved = nilaiMap[String(s.nis || '').trim()] || {};
      return {
        no_absen      : s.no_absen,
        nis           : s.nis,
        nama_siswa    : s.nama,
        jk            : s.jk,
        uh1           : saved.uh1  ?? '', uh2: saved.uh2 ?? '', uh3: saved.uh3 ?? '',
        tgs1          : saved.tgs1 ?? '', tgs2: saved.tgs2 ?? '', tgs3: saved.tgs3 ?? '',
        tgsk1         : saved.tgsk1 ?? '', tgsk2: saved.tgsk2 ?? '', tgsk3: saved.tgsk3 ?? '',
        pts           : saved.pts  ?? '',
        pas           : saved.pas  ?? '',
        pat           : saved.pat  ?? '',
        nilai_remedial: saved.nilai_remedial ?? '',
        rata_uh       : saved.rata_uh    ?? null,
        rata_tugas    : saved.rata_tugas  ?? null,
        nilai_fix     : saved.nilai_fix    ?? null,
        nilai_asli    : saved.nilai_asli   ?? null,
        nilai_katrol  : saved.nilai_katrol ?? null,
        nilai_akhir   : saved.nilai_akhir  ?? null,
      };
    });

    // Recalculate turunan untuk setiap baris (dari nilai tersimpan)
    nilaiState.rows.forEach(r => {
      const calc = nilaiHitungRow_(r, sem);
      Object.assign(r, calc);
    });
    nilaiHitungKatrolBatch_UI();

    // Deteksi otomatis: kalau ada nilai tugas kelompok tersimpan, langsung tampilkan
    // kolomnya supaya tidak ketutupan; kalau belum ada, sembunyikan dulu biar ringkas.
    const adaTgsk = nilaiState.rows.some(r =>
      (r.tgsk1 !== null && r.tgsk1 !== undefined && r.tgsk1 !== '') ||
      (r.tgsk2 !== null && r.tgsk2 !== undefined && r.tgsk2 !== '') ||
      (r.tgsk3 !== null && r.tgsk3 !== undefined && r.tgsk3 !== ''));
    nilaiState.colVis.tgsk = adaTgsk;
    const tgskEl = document.getElementById('nilaiColTGSK');
    if (tgskEl) tgskEl.checked = adaTgsk;

    // Isi pengaturan ke form
    document.getElementById('nilaiMinTarget').value = settingData.nilai_min_target ?? 60;
    document.getElementById('nilaiMaxTarget').value = settingData.nilai_max_target ?? 95;
    document.getElementById('nilaiKKM').value       = settingData.kkm ?? 70;

    // Update status bar
    document.getElementById('nilaiInfoKelas').textContent    = nilaiState.kelas;
    document.getElementById('nilaiInfoMapel').textContent    = nilaiState.mapel;
    document.getElementById('nilaiInfoSemTahun').textContent = sem + ' ' + tahun + (isActivePeriode ? '' : ' (Riwayat)');

    document.getElementById('nilaiMainSection').style.display = 'block';
    // Default: langsung mode input (edit), kecuali diminta force lock
    nilaiState.locked = !!forceLocked;
    nilaiState.focusKomponen = 'all';
    setNilaiEditMode_(nilaiState.locked);
    updateStatistikUI_nilai();
    maybeRestoreNilaiDraft_();
    // Update FAB setelah data dimuat (FAB inputNilai hanya muncul saat locked + ada data)
    if (typeof updateFab_ === 'function') updateFab_('inputNilai');
  };

  if (isActivePeriode) {
    google.script.run
      .withSuccessHandler(d => { siswaData = d || []; done.siswa = true; tryRender(); })
      .withFailureHandler(e => {
        if (typeof endProgress === 'function') endProgress();
        stopMuatTimer();
        if (btn) { btn.disabled = false; btn.textContent = '📂 Muat Data Siswa'; }
        // Still complete the render so main section shows (with empty student list + error msg)
        console.error('[NILAI] getDataSiswaUntukNilai gagal:', e && e.message);
        siswaData = [];
        done.siswa = true;
        tryRender();
      })
      .getDataSiswaUntukNilai(kelas);
  }

  google.script.run
    .withSuccessHandler(d => {
      nilaiData = d?.rows || [];
      nilaiVersion = d?.version || 0;
      if (!isActivePeriode) {
        // Roster periode riwayat = siswa yang punya nilai tersimpan di periode ini.
        siswaData = nilaiData
          .map(n => ({ no_absen: '', nis: n.nis, nama: n.nama_siswa, jk: '' }))
          .sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || '')));
        done.siswa = true;
      }
      done.nilai = true;
      tryRender();
    })
    .withFailureHandler(() => {
      nilaiData = [];
      nilaiVersion = 0;
      if (!isActivePeriode) { siswaData = []; done.siswa = true; }
      done.nilai = true;
      tryRender();
    })
    .getNilaiBundle(kelas, mapel, tahun, sem);

  google.script.run
    .withSuccessHandler(d => { settingData = d || {}; done.setting = true; tryRender(); })
    .withFailureHandler(() => { settingData = { nilai_min_target:60, nilai_max_target:95, kkm:70 }; done.setting = true; tryRender(); })
    .getSettingNilai(kelas, mapel, tahun, sem);
}

/** Render ulang seluruh tabel – mendukung lock dan fokus komponen */
function renderTabelNilai() {
  const tbody = document.getElementById('tabelNilaiBody');
  if (!tbody) return;
  const sem     = nilaiState.semester || '';
  const kkm     = Number(nilaiState.setting?.kkm || 70);
  const locked  = nilaiState.locked;
  const focus   = nilaiState.focusKomponen || 'all'; // 'all' or specific key
  const isGenap = sem.toLowerCase().includes('genap');

  const fmt = v => (v !== null && v !== undefined && v !== '' && !isNaN(Number(v)))
    ? Number(v).toFixed(2) : '-';

  const noteValueHtml = (val, { lowCheck = true } = {}) => {
    if (val === null || val === undefined || val === '' || isNaN(Number(val))) {
      return '-';
    }
    const n = Number(val);
    if (lowCheck && n < kkm) {
      return `<span title="Di bawah KKM (${kkm})" style="display:inline-block;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:999px;font-weight:700">${n.toFixed(2)}</span>`;
    }
    return n.toFixed(2);
  };

  const showTgsk = !!nilaiState.colVis.tgsk;
  const showRata = !!nilaiState.colVis.rataDetail;
  // No, NIS, Nama (3) + Tugas Mandiri (3) + UH (3) + PTS + SAS (2) + Rata Total + Total Nilai + Nilai Akhir (3)
  const totalCols = 14 + (showTgsk ? 3 : 0) + (showRata ? 2 : 0);

  // Lebar kolom proporsional (table-layout:fixed) — supaya tabel selalu pas
  // dengan lebar layar berapa pun jumlah kolom yang sedang ditampilkan.
  const colWeights = [['no', 3], ['nis', 6], ['nama', 15],
    ['tgs1', 4.5], ['tgs2', 4.5], ['tgs3', 4.5]];
  if (showTgsk) colWeights.push(['tk1', 4.5], ['tk2', 4.5], ['tk3', 4.5]);
  colWeights.push(['uh1', 4.5], ['uh2', 4.5], ['uh3', 4.5], ['pts', 5], ['sas', 5]);
  if (showRata) colWeights.push(['rataTugas', 5], ['rataUh', 5]);
  colWeights.push(['rataTotal', 5.5], ['totalNilai', 6], ['nilaiAkhir', 6.5]);
  const totalWeight = colWeights.reduce((s, c) => s + c[1], 0);
  const colgroupEl = document.getElementById('tabelNilaiColgroup');
  if (colgroupEl) {
    colgroupEl.innerHTML = colWeights
      .map(c => '<col style="width:' + (c[1] / totalWeight * 100).toFixed(3) + '%">')
      .join('');
  }

  if (!nilaiState.rows.length) {
    tbody.innerHTML = '<tr><td colspan="' + totalCols + '" style="padding:20px;color:#9ca3af;text-align:center">'
      + '⚠️ Tidak ada data siswa untuk kelas <b>' + (nilaiState.kelas || '-') + '</b>. '
      + 'Pastikan siswa sudah diimport di tab <b>Jurnal → Import Siswa</b> '
      + 'dan email pengupload sesuai akun yang sedang login.</td></tr>';
    updateNilaiKelengkapanInfo_();
    return;
  }

  /**
   * Buat cell untuk kolom input (tgs1, uh1, pts, dst)
   * - Locked: tampilkan nilai sebagai teks
   * - Unlocked + focus='all': semua input aktif
   * - Unlocked + focus=key: hanya kolom itu aktif, sisanya teks (dim)
   */
  const inputCell = (rowIdx, field, val, dimWhenInactive) => {
    const isActive = !locked && (focus === 'all' || focus === field);
    const valStr   = (val !== null && val !== undefined && val !== '') ? val : '';
    const isLow    = (val !== null && val !== undefined && val !== '' && !isNaN(Number(val)) && Number(val) < kkm);
    const fmtVal   = noteValueHtml(val, { lowCheck: true });

    if (isActive) {
      const lowStyle = isLow ? 'background:#fef3c7;border-color:#f59e0b;' : '';
      return `<td class="ntd-inp">
        <input type="number" min="0" max="100" step="any" value="${valStr}" placeholder="-"
               onwheel="this.blur()"
               onkeydown="if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();}"
               style="${lowStyle}"
               oninput="nilaiOnInput(${rowIdx},'${field}',this.value)">
      </td>`;
    }
    // Dimmed when other komponen focused in edit mode
    const dim = !locked && focus !== 'all' && dimWhenInactive;
    return `<td class="ntd-plain" ${dim ? 'style="opacity:0.25"' : ''}>${fmtVal}</td>`;
  };

  const calcCell = (id, val, redBelowKKM) => {
    if (val === null || val === undefined || val === '' || isNaN(Number(val))) {
      return `<td class="ntd-calc" id="${id}">-</td>`;
    }
    const n   = Number(val);
    const red = redBelowKKM && n < kkm;
    return `<td class="ntd-calc" id="${id}">
      <span ${red ? `title="Di bawah KKM (${kkm})" style="display:inline-block;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:999px;font-weight:700"` : ''}>${n.toFixed(2)}</span>
    </td>`;
  };

  // Render header dinamis sesuai semester
  const tHead = document.getElementById('tabelNilaiThead');
  if (tHead) {
    const pasPat = isGenap ? 'ASAT' : 'SAS';
    tHead.innerHTML = `
      <tr>
        <th rowspan="2">No</th>
        <th rowspan="2">NIS</th>
        <th rowspan="2" class="ntd-nama" style="color:#fff">Nama Siswa</th>
        <th colspan="3">Tugas Mandiri</th>
        ${showTgsk ? '<th colspan="3">Tugas Kelompok</th>' : ''}
        <th colspan="3">Ulangan Harian</th>
        <th rowspan="2">PTS</th>
        <th rowspan="2">${pasPat}</th>
        ${showRata ? '<th rowspan="2">Rata Tugas</th><th rowspan="2">Rata UH</th>' : ''}
        <th rowspan="2">Rata Total</th>
        <th rowspan="2" style="background:#4338ca">Total Nilai</th>
        <th rowspan="2" style="background:#be123c">Nilai Akhir</th>
      </tr>
      <tr>
        <th>TGS1</th><th>TGS2</th><th>TGS3</th>
        ${showTgsk ? '<th>TK1</th><th>TK2</th><th>TK3</th>' : ''}
        <th>UH1</th><th>UH2</th><th>UH3</th>
      </tr>`;
  }

  const isEmpty_ = v => v === null || v === undefined || v === '';

  tbody.innerHTML = nilaiState.rows.map((r, i) => {
    const nalq   = r.nilai_akhir;
    const rowRed = (nalq !== null && nalq !== undefined && nalq !== ''
      && !isNaN(Number(nalq)) && Number(nalq) < kkm);

    // Tanda ⚠️ menandai jenis nilai yang MASIH KOSONG per siswa (bukan
    // wajib diisi — cuma pemberitahuan ke guru supaya gampang lihat data
    // yang belum lengkap). isEmpty_ dipakai supaya null dan '' (dua
    // representasi "kosong" yang beda-beda dari server) dianggap sama.
    const labelUas = isGenap ? 'PAT' : 'PAS';
    const kosongList = [];
    if (isEmpty_(r.rata_tugas)) kosongList.push('Tugas');
    if (isEmpty_(r.rata_uh))    kosongList.push('Ulangan Harian');
    if (isEmpty_(r.pts))        kosongList.push('PTS');
    if (isEmpty_(isGenap ? r.pat : r.pas)) kosongList.push(labelUas);
    const rowEmpty = kosongList.length > 0;
    const rowClass = rowRed ? 'row-kkm' : (rowEmpty ? 'row-nildata-empty' : '');
    const emptyBadge = rowEmpty ? ' ⚠️' : '';
    const namaEsc = String(r.nama_siswa || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    const namaTitle = namaEsc + (rowEmpty ? ' — belum ada nilai: ' + kosongList.join(', ') : '');

    return `<tr class="${rowClass}" id="nilaiTr_${i}">
      <td class="ntd-plain" style="font-weight:600">${i + 1}</td>
      <td class="ntd-plain">${r.nis || '-'}</td>
      <td class="ntd-nama" title="${namaTitle}">${r.nama_siswa || ''}${emptyBadge}</td>
      ${inputCell(i, 'tgs1', r.tgs1, true)}
      ${inputCell(i, 'tgs2', r.tgs2, true)}
      ${inputCell(i, 'tgs3', r.tgs3, true)}
      ${showTgsk ? inputCell(i, 'tgsk1', r.tgsk1, true) + inputCell(i, 'tgsk2', r.tgsk2, true) + inputCell(i, 'tgsk3', r.tgsk3, true) : ''}
      ${inputCell(i, 'uh1',  r.uh1,  true)}
      ${inputCell(i, 'uh2',  r.uh2,  true)}
      ${inputCell(i, 'uh3',  r.uh3,  true)}
      ${inputCell(i, 'pts',  r.pts,  true)}
      ${isGenap ? inputCell(i, 'pat', r.pat, true) : inputCell(i, 'pas', r.pas, true)}
      ${showRata ? calcCell('nRataTGS_' + i, r.rata_tugas) + calcCell('nRataUH_' + i, r.rata_uh) : ''}
      ${calcCell('nFix_'     + i, r.nilai_fix)}
      ${calcCell('nAsli_'    + i, r.nilai_asli)}
      ${calcCell('nAkhir_'   + i, r.nilai_akhir, true)}
    </tr>`;
  }).join('');

  updateNilaiKelengkapanInfo_();
}

/* ---- Client-side formula (mirror backend hitungNilaiRow_) ---- */
function nilaiHitungRow_(r, semester) {
  const p  = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
  const avg = arr => {
    const v = arr.map(p).filter(x => x !== null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };
  const rata_uh    = avg([r.uh1, r.uh2, r.uh3]);
  const rata_tugas = avg([r.tgs1, r.tgs2, r.tgs3, r.tgsk1, r.tgsk2, r.tgsk3]);
  let nilai_fix = null;
  if (rata_uh !== null && rata_tugas !== null) nilai_fix = (rata_uh + rata_tugas) / 2;
  else if (rata_uh    !== null) nilai_fix = rata_uh;
  else if (rata_tugas !== null) nilai_fix = rata_tugas;

  const isGenap  = String(semester || '').toLowerCase().includes('genap');
  const uas      = isGenap ? p(r.pat) : p(r.pas);
  const pts_num  = p(r.pts);
  // Sama persis dengan hitungNilaiRow_() di api_nilai.js: renormalisasi
  // bobot kalau belum semua komponen terisi, supaya preview live di
  // grid ini cocok dengan yang bakal tersimpan server saat Simpan Nilai.
  const komponenAsli = [];
  if (nilai_fix !== null) komponenAsli.push({ v: nilai_fix, w: 0.4 });
  if (pts_num   !== null) komponenAsli.push({ v: pts_num,   w: 0.3 });
  if (uas       !== null) komponenAsli.push({ v: uas,       w: 0.3 });
  const totalBobotAsli = komponenAsli.reduce((a, k) => a + k.w, 0);
  const nilai_asli = totalBobotAsli > 0
    ? komponenAsli.reduce((a, k) => a + k.v * k.w, 0) / totalBobotAsli
    : null;
  return { rata_uh, rata_tugas, nilai_fix, nilai_asli };
}

/* ---- Batch katrol + nilai_akhir (client-side) ---- */
function nilaiHitungKatrolBatch_UI() {
  const minT = Number(document.getElementById('nilaiMinTarget')?.value ?? 60);
  const maxT = Number(document.getElementById('nilaiMaxTarget')?.value ?? 95);
  const kkm  = Number(document.getElementById('nilaiKKM')?.value ?? 70);

  const valid = nilaiState.rows
    .map(r => r.nilai_asli)
    .filter(v => v !== null && v !== undefined && !isNaN(v));

  if (!valid.length) return;

  const minA = Math.min(...valid);
  const maxA = Math.max(...valid);

  nilaiState.rows.forEach((r, i) => {
    if (r.nilai_asli === null || r.nilai_asli === undefined || isNaN(r.nilai_asli)) {
      r.nilai_katrol = null; r.nilai_akhir = null;
    } else {
      let k = (maxA === minA) ? minT
        : ((r.nilai_asli - minA) / (maxA - minA)) * (maxT - minT) + minT;
      k = Math.round(k * 100) / 100;
      r.nilai_katrol = k;
      const rem = (r.nilai_remedial !== null && r.nilai_remedial !== '' && !isNaN(Number(r.nilai_remedial)))
        ? Number(r.nilai_remedial) : null;
      r.nilai_akhir = rem !== null ? Math.round(Math.max(k, rem) * 100) / 100 : k;
    }

    // Update DOM cells
    const updCell = (id, val, colorKKM) => {
      const el = document.getElementById(id);
      if (!el) return;
      if (val === null || val === undefined) { el.innerHTML = '<span>-</span>'; return; }
      const n = Number(val);
      const red = colorKKM && n < kkm;
      el.innerHTML = `<span ${red ? 'style="color:red;font-weight:700"' : ''}>${isNaN(n) ? '-' : n.toFixed(2)}</span>`;
    };
    updCell('nAkhir_'  + i, r.nilai_akhir, true);

    // Row background
    const tr = document.getElementById('nilaiTr_' + i);
    if (tr) tr.style.background = (r.nilai_akhir !== null && !isNaN(r.nilai_akhir) && r.nilai_akhir < kkm)
      ? '#fff0f0' : '';
  });
}

/** Dipanggil saat nilai input diubah */
function nilaiOnInput(rowIdx, field, val) {
  const r = nilaiState.rows[rowIdx];
  r[field] = (val === '') ? '' : val;

  const calc = nilaiHitungRow_(r, nilaiState.semester);
  r.rata_uh    = calc.rata_uh;
  r.rata_tugas = calc.rata_tugas;
  r.nilai_fix  = calc.nilai_fix;
  r.nilai_asli = calc.nilai_asli;

  const fmtCell = (id, v) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (v !== null && v !== undefined && !isNaN(Number(v)))
      el.innerHTML = `<span>${Number(v).toFixed(2)}</span>`;
    else el.innerHTML = '<span>-</span>';
  };
  fmtCell('nRataUH_'  + rowIdx, r.rata_uh);
  fmtCell('nRataTGS_' + rowIdx, r.rata_tugas);
  fmtCell('nFix_'     + rowIdx, r.nilai_fix);
  fmtCell('nAsli_'    + rowIdx, r.nilai_asli);

  markNilaiDirty_();
  scheduleNilaiBatchRecalc_();
}

/**
 * KKTP_BANDS_NILAI_UI_ — rubrik KKTP Fase D (SMP kelas 7-9), selaras
 * dengan PREDIKAT_BANDS_NILAI_ (api_nilai.js) dan KKTP_BANDS_D_
 * (Kepsek.js). Dipakai utk badge "% KKTP Kelas" di statistik Input Nilai
 * (persentase ketercapaian dari rata-rata kelas, bukan dari KKM mapel).
 */
const KKTP_BANDS_NILAI_UI_ = [
  { min: 86, max: 100, kode: 'A', status: 'Sudah Mencapai Ketuntasan', color: '#166534', bg: '#dcfce7' },
  { min: 66, max: 85,  kode: 'B', status: 'Sudah Mencapai Ketuntasan', color: '#0369a1', bg: '#e0f2fe' },
  { min: 41, max: 65,  kode: 'C', status: 'Belum Mencapai Ketuntasan', color: '#854d0e', bg: '#fef9c3' },
  { min: 0,  max: 40,  kode: 'D', status: 'Belum Mencapai Ketuntasan', color: '#991b1b', bg: '#fee2e2' }
];
function _kktpBandDariNilai_(n) {
  for (const b of KKTP_BANDS_NILAI_UI_) if (n >= b.min && n <= b.max) return b;
  return n > 100 ? KKTP_BANDS_NILAI_UI_[0] : KKTP_BANDS_NILAI_UI_[KKTP_BANDS_NILAI_UI_.length - 1];
}

/**
 * Isi satu set kartu statistik (Rata/Max/Min/Tuntas/Belum/%KKTP) — dipakai
 * dua kali oleh updateStatistikUI_nilai(): sekali untuk Nilai Mentah/Murni
 * (prefix 'nilaiMurniStat', sumber nilai_asli) dan sekali untuk Nilai
 * Akhir setelah Katrol (prefix 'nilaiStat', sumber nilai_akhir — id lama,
 * tidak diubah supaya tidak merusak apa pun yang sudah ada).
 */
function _fillStatCards_(prefix, vals, kkm) {
  const setEl = (id, txt) => { const e = document.getElementById(id); if (e) e.textContent = txt; };

  if (!vals.length) {
    [prefix + 'Rata', prefix + 'Max', prefix + 'Min', prefix + 'Tuntas', prefix + 'Belum', prefix + 'Kktp', prefix + 'KktpLabel']
      .forEach(id => setEl(id, '-'));
    const kktpEl = document.getElementById(prefix + 'Kktp');
    if (kktpEl) kktpEl.style.color = '#6b7280';
    return;
  }
  const rata = vals.reduce((a, b) => a + b, 0) / vals.length;
  setEl(prefix + 'Rata',   rata.toFixed(2));
  setEl(prefix + 'Max',    Math.max(...vals).toFixed(2));
  setEl(prefix + 'Min',    Math.min(...vals).toFixed(2));
  setEl(prefix + 'Tuntas', vals.filter(v => v >= kkm).length);
  setEl(prefix + 'Belum',  vals.filter(v => v <  kkm).length);

  const kktpBand = _kktpBandDariNilai_(rata);
  const kktpEl   = document.getElementById(prefix + 'Kktp');
  setEl(prefix + 'Kktp', rata.toFixed(0) + '%');
  if (kktpEl) kktpEl.style.color = kktpBand.color;
  setEl(prefix + 'KktpLabel', kktpBand.status + ' (' + kktpBand.kode + ')');
}

/** Update panel statistik (Nilai Mentah & Nilai Akhir) + grafik */
function updateStatistikUI_nilai() {
  const kkm = Number(nilaiState.setting.kkm || 70);

  const valsMurni = nilaiState.rows
    .map(r => r.nilai_asli)
    .filter(v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v)))
    .map(Number);
  _fillStatCards_('nilaiMurniStat', valsMurni, kkm);

  const valsAkhir = nilaiState.rows
    .map(r => r.nilai_akhir)
    .filter(v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v)))
    .map(Number);
  _fillStatCards_('nilaiStat', valsAkhir, kkm);

  if (!valsAkhir.length) {
    updateNilaiKelengkapanInfo_();
    return;
  }
  updateGrafikNilai_(valsAkhir, kkm);
  updateNilaiKelengkapanInfo_();
}

let _nilaiChart = null;
function updateGrafikNilai_(vals, kkm) {
  const canvas = document.getElementById('canvasNilai');
  if (!canvas) return;
  const ranges = [
    { label: '< 60',   min: 0,   max: 60  },
    { label: '60–69',  min: 60,  max: 70  },
    { label: '70–79',  min: 70,  max: 80  },
    { label: '80–89',  min: 80,  max: 90  },
    { label: '90–100', min: 90,  max: 101 }
  ];
  const counts = ranges.map(r => vals.filter(v => v >= r.min && v < r.max).length);
  const colors = ['#ef4444','#f97316','#3b82f6','#22c55e','#6C63FF'];

  if (_nilaiChart) _nilaiChart.destroy();
  _nilaiChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ranges.map(r => r.label),
      datasets: [{ label: 'Jumlah Siswa', data: counts, backgroundColor: colors, borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

/** Simpan pengaturan (KKM + target katrol) */
function simpanPengaturanNilai(ev) {
  const { kelas, mapel, tahun, semester } = nilaiState;
  if (!kelas || !mapel) { alert('Muat data siswa terlebih dahulu'); return; }

  const minT = Number(document.getElementById('nilaiMinTarget').value);
  const maxT = Number(document.getElementById('nilaiMaxTarget').value);
  const kkm  = Number(document.getElementById('nilaiKKM').value);

  if (isNaN(minT) || isNaN(maxT) || isNaN(kkm)) { alert('Input pengaturan tidak valid'); return; }
  if (minT >= maxT) { alert('Nilai terendah target harus lebih kecil dari nilai tertinggi target'); return; }

  const btn = (ev && ev.currentTarget) ? ev.currentTarget : document.querySelector('button[onclick*="simpanPengaturanNilai"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Menyimpan...'; }
  if (typeof startProgress === 'function') startProgress();

  nilaiState.setting = { nilai_min_target: minT, nilai_max_target: maxT, kkm };

  google.script.run
    .withSuccessHandler(() => {
      if (typeof endProgress === 'function') endProgress();
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan Pengaturan'; }
      showSoftPopup('Berhasil', 'Pengaturan nilai tersimpan');
      nilaiHitungKatrolBatch_UI();
      updateStatistikUI_nilai();
      renderTabelNilai(); // update baris merah sesuai KKM baru
    })
    .withFailureHandler(e => {
      if (typeof endProgress === 'function') endProgress();
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan Pengaturan'; }
      alert('Gagal: ' + e.message);
    })
    .simpanSettingNilai({ kelas, mapel, tahun, semester, nilai_min_target: minT, nilai_max_target: maxT, kkm });
}

/** Simpan semua nilai siswa ke backend + auto-lock setelah berhasil */
function simpanSemuaNilai() {
  const { kelas, mapel, tahun, semester, rows, setting, dataVersion } = nilaiState;
  if (!kelas || !mapel || !rows.length) { alert('Tidak ada data untuk disimpan'); return; }

  const btn = document.getElementById('btnSimpanNilai');
  if (btn) btn.disabled = true;
  if (typeof startProgress === 'function') startProgress();
  const stopElapsed = startElapsedNotice_(btn, '⏳ Menyimpan...');

  const payload = {
    kelas, mapel, tahun, semester, setting,
    base_version: Number(dataVersion || 0),
    rows: rows.map(r => ({
      nis: r.nis, nama_siswa: r.nama_siswa,
      uh1: r.uh1, uh2: r.uh2, uh3: r.uh3,
      tgs1: r.tgs1, tgs2: r.tgs2, tgs3: r.tgs3,
      tgsk1: r.tgsk1, tgsk2: r.tgsk2, tgsk3: r.tgsk3,
      pts: r.pts, pas: r.pas, pat: r.pat,
      nilai_remedial: r.nilai_remedial
    }))
  };

  google.script.run
    .withSuccessHandler(res => {
      stopElapsed();
      if (typeof endProgress === 'function') endProgress();
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
      nilaiState.dataVersion = Number(res?.version || Date.now());
      clearNilaiDraftLocal_();
      showSoftPopup('Tersimpan ✅', `${res.jumlah} data nilai berhasil disimpan`);
      setNilaiEditMode_(true); // auto-lock setelah simpan
    })
    .withFailureHandler(e => {
      stopElapsed();
      if (typeof endProgress === 'function') endProgress();
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
      const msg = String(e?.message || 'Gagal menyimpan');
      if (msg.includes('KONFLIK_DATA')) {
        alert('Data sudah berubah dari sesi lain. Sistem akan memuat ulang data terbaru.');
        muatDataNilai();
        return;
      }

/** Import Excel via SheetJS */
function importNilaiExcelUI(btnEl) {
  const fileInput = document.getElementById('nilaiImportFile');
  const f = fileInput?.files[0];
  if (!f) { alert('Pilih file Excel terlebih dahulu'); return; }
  if (!nilaiState.kelas || !nilaiState.mapel) {
    alert('Muat data siswa terlebih dahulu sebelum import'); return;
  }

  const btn = btnEl || event.currentTarget;
  btn.disabled = true; btn.textContent = '⏳ Memproses...';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb      = XLSX.read(e.target.result, { type: 'array' });
      const ws      = wb.Sheets[wb.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      if (typeof startProgress === 'function') startProgress();
      google.script.run
        .withSuccessHandler(res => {
          if (typeof endProgress === 'function') endProgress();
          btn.disabled = false; btn.textContent = '📊 Import';
          if (!res.success) { alert(res.message || 'Gagal parse data'); return; }
          if (res.errors && res.errors.length)
            alert('Peringatan:\n' + res.errors.slice(0, 10).join('\n'));

          // Merge ke state berdasarkan NIS
          const importMap = {};
          (res.data || []).forEach(d => { if (d.nis) importMap[String(d.nis).trim()] = d; });

          nilaiState.rows.forEach(r => {
            const imp = importMap[String(r.nis || '').trim()];
            if (!imp) return;
            ['uh1','uh2','uh3','tgs1','tgs2','tgs3','tgsk1','tgsk2','tgsk3','pts','pas','pat','nilai_remedial'].forEach(fk => {
              if (imp[fk] !== undefined && imp[fk] !== '') r[fk] = imp[fk];
            });
            const calc = nilaiHitungRow_(r, nilaiState.semester);
            Object.assign(r, calc);
          });

          nilaiHitungKatrolBatch_UI();
          renderTabelNilai();
          updateStatistikUI_nilai();
          markNilaiDirty_();
          showSoftPopup('Import Berhasil', `${res.data.length} siswa diimport`);
        })
        .withFailureHandler(e => {
          if (typeof endProgress === 'function') endProgress();
          btn.disabled = false; btn.textContent = '📊 Import';
          alert('Error: ' + e.message);
        })
        .importNilaiData(rawRows);
    } catch (err) {
      btn.disabled = false; btn.textContent = '📊 Import';
      alert('Gagal baca file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(f);
}

/**
 * Katrol satu komponen (PTS atau SAS/ASAT) secara proporsional per kelas:
 * siswa dengan nilai mentah terendah di ARRAY YANG DIBERIKAN dipetakan ke
 * target.min, tertinggi ke target.max — rumus sama persis dengan Katrol
 * Nilai Total di nilaiHitungKatrolBatch_UI, cuma sumbernya satu komponen
 * saja. null/kosong tetap null (siswa itu belum punya nilai komponen ini).
 * @param {Array} rawVals  – nilai mentah 1 komponen, urutan sejajar rows
 * @param {{min:number,max:number}} target
 * @returns {Array} nilai hasil katrol, null kalau raw-nya kosong
 */
function _katrolKomponen_(rawVals, target) {
  const nums = rawVals.filter(v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v))).map(Number);
  if (!nums.length) return rawVals.map(() => null);
  const minA = Math.min(...nums), maxA = Math.max(...nums);
  return rawVals.map(v => {
    if (v === null || v === undefined || v === '' || isNaN(Number(v))) return null;
    const n = Number(v);
    const k = (maxA === minA) ? target.min : ((n - minA) / (maxA - minA)) * (target.max - target.min) + target.min;
    // Bulat utuh (bukan desimal) — nilai PTS/SAS/ASAT yang dicetak/export
    // memang dimaksudkan tampil sebagai angka bulat.
    return Math.round(k);
  });
}

// Komponen yang bisa dipilih utk dicetak — field mentah per siswa +
// label kolom. 'sas' dan 'asat' sama-sama membaca field 'pas'/'pat' apa
// adanya (pilihan manual, TIDAK otomatis ikut semester aktif) supaya guru
// bisa tetap cetak SAS walau semester aktifnya sudah Genap, atau
// sebaliknya.
const CETAK_KOMPONEN_MAP_ = {
  pts : { field: 'pts', label: 'PTS' },
  sas : { field: 'pas', label: 'SAS' },
  asat: { field: 'pat', label: 'ASAT' }
};

/**
 * Generate HTML tabel nilai untuk satu kelas (untuk print/export) —
 * menampilkan SATU komponen (PTS/SAS/ASAT) hasil Katrol, sesuai pilihan
 * guru di modal Cetak Nilai.
 * @param {string} kelasNm  – nama kelas
 * @param {Array}  rows     – array row data nilai
 * @param {object} opts     – { komponen: 'pts'|'sas'|'asat', kkm, katrolTarget }
 * @returns {string} HTML string
 */
function buildNilaiTableHtml_(kelasNm, rows, opts) {
  const { komponen, kkm, katrolTarget } = opts;
  const def = CETAK_KOMPONEN_MAP_[komponen] || CETAK_KOMPONEN_MAP_.pts;
  const nilaiKatrol = _katrolKomponen_(rows.map(r => r[def.field]), katrolTarget);

  const noteHtml = v => {
    if (v === null || v === undefined || isNaN(Number(v))) {
      return '<span class="note-missing">Belum mengumpulkan</span>';
    }
    const n = Number(v);
    return n < kkm ? `<span class="note-low">${n.toFixed(0)} • Rendah</span>` : n.toFixed(0);
  };

  const hdr = `<th>No</th><th>NIS</th><th class="tl">Nama Siswa</th><th>${def.label} (Katrol)</th><th>Ket</th>`;

  const bodyRows = rows.map((r, i) => {
    const finalVal = r.nilai_akhir;
    const lulus    = finalVal !== null && !isNaN(Number(finalVal)) && Number(finalVal) >= kkm;
    const tds = `<td>${i+1}</td><td>${r.nis||'-'}</td><td class="tl">${r.nama_siswa||''}</td>` +
      `<td>${noteHtml(nilaiKatrol[i])}</td>` +
      `<td>${lulus ? 'T' : 'BT'}</td>`;
    return `<tr class="${lulus ? '' : 'blt'}">${tds}</tr>`;
  }).join('');

  return `<thead><tr>${hdr}</tr></thead><tbody>${bodyRows}</tbody>`;
}

/** Export ke file Excel via SheetJS (satu kelas, satu komponen) */
function exportNilaiExcelUI() {
  if (typeof XLSX === 'undefined') { alert('Library XLSX belum siap'); return; }
  if (!nilaiState.cetakPreviewOk) {
    alert('Lakukan preview terlebih dahulu sebelum export Excel.');
    return;
  }

  const kelas = document.getElementById('cetakKelasSelect')?.value || '';
  if (!kelas) { alert('Pilih kelas'); return; }
  const komponen = document.querySelector('input[name="cetakKomponen"]:checked')?.value || 'pts';
  const def = CETAK_KOMPONEN_MAP_[komponen] || CETAK_KOMPONEN_MAP_.pts;

  const btn = document.getElementById('btnDoExcel');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Menyiapkan...'; }

  const { mapel, tahun, semester, setting } = nilaiState;
  const kkm     = Number(setting.kkm || 70);
  // Target rentang Katrol komponen — sama dengan yang dipakai di
  // doCetakNilai(), bersumber dari Pengaturan Nilai Katrol & KKM.
  const katrolTarget = { min: Number(setting.nilai_min_target ?? 60), max: Number(setting.nilai_max_target ?? 95) };

  const buildAndExport = (rows) => {
    const fmt = v => (v !== null && v !== undefined && !isNaN(Number(v)))
      ? Math.round(Number(v)) : '-';
    const nilaiKatrol = _katrolKomponen_(rows.map(r => r[def.field]), katrolTarget);

    const wb = XLSX.utils.book_new();
    const meta = [
      [`Daftar Nilai ${mapel}`], [],
      ['Kelas', kelas], ['Tahun Pelajaran', tahun], ['Semester', semester], ['KKM', kkm], []
    ];
    const colHdr = ['No', 'NIS', 'Nama Siswa', def.label + ' (Katrol)', 'Keterangan'];

    const dataRows = rows.map((r, i) => {
      const akhirNum = (r.nilai_akhir !== null && r.nilai_akhir !== undefined && !isNaN(Number(r.nilai_akhir)))
        ? Number(r.nilai_akhir) : null;
      return [
        i + 1, r.nis || '', r.nama_siswa || '',
        fmt(nilaiKatrol[i]),
        (akhirNum !== null && akhirNum >= kkm) ? 'Tuntas' : 'Belum Tuntas'
      ];
    });

    const sheetData = [...meta, colHdr, ...dataRows];
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    const sheetName = kelas.replace(/[\\\/*?:[\]]/g, '').slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Nilai');

    if (btn) { btn.disabled = false; btn.textContent = '📊 Export Excel'; }
    XLSX.writeFile(wb, `Nilai_${def.label}_${mapel}_${kelas}_${semester}_${tahun}.xlsx`);
    closeCetakNilai();
  };

  if (kelas === nilaiState.kelas) {
    buildAndExport(nilaiState.rows);
  } else {
    google.script.run
      .withSuccessHandler(rows => buildAndExport(rows || []))
      .withFailureHandler(() => {
        if (btn) { btn.disabled = false; btn.textContent = '📊 Export Excel'; }
        alert('Gagal ambil data nilai kelas ' + kelas);
      })
      .getNilaiSiswa(kelas, mapel, tahun, semester);
  }
}

(function(){

  const NILAI_FIELDS = ['tgs1','tgs2','tgs3','tgsk1','tgsk2','tgsk3','uh1','uh2','uh3','pts','pas','pat'];

  function parseNilaiPaste_(raw) {
    const cleaned = String(raw ?? '')
      .replace(/\s+/g, '')
      .replace(',', '.');
    if (!cleaned) return null;
    const num = Number(cleaned);
    if (isNaN(num)) return null;
    const clamped = Math.min(100, Math.max(0, num));
    return Math.round(clamped * 100) / 100;
  }

  document.addEventListener('paste', function(e) {
    const target = e.target;
    if (!target || target.tagName !== 'INPUT') return;

    // Only handle inputs inside #tabelNilaiBody
    const tbody = document.getElementById('tabelNilaiBody');
    if (!tbody || !tbody.contains(target)) return;

    // Find rowIdx and field from oninput attribute
    const oninput = target.getAttribute('oninput') || '';
    const m = oninput.match(/nilaiOnInput\((\d+),'([^']+)'/);
    if (!m) return;

    const startRow  = parseInt(m[1]);
    const startField = m[2];
    const startCol  = NILAI_FIELDS.indexOf(startField);
    if (startCol < 0) return;

    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!text) return;

    const lines = text
      .split(/\r?\n/)
      .map(v => String(v || ''))
      .filter(v => v !== '');
    if (!lines.length) return;

    const matrix = lines.map(rowTxt => rowTxt.split('\t'));
    const singleColMode = matrix.every(cols => cols.length <= 1);

    // Jika copas 1 kolom dari Excel dan baris pertama bukan angka (header), auto-skip header.
    let startPasteIndex = 0;
    if (singleColMode && matrix.length > 1) {
      const firstVal = parseNilaiPaste_(matrix[0][0]);
      if (firstVal === null) startPasteIndex = 1;
    }

    let changedCount = 0;
    let skippedCount = 0;

    for (let ri = startPasteIndex; ri < matrix.length; ri++) {
      const rowIdx = startRow + (ri - startPasteIndex);
      if (rowIdx >= nilaiState.rows.length) break;

      const cols = singleColMode ? [matrix[ri][0]] : matrix[ri];
      for (let ci = 0; ci < cols.length; ci++) {
        const colIdx = singleColMode ? startCol : (startCol + ci);
        if (colIdx >= NILAI_FIELDS.length) continue;

        const parsed = parseNilaiPaste_(cols[ci]);
        if (parsed === null) {
          skippedCount++;
          continue;
        }

        const field = NILAI_FIELDS[colIdx];
        const useVal = String(parsed);

        nilaiOnInput(rowIdx, field, useVal);
        changedCount++;

        const sel = 'input[oninput="nilaiOnInput(' + rowIdx + ',\'' + field + '\',this.value)"]';
        const inp = tbody.querySelector(sel);
        if (inp) inp.value = useVal;
      }
    }

    if (changedCount === 0) {
      alert('Tidak ada nilai numerik yang bisa diproses dari clipboard.');
      return;
    }

    renderTabelNilai();
    if (typeof showSoftPopup === 'function') {
      showSoftPopup('Paste berhasil', `${changedCount} nilai terisi${skippedCount ? ` (${skippedCount} dilewati)` : ''}`);
    }

    // Refocus original cell
    const refSel = 'input[oninput="nilaiOnInput(' + startRow + ',\'' + startField + '\',this.value)"]';
    const inp = tbody.querySelector(refSel);
    if (inp) inp.focus();
  });

  // Visual hint on focus
  document.addEventListener('focusin', function(e) {
    if (e.target.tagName !== 'INPUT') return;
    const tbody = document.getElementById('tabelNilaiBody');
    if (!tbody || !tbody.contains(e.target)) return;
    e.target.setAttribute('title', 'Bisa paste Excel (Ctrl+V) dari sini � data akan mengisi ke bawah/kanan');
  });
})();
/* =========================================================
   AUDIT TRAIL NILAI — load & render
   ========================================================= */
function loadAuditNilai() {
  const wrap = document.getElementById('auditNilaiWrap');
  if (!wrap) return;
  wrap.innerHTML = '<p class="muted" id="auditNilaiLoadingText"></p>';
  const stopElapsed = startElapsedNotice_(document.getElementById('auditNilaiLoadingText'), '⏳ Memuat riwayat...');
  google.script.run
    .withFailureHandler(function(err) {
      stopElapsed();
      wrap.innerHTML = '<p style="color:#dc2626">❌ ' + err.message + '</p>';
    })
    .withSuccessHandler(function(data) {
      stopElapsed();
      if (!data || !data.length) {
        wrap.innerHTML = '<p class="muted">📭 Belum ada riwayat perubahan nilai.</p>';
        return;
      }
      var html = '<div class="table-wrap"><table><thead><tr>'
        + '<th>Waktu</th><th>Aksi</th><th>Kelas</th>'
        + '<th>Mapel</th><th>Tahun</th><th>Semester</th><th>Siswa</th>'
        + '</tr></thead><tbody>';
      data.forEach(function(r) {
        html += '<tr>'
          + '<td style="white-space:nowrap">' + r.timestamp + '</td>'
          + '<td><span class="badge" style="background:#dbeafe;color:#1e40af">' + r.aksi + '</span></td>'
          + '<td>' + r.kelas + '</td>'
          + '<td>' + r.mapel + '</td>'
          + '<td>' + r.tahun + '</td>'
          + '<td>' + r.semester + '</td>'
          + '<td>' + r.jumlah + '</td>'
          + '</tr>';
      });
      html += '</tbody></table></div>';
      wrap.innerHTML = html;
    })
    .getAuditNilai();
}</script>
