<script>
/* ============================================================
   scripts-kepsek.html — Dashboard Kepala Sekolah
   Menampilkan rekap aktivitas semua guru di sekolah (read-only).
   ============================================================ */

var _kepsekLoaded = false;

/** Dipanggil saat tab rekap sekolah dibuka */
function initDashboardKepsek() {
  if (_kepsekLoaded) return; // Jangan reload jika sudah ada data
  loadRekapSekolah();
}

function loadRekapSekolah(forceRefresh) {
  _kepsekLoaded = false;

  // Tampilkan skeleton + penghitung waktu (proses ini bisa berat kalau mode
  // per_guru — tiap guru buka spreadsheet sendiri-sendiri).
  var container = document.getElementById('kepsekContainer');
  if (container) {
    container.innerHTML = '<div id="kepsekLoadingNotice" class="muted" style="margin-bottom:8px;font-size:12px"></div>' + _kepsekSkeleton_();
  }
  var stopTimer = startElapsedNotice_(document.getElementById('kepsekLoadingNotice'), '⏳ Memuat rekap sekolah...');

  google.script.run
    .withFailureHandler(function(err) {
      stopTimer();
      _kepsekLoaded = false;
      var c = document.getElementById('kepsekContainer');
      if (c) c.innerHTML =
        '<div class="alert-banner error">❌ Gagal memuat data: ' +
        (err && err.message ? err.message : 'Coba refresh halaman') + '</div>';
    })
    .withSuccessHandler(function(data) {
      stopTimer();
      _kepsekLoaded = true;
      _renderRekapSekolah_(data);
    })
    .getRekapSekolah(!!forceRefresh);
}

function _kepsekSkeleton_() {
  var rows = '';
  for (var i = 0; i < 5; i++) {
    rows += '<tr>' + '<td><div class="skeleton" style="height:13px;width:80%"></div></td>'.repeat(7) + '</tr>';
  }
  return '<div class="skeleton" style="height:80px;margin-bottom:18px;border-radius:14px"></div>' +
         '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px">' +
         '<div class="skeleton" style="height:72px;border-radius:14px"></div>'.repeat(4) +
         '</div>' +
         '<div class="skeleton" style="height:16px;width:30%;margin-bottom:10px"></div>' +
         '<div style="width:100%;overflow:hidden"><table style="table-layout:fixed;width:100%;border-collapse:collapse"><tbody>' + rows + '</tbody></table></div>';
}

function _renderRekapSekolah_(data) {
  var container = document.getElementById('kepsekContainer');
  if (!container) return;

  var html = '';

  // ── Header info sekolah ──
  html += '<div style="background:linear-gradient(135deg,#1e3a8a,#6366f1);color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:20px">' +
    '<h2 style="margin:0 0 6px;font-size:20px;font-weight:800">🏫 ' + _esc(data.sekolah || 'Sekolah') + '</h2>' +
    '<div style="font-size:13px;opacity:.85">Tahun: <b>' + _esc(data.tahun_pelajaran || '-') + '</b> &nbsp;·&nbsp; Semester: <b>' + _esc(data.semester || '-') + '</b></div>' +
    '<div style="font-size:12px;opacity:.7;margin-top:4px">Bulan aktif: ' + _esc(data.bulanLabel || '') + '</div>' +
    '</div>';

  // ── Panduan singkat (sekali render, di atas KPI) ──
  html += '<div class="card" style="background:#f8fafc;border-left:6px solid #6366f1;margin-bottom:16px;font-size:12.5px;line-height:1.7">' +
    '<b>📌 Cara pakai:</b> Dashboard ini read-only — semua angka diambil otomatis dari jurnal &amp; absensi guru di sekolah Anda (yang kode_sekolah-nya sama dengan akun Kepsek ini, diatur SuperAdmin). ' +
    '<b>Early Warning</b> untuk top 3 siswa S/I/A terbanyak tiap kelas, <b>Raport Absensi</b> untuk rekap kehadiran umum per kelas, dan <b>Export Excel</b> untuk unduh rekap ini.' +
    '</div>';

  // ── KPI Cards ──
  var kpis = [
    { label: 'Total Guru Aktif',    value: data.totalGuru,       icon: '👨‍🏫', color: '#3b82f6' },
    { label: 'Guru Mengisi Jurnal', value: data.guruAktif,       icon: '✅', color: '#22c55e' },
    { label: 'Jurnal Bulan Ini',    value: data.totalJurnalBulan,icon: '📘', color: '#6366f1' },
    { label: 'Total Siswa',         value: data.totalSiswa,       icon: '🎓', color: '#f97316' }
  ];
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin-bottom:24px">';
  kpis.forEach(function(k) {
    html += '<div class="card stat" style="border-top:3px solid ' + k.color + ';padding:14px 16px">' +
      '<div class="label">' + k.icon + ' ' + k.label + '</div>' +
      '<div class="value" style="color:' + k.color + '">' + k.value + '</div>' +
      '</div>';
  });
  html += '</div>';

  // ── KPI tambahan sekolah: ketuntasan ──
  // Tabel kelasKetuntasan diurutkan berdasarkan nama kelas (bukan
  // persentase) supaya enak dibaca, jadi kartu "Kelas Tertinggi Tuntas"
  // HARUS cari sendiri persenTuntas terbesar — tidak boleh ambil [0]
  // begitu saja (dulu keliru begitu, hasilnya kelas pertama secara abjad,
  // bukan yang persentasenya paling tinggi).
  var kelasTertinggi = null;
  (data.kelasKetuntasan || []).forEach(function(r) {
    if (!kelasTertinggi || r.persenTuntas > kelasTertinggi.persenTuntas) kelasTertinggi = r;
  });
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px">';
  html += '<div class="card stat" style="border-top:3px solid #22c55e;padding:14px 16px"><div class="label">📈 Kelas Tertinggi Tuntas</div><div class="value" style="color:#22c55e">' + ((kelasTertinggi && kelasTertinggi.kelas) || '-') + '</div><div class="muted" style="font-size:12px">' + (((kelasTertinggi && kelasTertinggi.persenTuntas) || 0) + '% tuntas') + '</div></div>';
  html += '</div>';

  // ── Export ──
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">' +
    '<button onclick="_exportRekapSekolahExcel_()" style="background:linear-gradient(135deg,#059669,#34d399);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">📥 Export Excel</button>' +
    '<button onclick="loadEarlyWarning()" style="background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">⚠️ Early Warning</button>' +
    '<button onclick="loadRaportAbsensi()" style="background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">📋 Raport Absensi</button>' +
    '<button onclick="loadRekapSekolah(true)" class="ghost" style="font-size:13px;padding:8px 14px;border-radius:10px">🔄 Refresh</button>' +
    '</div>';

  // ── Warning: guru tidak aktif ──
  var guruTidakAktif = (data.guruList || []).filter(function(g) { return g.statusJurnal !== 'aktif'; });
  if (guruTidakAktif.length > 0) {
    html += '<div class="alert-banner warning" style="margin-bottom:16px">⚠️ <b>' + guruTidakAktif.length + ' guru</b> belum mengisi jurnal bulan ini.</div>';
  }

  // ── Tabel daftar guru (responsive, no horizontal scroll) ──
  html += '<div style="width:100%;overflow:hidden">' +
    '<table style="table-layout:fixed;width:100%;border-collapse:collapse">' +
    '<colgroup>' +
    '<col style="width:20%">' +
    '<col style="width:9%">' +
    '<col style="width:7%">' +
    '<col style="width:15%">' +
    '<col style="width:15%">' +
    '<col style="width:18%">' +
    '<col style="width:16%">' +
    '</colgroup>' +
    '<thead><tr>' +
    '<th style="text-align:left;padding:8px 10px">Guru</th>' +
    '<th style="padding:8px 6px">Jurnal Bulan Ini</th>' +
    '<th style="padding:8px 6px">Total</th>' +
    '<th style="padding:8px 6px;text-align:left">Kelas Diampu</th>' +
    '<th style="padding:8px 6px;text-align:left">Mata Pelajaran</th>' +
    '<th style="padding:8px 6px;text-align:left">Jurnal Terakhir</th>' +
    '<th style="padding:8px 6px">Status</th>' +
    '</tr></thead><tbody>';

  if (!data.guruList || data.guruList.length === 0) {
    html += '<tr><td colspan="7" class="muted" style="padding:16px;text-align:center">Belum ada guru aktif.</td></tr>';
  } else {
    data.guruList.forEach(function(g) {
      var statusBg =
        g.statusJurnal === 'aktif'       ? '#dcfce7' :
        g.statusJurnal === 'tidak_aktif' ? '#fef9c3' : '#fee2e2';
      var statusColor =
        g.statusJurnal === 'aktif'       ? '#166534' :
        g.statusJurnal === 'tidak_aktif' ? '#854d0e' : '#991b1b';
      var statusLabel =
        g.statusJurnal === 'aktif'       ? '✅ Aktif' :
        g.statusJurnal === 'tidak_aktif' ? '⚠️ Tdk Aktif' : '❌ Belum';
      var kelasTxt = (g.kelasList && g.kelasList.length) ? g.kelasList.join(', ') : '-';
      var mapelTxt = (g.mapelList && g.mapelList.length) ? g.mapelList.join(', ') : '-';

      html += '<tr>' +
        '<td style="padding:8px 10px;overflow:hidden">' +
          '<div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px" title="' + _esc(g.nama) + '">' + _esc(g.nama) + '</div>' +
          '<div style="font-size:11px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + _esc(g.email) + '">' + _esc(g.email) + '</div>' +
        '</td>' +
        '<td style="padding:8px 6px;text-align:center"><b style="font-size:15px">' + g.totalJurnalBulan + '</b></td>' +
        '<td style="padding:8px 6px;text-align:center;font-size:13px">' + g.totalJurnal + '</td>' +
        '<td style="padding:8px 6px;font-size:12px"><span class="riwayat-clamp" title="' + _esc(kelasTxt) + '">' + _esc(kelasTxt) + '</span></td>' +
        '<td style="padding:8px 6px;font-size:12px"><span class="riwayat-clamp" title="' + _esc(mapelTxt) + '">' + _esc(mapelTxt) + '</span></td>' +
        '<td style="padding:8px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + _esc(g.lastJurnal) + '">' + _esc(g.lastJurnal) + '</td>' +
        '<td style="padding:8px 6px;text-align:center"><span style="background:' + statusBg + ';color:' + statusColor + ';padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap">' + statusLabel + '</span></td>' +
        '</tr>';
    });
  }

  html += '</tbody></table></div>';

  // Charts + Early Warning + Raport section placeholders
  html += '<div id="kepsekChartsSection" style="margin-top:28px"></div>';
  html += '<div id="kepsekKetuntasanSection" style="margin-top:28px"></div>';
  html += '<div id="kepsekEarlyWarningSection" style="margin-top:32px"></div>';
  html += '<div id="kepsekRaportSection" style="margin-top:32px"></div>';
  container.innerHTML = html;

  // Auto-load charts + early warning
  setTimeout(loadKepsekCharts, 300);
  setTimeout(loadKetuntasanSekolah, 550);
  setTimeout(loadEarlyWarning, 600);
}

/* ============================================================
   REKAP GURU WALI (KEPSEK) — berapa guru sudah isi jurnal
   pendampingan wali, dan isi jurnalnya per guru.
   ============================================================ */
var _rgwLoaded = false;

function initRekapGuruWali() {
  if (_rgwLoaded) return;
  loadRekapGuruWali();
}

function loadRekapGuruWali(forceRefresh) {
  _rgwLoaded = false;
  var container = document.getElementById('rekapGuruWaliContainer');
  if (container) {
    container.innerHTML = '<div id="rgwLoadingNotice" class="muted" style="margin-bottom:8px;font-size:12px"></div>' + _kepsekSkeleton_();
  }
  var stopTimer = startElapsedNotice_(document.getElementById('rgwLoadingNotice'), '⏳ Memuat rekap guru wali...');

  google.script.run
    .withFailureHandler(function(err) {
      stopTimer();
      _rgwLoaded = false;
      var c = document.getElementById('rekapGuruWaliContainer');
      if (c) c.innerHTML =
        '<div class="alert-banner error">❌ Gagal memuat data: ' +
        (err && err.message ? err.message : 'Coba refresh halaman') + '</div>';
    })
    .withSuccessHandler(function(data) {
      stopTimer();
      _rgwLoaded = true;
      _renderRekapGuruWali_(data);
    })
    .getRekapGuruWali(!!forceRefresh);
}

function _renderRekapGuruWali_(data) {
  var container = document.getElementById('rekapGuruWaliContainer');
  if (!container) return;

  var html = '';
  html += '<div style="background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:20px">' +
    '<h2 style="margin:0 0 6px;font-size:20px;font-weight:800">👨‍🏫 Rekap Jurnal Guru Wali</h2>' +
    '<div style="font-size:13px;opacity:.85">Tahun Pelajaran: <b>' + _esc(data.activeTahun || '-') + '</b></div>' +
    '</div>';

  html += '<div class="card" style="background:#f8fafc;border-left:6px solid #14b8a6;margin-bottom:16px;font-size:12.5px;line-height:1.7">' +
    '<b>📌 Cara pakai:</b> Rekap ini khusus guru yang berperan sebagai GURU WALI di sekolah Anda dan jurnal pendampingan siswa binaan mereka (beda dari jurnal mengajar mapel biasa). Klik nama guru di tabel untuk lihat detail jurnalnya.' +
    '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px">';
  html += '<div class="card stat" style="border-top:3px solid #3b82f6;padding:14px 16px"><div class="label">👨‍🏫 Total Guru Wali</div><div class="value">' + data.totalGuru + '</div></div>';
  html += '<div class="card stat" style="border-top:3px solid #22c55e;padding:14px 16px"><div class="label">✅ Sudah Mengisi Jurnal</div><div class="value" style="color:#22c55e">' + data.guruSudahMengisi + '</div></div>';
  html += '<div class="card stat" style="border-top:3px solid #ef4444;padding:14px 16px"><div class="label">❌ Belum Mengisi</div><div class="value" style="color:#ef4444">' + (data.totalGuru - data.guruSudahMengisi) + '</div></div>';
  html += '</div>';

  html += '<div style="display:flex;gap:10px;margin-bottom:16px">' +
    '<button onclick="loadRekapGuruWali(true)" class="ghost" style="font-size:13px;padding:8px 14px;border-radius:10px">🔄 Refresh</button>' +
    '</div>';

  html += '<p class="muted" style="font-size:12px;margin-bottom:10px">Klik nama guru untuk melihat isi jurnal pendampingannya.</p>';

  html += '<div style="width:100%;overflow:hidden">' +
    '<table style="table-layout:fixed;width:100%;border-collapse:collapse">' +
    '<colgroup><col style="width:34%"><col style="width:16%"><col style="width:16%"><col style="width:18%"><col style="width:16%"></colgroup>' +
    '<thead><tr>' +
    '<th style="text-align:left;padding:8px 10px">Guru</th>' +
    '<th style="padding:8px 6px">Entri Bulan Ini</th>' +
    '<th style="padding:8px 6px">Total Entri</th>' +
    '<th style="padding:8px 6px;text-align:left">Entri Terakhir</th>' +
    '<th style="padding:8px 6px">Status</th>' +
    '</tr></thead><tbody>';

  if (!data.guruList || data.guruList.length === 0) {
    html += '<tr><td colspan="5" class="muted" style="padding:16px;text-align:center">Belum ada guru wali aktif.</td></tr>';
  } else {
    data.guruList.forEach(function(g) {
      var statusBg =
        g.statusJurnal === 'aktif'       ? '#dcfce7' :
        g.statusJurnal === 'tidak_aktif' ? '#fef9c3' : '#fee2e2';
      var statusColor =
        g.statusJurnal === 'aktif'       ? '#166534' :
        g.statusJurnal === 'tidak_aktif' ? '#854d0e' : '#991b1b';
      var statusLabel =
        g.statusJurnal === 'aktif'       ? '✅ Aktif' :
        g.statusJurnal === 'tidak_aktif' ? '⚠️ Tdk Aktif' : '❌ Belum';

      html += '<tr style="cursor:pointer" onclick="showRgwDetail_(\'' + _esc(g.email).replace(/'/g,"\\'") + '\',\'' + _esc(g.nama).replace(/'/g,"\\'") + '\')">' +
        '<td style="padding:8px 10px;overflow:hidden">' +
          '<div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#4338ca;text-decoration:underline" title="' + _esc(g.nama) + '">' + _esc(g.nama) + '</div>' +
          '<div style="font-size:11px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + _esc(g.email) + '">' + _esc(g.email) + '</div>' +
        '</td>' +
        '<td style="padding:8px 6px;text-align:center"><b style="font-size:15px">' + g.entriBulanIni + '</b></td>' +
        '<td style="padding:8px 6px;text-align:center;font-size:13px">' + g.totalEntri + '</td>' +
        '<td style="padding:8px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + _esc(g.lastEntri) + '</td>' +
        '<td style="padding:8px 6px;text-align:center"><span style="background:' + statusBg + ';color:' + statusColor + ';padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap">' + statusLabel + '</span></td>' +
        '</tr>';
    });
  }

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function showRgwDetail_(email, nama) {
  var modal = document.getElementById('rgwDetailModal');
  var nameEl = document.getElementById('rgwDetailNama');
  var body = document.getElementById('rgwDetailBody');
  if (!modal || !body) return;
  if (nameEl) nameEl.textContent = nama || email;
  body.innerHTML = '<p class="muted">⏳ Memuat...</p>';
  modal.style.display = 'flex';

  google.script.run
    .withFailureHandler(function(err) {
      body.innerHTML = '<div class="alert-banner error">❌ ' + (err && err.message ? err.message : 'Gagal memuat') + '</div>';
    })
    .withSuccessHandler(function(entries) {
      if (!entries || !entries.length) {
        body.innerHTML = '<div class="alert-banner info">Belum ada jurnal pendampingan dari guru ini.</div>';
        return;
      }
      var html = '<div style="display:grid;gap:10px">';
      entries.forEach(function(e) {
        html += '<div class="card" style="margin:0;background:#f8fafc;border-left:4px solid #14b8a6;padding:12px 14px">' +
          '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px">' +
            '<b style="font-size:13px">' + _esc(e.tanggal) + '</b>' +
            '<span class="muted" style="font-size:12px">' + _esc(e.waktu) + ' &middot; ' + _esc(e.fokus_pendampingan) + '</span>' +
          '</div>' +
          '<div style="font-size:13px;margin-bottom:4px"><b>Topik:</b> ' + _esc(e.topik_pendampingan) + '</div>' +
          '<div style="font-size:13px;margin-bottom:4px"><b>Catatan:</b> ' + _esc(e.catatan) + '</div>' +
          '<div style="font-size:13px"><b>Tindak Lanjut:</b> ' + _esc(e.tindak_lanjut) + '</div>' +
        '</div>';
      });
      html += '</div>';
      body.innerHTML = html;
    })
    .getRekapGuruWaliDetail(email);
}

function closeRgwDetailModal_() {
  var modal = document.getElementById('rgwDetailModal');
  if (modal) modal.style.display = 'none';
}

function _esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─────────────────────────────────────────────────────────────
   CHART.JS — Tren Jurnal & Distribusi Kehadiran
   ───────────────────────────────────────────────────────────── */
var _kepsekChartTren   = null;
var _kepsekChartAbsen  = null;

function loadKepsekCharts() {
  var section = document.getElementById('kepsekChartsSection');
  if (!section) return;
  section.innerHTML = '<p class="muted" id="kepsekChartsLoadingText" style="font-size:12px;margin-bottom:6px"></p><div class="skeleton" style="height:260px;border-radius:14px"></div>';
  var stopTimer = startElapsedNotice_(document.getElementById('kepsekChartsLoadingText'), '⏳ Memuat chart...');

  google.script.run
    .withSuccessHandler(function(d) {
      stopTimer();
      _renderKepsekCharts_(d, section);
    })
    .withFailureHandler(function(err) {
      stopTimer();
      section.innerHTML = '<div class="alert-banner error">❌ Gagal memuat chart: ' + _esc(err.message || '') + '</div>';
    })
    .getJurnalChartData();
}

var _kepsekKtpRows_ = [];

function loadKetuntasanSekolah() {
  var section = document.getElementById('kepsekKetuntasanSection');
  if (!section) return;
  section.innerHTML = '<p class="muted" id="kepsekKetuntasanLoadingText" style="font-size:12px;margin-bottom:6px"></p><div class="skeleton" style="height:180px;border-radius:14px"></div>';
  var stopTimer = startElapsedNotice_(document.getElementById('kepsekKetuntasanLoadingText'), '⏳ Memuat ketuntasan...');
  google.script.run
    .withSuccessHandler(function(data) {
      stopTimer();
      var rows = (data && data.kelasKetuntasan) || [];
      _kepsekKtpRows_ = rows;
      if (!rows.length) {
        section.innerHTML = '<div class="alert-banner info">ℹ️ Belum ada data ketuntasan kelas.</div>';
        return;
      }
      var html = '<h3 style="margin:0 0 4px;font-size:15px">📚 Ketuntasan Siswa per Kelas (KKTP)</h3>' +
        '<p class="muted" style="font-size:12px;margin:0 0 12px">Rata-rata (Rata Harian + PTS + SAS/ASAT) gabungan semua mapel dibandingkan ke rentang KKTP sesuai fase jenjang kelas.</p>' +
        '<div style="width:100%;overflow:hidden"><table style="table-layout:fixed;width:100%;border-collapse:collapse">' +
        '<colgroup><col style="width:8%"><col style="width:18%"><col style="width:24%"><col style="width:24%"><col style="width:26%"></colgroup>' +
        '<thead><tr><th style="padding:7px 8px">No</th><th style="padding:7px 8px;text-align:left">Kelas</th><th style="padding:7px 8px">Ketuntasan</th><th style="padding:7px 8px">Perlu Bimbingan</th><th style="padding:7px 8px">Detail</th></tr></thead><tbody>';
      rows.forEach(function(r, i) {
        var pctBg = r.persenTuntas >= 80 ? '#dcfce7' : r.persenTuntas >= 60 ? '#fef9c3' : '#fee2e2';
        var pctCl = r.persenTuntas >= 80 ? '#166534' : r.persenTuntas >= 60 ? '#854d0e' : '#991b1b';
        html += '<tr>' +
          '<td style="padding:7px 8px;text-align:center">' + (i + 1) + '</td>' +
          '<td style="padding:7px 8px;font-weight:700">' + _esc(r.kelas) + '</td>' +
          '<td style="padding:7px 8px;text-align:center"><span style="background:' + pctBg + ';color:' + pctCl + ';padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">' + r.persenTuntas + '%</span></td>' +
          '<td style="padding:7px 8px;text-align:center;color:#991b1b;font-weight:700">' + r.persenPerluBimbingan + '%</td>' +
          '<td style="padding:7px 8px;text-align:center">' +
            (r.siswaBelum && r.siswaBelum.length
              ? '<button onclick="_toggleKtpDetail_(' + i + ')" class="ghost" style="font-size:11px;padding:4px 8px;border-radius:8px">👁️ Lihat</button>'
              : '<span class="muted" style="font-size:11px">-</span>') +
          '</td>' +
          '</tr>' +
          '<tr id="ktpDetail_' + i + '" style="display:none"><td colspan="5" style="padding:0 8px 12px">' + _renderKtpDetail_(r) + '</td></tr>';
      });
      html += '</tbody></table></div>';
      section.innerHTML = html;
    })
    .withFailureHandler(function(err) {
      stopTimer();
      section.innerHTML = '<div class="alert-banner error">❌ ' + _esc(err.message || 'Gagal memuat ketuntasan') + '</div>';
    })
    .getRekapSekolah();
}

function _renderKtpDetail_(r) {
  if (!r.siswaBelum || !r.siswaBelum.length) return '';
  return '<div style="background:#fef2f2;border-radius:10px;padding:10px 12px;font-size:12px">' +
    '<div style="font-weight:700;margin-bottom:6px;color:#991b1b">Perlu Bimbingan (' + r.siswaBelum.length + ' siswa)</div>' +
    '<div>' + r.siswaBelum.map(_esc).join(', ') + '</div>' +
    '</div>';
}

function _toggleKtpDetail_(i) {
  var row = document.getElementById('ktpDetail_' + i);
  if (!row) return;
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

function _renderKepsekCharts_(d, section) {
  var isDark  = document.body.classList.contains('dark');
  var fg      = isDark ? '#e2e8f0' : '#1f2937';
  var fgMuted = isDark ? '#94a3b8' : '#6b7280';
  var gridClr = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
  var cardBg  = isDark ? '#1e293b' : '#ffffff';

  section.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">' +
      '<div style="width:3px;height:20px;background:linear-gradient(180deg,#6366f1,#8b5cf6);border-radius:2px"></div>' +
      '<h3 style="margin:0;font-size:15px;font-weight:700;color:' + fg + '">Grafik Aktivitas Sekolah</h3>' +
    '</div>' +
    '<div class="dash-grid">' +
      /* Card tren jurnal - mirip dashboard */
      '<div class="card" style="background:' + cardBg + '">' +
        '<h3 style="margin:0 0 4px;font-size:14px;font-weight:700;color:' + fg + '">📅 Tren Jurnal</h3>' +
        '<p style="margin:0 0 14px;font-size:12px;color:' + fgMuted + '">4 Minggu Terakhir</p>' +
        '<canvas id="chartTrenJurnal" style="max-height:240px!important;height:240px!important"></canvas>' +
      '</div>' +
      /* Card distribusi kehadiran */
      '<div class="card" style="background:' + cardBg + '">' +
        '<h3 style="margin:0 0 4px;font-size:14px;font-weight:700;color:' + fg + '">📊 Distribusi Kehadiran</h3>' +
        '<p style="margin:0 0 14px;font-size:12px;color:' + fgMuted + '">Total Semua Kelas</p>' +
        '<canvas id="chartAbsensiDist" style="max-height:240px!important;height:240px!important"></canvas>' +
      '</div>' +
    '</div>';

  /* ── Tren line chart ── */
  var ctxTren = document.getElementById('chartTrenJurnal');
  if (ctxTren && typeof Chart !== 'undefined') {
    if (_kepsekChartTren) { _kepsekChartTren.destroy(); _kepsekChartTren = null; }
    _kepsekChartTren = new Chart(ctxTren, {
      type: 'line',
      data: {
        labels: d.labels || [],
        datasets: [{
          label: 'Jurnal Masuk',
          data: d.weekly || [],
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99,102,241,0.10)',
          fill: true,
          tension: 0.42,
          pointBackgroundColor: '#6366f1',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          borderWidth: 2.5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: {
          legend: { labels: { color: fg, font: { size: 11 }, usePointStyle: true, pointStyleWidth: 8 } }
        },
        scales: {
          x: { ticks: { color: fgMuted, font: { size: 10 }, maxRotation: 0 }, grid: { color: gridClr } },
          y: { ticks: { color: fgMuted, font: { size: 10 },
              callback: function(v) { return Number.isInteger(v) ? v : ''; } },
            grid: { color: gridClr }, beginAtZero: true }
        }
      }
    });
  }

  /* ── Distribusi doughnut chart ── */
  var abs = d.absence || {};
  var ctxPie = document.getElementById('chartAbsensiDist');
  if (ctxPie && typeof Chart !== 'undefined') {
    if (_kepsekChartAbsen) { _kepsekChartAbsen.destroy(); _kepsekChartAbsen = null; }
    _kepsekChartAbsen = new Chart(ctxPie, {
      type: 'doughnut',
      data: {
        labels: ['Hadir (H)', 'Sakit (S)', 'Izin (I)', 'Alpha (A)'],
        datasets: [{
          data: [abs.H || 0, abs.S || 0, abs.I || 0, abs.A || 0],
          backgroundColor: ['#22c55e', '#facc15', '#60a5fa', '#f87171'],
          hoverBackgroundColor: ['#16a34a', '#eab308', '#3b82f6', '#ef4444'],
          borderWidth: 0,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { animateScale: true, animateRotate: true, duration: 900 },
        cutout: '62%',
        plugins: {
          legend: { position: 'bottom',
            labels: { color: fg, font: { size: 11 }, padding: 12, usePointStyle: true, pointStyleWidth: 8 } }
        }
      }
    });
  }
}

/* ─────────────────────────────────────────────────────────────
   EARLY WARNING — Siswa Bermasalah
   ───────────────────────────────────────────────────────────── */
function loadEarlyWarning() {
  var section = document.getElementById('kepsekEarlyWarningSection');
  if (!section) return;
  section.innerHTML = '<p class="muted" id="kepsekEwLoadingText" style="font-size:12px;margin-bottom:6px"></p><div class="skeleton" style="height:120px;border-radius:14px"></div>';
  var stopTimer = startElapsedNotice_(document.getElementById('kepsekEwLoadingText'), '⏳ Memuat early warning...');

  google.script.run
    .withSuccessHandler(function(rows) {
      stopTimer();
      _renderEarlyWarning_(rows, section);
    })
    .withFailureHandler(function(err) {
      stopTimer();
      section.innerHTML = '<div class="alert-banner error">❌ ' + _esc(err.message || 'Gagal') + '</div>';
    })
    .getEarlyWarningSiswa();
}

function _renderEarlyWarning_(data, section) {
  if (!data || data.length === 0) {
    section.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<h3 style="margin:0;font-size:15px">⚠️ Early Warning Siswa</h3>' +
        '<button onclick="_exportEWExcel_()" style="background:#059669;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600">📥 Excel</button>' +
      '</div>' +
      '<div class="alert-banner" style="background:#dcfce7;border-color:#22c55e;color:#166534">✅ Tidak ada siswa dengan Sakit/Izin/Alpa tercatat.</div>';
    return;
  }

  var totalKelas = data.length;
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
    '<h3 style="margin:0;font-size:15px">⚠️ Early Warning Siswa <span style="background:#fee2e2;color:#991b1b;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px">' + totalKelas + ' kelas</span></h3>' +
    '<button onclick="_exportEWExcel_()" style="background:#059669;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600">📥 Excel</button>' +
    '</div>' +
    '<p class="muted" style="font-size:12px;margin:0 0 12px">Top 3 siswa dengan Sakit/Izin/Alpa terbanyak di tiap kelas pada tahun pelajaran &amp; semester aktif, digabung dari semua mapel &amp; guru di sekolah ini (1 hari dihitung 1x walau tercatat di beberapa mapel).</p>' +
    '<div style="width:100%;overflow:hidden"><table style="table-layout:fixed;width:100%;border-collapse:collapse">' +
    '<colgroup><col style="width:14%"><col style="width:43%"><col style="width:43%"></colgroup>' +
    '<thead><tr><th style="padding:7px 8px;text-align:left">Kelas</th><th style="padding:7px 8px;text-align:left">Nama Siswa</th><th style="padding:7px 8px;text-align:left">Persentase Absensi</th></tr></thead><tbody>';

  var LABEL_ = { S: 'Sakit', I: 'Izin', A: 'Alpa' };
  var WARNA_ = { S: '#854d0e', I: '#1e40af', A: '#991b1b' };

  data.forEach(function(kls) {
    var namaLis = kls.siswa.map(function(s) { return '<li style="text-align:left">' + _esc(s.nama || s.nis) + '</li>'; }).join('');
    var statLis = kls.siswa.map(function(s) {
      var d = s.dominant || { kategori: 'A', jumlah: 0 };
      return '<li style="text-align:left"><span style="color:' + (WARNA_[d.kategori] || '#374151') + ';font-weight:700">' +
        (LABEL_[d.kategori] || d.kategori) + ': ' + d.jumlah + '</span></li>';
    }).join('');
    html += '<tr>' +
      '<td style="padding:7px 8px;font-weight:700;text-align:left;vertical-align:top">' + _esc(kls.kelas) + '</td>' +
      '<td style="padding:7px 8px;font-size:12px;text-align:left;vertical-align:top"><ul style="margin:0;padding-left:16px;line-height:1.8;text-align:left">' + namaLis + '</ul></td>' +
      '<td style="padding:7px 8px;font-size:12px;text-align:left;vertical-align:top"><ul style="margin:0;padding-left:16px;line-height:1.8;text-align:left">' + statLis + '</ul></td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  section.innerHTML = html;
}

/* ─────────────────────────────────────────────────────────────
   RAPORT ABSENSI (UMUM PER KELAS)
   ───────────────────────────────────────────────────────────── */
function loadRaportAbsensi() {
  var section = document.getElementById('kepsekRaportSection');
  if (!section) return;
  section.innerHTML = '<p class="muted" id="kepsekRaportLoadingText" style="font-size:12px;margin-bottom:6px"></p><div class="skeleton" style="height:160px;border-radius:14px"></div>';
  var stopTimer = startElapsedNotice_(document.getElementById('kepsekRaportLoadingText'), '⏳ Memuat raport absensi...');

  google.script.run
    .withSuccessHandler(function(rows) {
      stopTimer();
      _renderRaportAbsensi_(rows, section);
    })
    .withFailureHandler(function(err) {
      stopTimer();
      section.innerHTML = '<div class="alert-banner error">❌ ' + _esc(err.message || 'Gagal') + '</div>';
    })
    .getRaportAbsensiSiswa();
}

function _renderRaportAbsensi_(rows, section) {
  if (!rows || rows.length === 0) {
    section.innerHTML =
      '<h3 style="margin:0 0 10px;font-size:15px">📋 Raport Absensi (per Kelas)</h3>' +
      '<div class="alert-banner info">ℹ️ Belum ada data absensi.</div>';
    return;
  }

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
    '<h3 style="margin:0;font-size:15px">📋 Raport Absensi (per Kelas)</h3>' +
    '<div style="display:flex;gap:8px">' +
      '<button onclick="_exportRaportExcel_()" style="background:#059669;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600">📥 Excel</button>' +
      '<button onclick="_printRaport_()" style="background:#6366f1;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600">🖨️ Print/PDF</button>' +
    '</div>' +
    '</div>' +
    '<div style="width:100%;overflow:hidden"><table id="raportTable" style="table-layout:fixed;width:100%;border-collapse:collapse">' +
    '<colgroup><col style="width:20%"><col style="width:14%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"></colgroup>' +
    '<thead><tr><th style="padding:7px 8px;text-align:left">Kelas</th><th style="padding:7px 6px">Total Siswa</th><th style="padding:7px 4px">H</th><th style="padding:7px 4px">S</th><th style="padding:7px 4px">I</th><th style="padding:7px 4px">A</th><th style="padding:7px 4px">Total</th><th style="padding:7px 6px">% Hadir</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r) {
    var pct  = r.persenHadir;
    var pBg  = pct >= 80 ? '#dcfce7' : pct >= 60 ? '#fef9c3' : '#fee2e2';
    var pClr = pct >= 80 ? '#166534' : pct >= 60 ? '#854d0e' : '#991b1b';
    html += '<tr>' +
      '<td style="padding:7px 8px;font-weight:700;font-size:13px">' + _esc(r.kelas) + '</td>' +
      '<td style="padding:7px 6px;text-align:center">' + r.totalSiswa + '</td>' +
      '<td style="padding:7px 4px;text-align:center;color:#166534;font-weight:700">' + r.H + '</td>' +
      '<td style="padding:7px 4px;text-align:center;color:#854d0e">' + r.S + '</td>' +
      '<td style="padding:7px 4px;text-align:center;color:#1e40af">' + r.I + '</td>' +
      '<td style="padding:7px 4px;text-align:center;color:#991b1b;font-weight:700">' + r.A + '</td>' +
      '<td style="padding:7px 4px;text-align:center">' + r.total + '</td>' +
      '<td style="padding:7px 6px;text-align:center"><span style="background:' + pBg + ';color:' + pClr + ';padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700">' + pct + '%</span></td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  section.innerHTML = html;
}

/* ─────────────────────────────────────────────────────────────
   PRINT / PDF Raport
   ───────────────────────────────────────────────────────────── */
function _printRaport_() {
  var table = document.getElementById('raportTable');
  if (!table) {
    if (typeof showToast === 'function') showToast('⚠️ Muat raport dulu sebelum print', 'warning');
    return;
  }
  var win = window.open('', '_blank');
  win.document.write('<html><head><title>Raport Absensi per Kelas</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:24px;font-size:12px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left}th{background:#f3f4f6;font-weight:700}tr:nth-child(even){background:#f9fafb}</style>' +
    '</head><body>' +
    '<h2 style="margin-bottom:4px">Raport Absensi per Kelas</h2>' +
    '<p style="color:#666;margin-bottom:12px">Dicetak: ' + new Date().toLocaleDateString('id-ID') + '</p>' +
    table.outerHTML +
    '</body></html>');
  win.document.close();
  win.print();
}

/* ─────────────────────────────────────────────────────────────
   EXPORT EXCEL — Early Warning + Raport
   ───────────────────────────────────────────────────────────── */
function _exportEWExcel_() {
  if (typeof XLSX === 'undefined') { if (typeof showToast === 'function') showToast('⏳ Library belum siap', 'warning'); return; }
  if (typeof showToast === 'function') showToast('⏳ Menyiapkan Excel...', 'info', 3000);

  google.script.run
    .withSuccessHandler(function(data) {
      var wb   = XLSX.utils.book_new();
      var LABEL_ = { S: 'Sakit', I: 'Izin', A: 'Alpa' };
      var rows = [['Kelas', 'Nama', 'Paling Parah', 'Jumlah', '% Hadir', 'S', 'I', 'A']];
      (data || []).forEach(function(kls) {
        (kls.siswa || []).forEach(function(s) {
          var d = s.dominant || { kategori: 'A', jumlah: 0 };
          rows.push([kls.kelas, s.nama, LABEL_[d.kategori] || d.kategori, d.jumlah, s.persen + '%', s.S, s.I, s.A]);
        });
      });
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [10,25,12,8,8,5,5,5].map(function(w){ return {wch:w}; });
      XLSX.utils.book_append_sheet(wb, ws, 'Early Warning');
      XLSX.writeFile(wb, 'EarlyWarning_SIA_Terbanyak.xlsx');
      if (typeof showToast === 'function') showToast('✅ File Excel diunduh', 'success');
    })
    .withFailureHandler(function(err) {
      if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal'), 'error');
    })
    .getEarlyWarningSiswa();
}

function _exportRaportExcel_() {
  if (typeof XLSX === 'undefined') { if (typeof showToast === 'function') showToast('⏳ Library belum siap', 'warning'); return; }
  if (typeof showToast === 'function') showToast('⏳ Menyiapkan Excel...', 'info', 3000);

  google.script.run
    .withSuccessHandler(function(rows) {
      var wb   = XLSX.utils.book_new();
      var data = [['Kelas', 'Total Siswa', 'H', 'S', 'I', 'A', 'Total', '% Hadir']];
      (rows || []).forEach(function(r) {
        data.push([r.kelas, r.totalSiswa, r.H, r.S, r.I, r.A, r.total, r.persenHadir + '%']);
      });
      var ws = XLSX.utils.aoa_to_sheet(data);
      ws['!cols'] = [12,12,6,6,6,6,8,10].map(function(w){ return {wch:w}; });
      XLSX.utils.book_append_sheet(wb, ws, 'Raport Absensi');
      XLSX.writeFile(wb, 'Raport_Absensi_per_Kelas.xlsx');
      if (typeof showToast === 'function') showToast('✅ File Excel diunduh', 'success');
    })
    .withFailureHandler(function(err) {
      if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal'), 'error');
    })
    .getRaportAbsensiSiswa();
}

/* ─────────────────────────────────────────────────────────────
   EXPORT EXCEL — Rekap Guru + Kehadiran
───────────────────────────────────────────────────────────── */
function _exportRekapSekolahExcel_() {
  if (typeof XLSX === 'undefined') {
    if (typeof showToast === 'function') showToast('⏳ Library belum siap, coba lagi sesaat.', 'warning');
    return;
  }
  if (typeof showToast === 'function') showToast('⏳ Menyiapkan file Excel...', 'info', 3000);

  google.script.run
    .withFailureHandler(function(err) {
      if (typeof showToast === 'function') showToast('❌ ' + (err && err.message || 'Gagal'), 'error');
    })
    .withSuccessHandler(function(data) {
      var wb = XLSX.utils.book_new();

      // Sheet 1: Rekap Guru
      var guruRows = [['No','Nama Guru','Email','Jurnal Bulan Ini','Total Jurnal','Kelas Diampu','Mata Pelajaran','Jurnal Terakhir','Status']];
      (data.guruList || []).forEach(function(g, i) {
        guruRows.push([i+1, g.nama, g.email, g.totalJurnalBulan, g.totalJurnal, (g.kelasList||[]).join(', '), (g.mapelList||[]).join(', '), g.lastJurnal, g.statusJurnal]);
      });
      var wsGuru = XLSX.utils.aoa_to_sheet(guruRows);
      // Column widths
      wsGuru['!cols'] = [5,25,30,16,14,20,20,18,14].map(function(w){ return {wch:w}; });
      XLSX.utils.book_append_sheet(wb, wsGuru, 'Rekap Guru');

      // Sheet 2: Info Sekolah
      var infoRows = [
        ['Sekolah', data.sekolah || ''],
        ['Tahun Pelajaran', data.tahun_pelajaran || ''],
        ['Semester', data.semester || ''],
        ['Bulan Rekap', data.bulanLabel || ''],
        ['Total Guru', data.totalGuru],
        ['Guru Aktif (Jurnal)', data.guruAktif],
        ['Jurnal Bulan Ini', data.totalJurnalBulan],
        ['Total Siswa', data.totalSiswa],
        ['Dicetak', new Date().toLocaleDateString('id-ID')]
      ];
      var wsInfo = XLSX.utils.aoa_to_sheet(infoRows);
      wsInfo['!cols'] = [{wch:20},{wch:30}];
      XLSX.utils.book_append_sheet(wb, wsInfo, 'Info Sekolah');

      var fileName = 'Rekap_' + (data.sekolah || 'Sekolah').replace(/\s+/g,'_') + '_' + (data.bulanLabel || '').replace(/\s+/g,'') + '.xlsx';
      XLSX.writeFile(wb, fileName);
      if (typeof showToast === 'function') showToast('✅ File Excel berhasil diunduh', 'success');
    })
    .getRekapSekolah();
}
