<script>
function _setGlobalBar_(pct){
  var bar = document.getElementById('dashProgressBar');
  if(!bar) return;
  bar.style.width = pct + '%';
}

window.showTab = window.showTab || function(){
  console.warn('[JADWAL] showTab fallback dipakai sebelum scripts-nav ter-load');
};

if (typeof window.loadJadwalSetting !== 'function') {
  window.loadJadwalSetting = function(){
    if (window._jadwalSettingQueued) return;
    window._jadwalSettingQueued = true;
    setTimeout(function(){
      window._jadwalSettingQueued = false;
      if (typeof window.__loadJadwalSettingImpl === 'function') {
        window.__loadJadwalSettingImpl();
      }
    }, 0);
  };
}

if (typeof window.saveJadwalUI !== 'function') {
  window.saveJadwalUI = function(){
    console.warn('[JADWAL] saveJadwalUI fallback dipakai sebelum scripts-jadwal-wali ter-load');
  };
}

function _getProgressUi_(){
  return {
    box: document.getElementById('progressBox'),
    inner: document.getElementById('progressInner'),
    percent: document.getElementById('progressPercent')
  };
}

function startProgress(){
  if(typeof _markProgressStart === 'function') _markProgressStart();
  // Animate green top bar
  clearInterval(window._globalBarInterval);
  var _gp = 0;
  _setGlobalBar_(0);
  window._globalBarInterval = setInterval(function(){
    _gp = Math.min(_gp + Math.random()*6+3, 85);
    _setGlobalBar_(_gp);
    if(_gp >= 85) clearInterval(window._globalBarInterval);
  }, 150);
  // Animate centered progress box. Jangan bergantung pada global ID-to-window
  // binding karena itu tidak konsisten di semua browser/webview GAS.
  var ui = _getProgressUi_();
  clearInterval(window.progressInterval);
  window.progressValue = 0;
  if(ui.inner) ui.inner.style.width = '0%';
  if(ui.percent) ui.percent.innerText = '0%';
  if(ui.box) ui.box.style.display = 'block';
  window.progressInterval = setInterval(function(){
    if(window.progressValue < 90){
      window.progressValue += Math.random()*8+4;
      if(window.progressValue > 90) window.progressValue = 90;
      if(ui.inner) ui.inner.style.width = window.progressValue + '%';
      if(ui.percent) ui.percent.innerText = Math.floor(window.progressValue) + '%';
    }
  },180);
}

function endProgress(){
  if(typeof _markProgressEnd === 'function') _markProgressEnd();
  // Complete green top bar then hide
  clearInterval(window._globalBarInterval);
  _setGlobalBar_(100);
  setTimeout(function(){ _setGlobalBar_(0); }, 600);
  // Complete centered progress box
  var ui = _getProgressUi_();
  clearInterval(window.progressInterval);
  window.progressValue = 100;
  if(ui.inner) ui.inner.style.width = '100%';
  if(ui.percent) ui.percent.innerText = '100%';
  if(ui.box) setTimeout(function(){ ui.box.style.display = 'none'; }, 600);
}

window.startProgress = startProgress;
window.endProgress = endProgress;
window._getJadwalSaveDebug = function(){
  return window._jadwalSaveDebug || null;
};

let _fotoZoomEl_ = null;
function _fotoZoomShow_(ev, fileId){
  _fotoZoomHide_();
  const img = document.createElement('img');
  img.src = 'https://lh3.googleusercontent.com/d/' + fileId + '=w420-h420';
  img.style.cssText = 'position:fixed;z-index:99999;border-radius:12px;border:3px solid #fff;'
    + 'box-shadow:0 12px 40px rgba(0,0,0,.4);pointer-events:none;max-width:280px;max-height:280px;'
    + 'object-fit:cover;opacity:0;transition:opacity .12s ease';
  document.body.appendChild(img);
  _fotoZoomEl_ = img;
  _fotoZoomMove_(ev);
  requestAnimationFrame(function(){ if(_fotoZoomEl_) _fotoZoomEl_.style.opacity = '1'; });
}
function _fotoZoomMove_(ev){
  if(!_fotoZoomEl_) return;
  const t = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = t.clientX + 24, y = t.clientY + 24;
  if(x + 290 > vw) x = t.clientX - 300;
  if(y + 290 > vh) y = t.clientY - 300;
  _fotoZoomEl_.style.left = Math.max(8, x) + 'px';
  _fotoZoomEl_.style.top  = Math.max(8, y) + 'px';
}
function _fotoZoomHide_(){
  if(_fotoZoomEl_){ _fotoZoomEl_.remove(); _fotoZoomEl_ = null; }
}
window._fotoZoomShow_ = _fotoZoomShow_;
window._fotoZoomMove_ = _fotoZoomMove_;
window._fotoZoomHide_ = _fotoZoomHide_;

// Jam Ke disimpan sebagai satu string di sheet — "08:00-09:45" (jam
// mulai-selesai). Format sudah HH:MM (input type=time), jadi tidak perlu
// diproses lagi selain digabung dengan "-".
function _gabungJamKe_(mulai, selesai){
  mulai = String(mulai || '').trim();
  selesai = String(selesai || '').trim();
  if(!mulai) return '';
  return (selesai && selesai !== mulai) ? (mulai + '-' + selesai) : mulai;
}

// Pecah string Jam Ke tersimpan ("08:00-09:45" atau "08:00") jadi
// {mulai, selesai} untuk mengisi ulang input jam saat Edit/Duplikat.
function _pecahJamKe_(jamKeStr){
  const s = String(jamKeStr || '').trim();
  if(!s) return { mulai: '', selesai: '' };
  const parts = s.split('-').map(p => p.trim()).filter(Boolean);
  if(parts.length >= 2) return { mulai: parts[0], selesai: parts[1] };
  return { mulai: parts[0] || '', selesai: parts[0] || '' };
}

// Begitu Kelas (atau Tanggal) dipilih, cari otomatis jam mengajar guru
// ini untuk Kelas & Hari (dari Tanggal) itu di Jadwal Mengajar yang
// sudah dikonfigurasi — supaya guru tidak perlu ketik manual, dan
// otomatis benar walau jam berbeda di hari tertentu (mis. Kamis/Sabtu
// lebih pendek dari hari lain). Berjalan juga saat mode edit, tapi
// hanya kalau Jam Mulai/Selesai masih kosong (lihat guard di bawah) —
// supaya bisa dipakai untuk isi ulang entri lama yang Jam-nya belum
// terisi, tanpa menimpa entri yang Jam-nya sudah benar.
function _autoIsiJamDariJadwal_(){
  // Jangan timpa Jam yang sudah terisi (baik saat input baru maupun edit)
  // — cuma bantu isi kalau memang masih kosong (mis. entri lama yang
  // belum sempat diisi jam-nya).
  if(jamMulai.value && jamSelesai.value) return;
  if(!kelas.value || !tanggal.value) return;
  const info = document.getElementById('jamAutoInfo');
  if(info) info.textContent = '⏳ Mencari jam dari Jadwal Mengajar...';
  google.script.run
    .withSuccessHandler(hasil=>{
      console.log('[AUTO JAM] kelas=' + kelas.value + ' tanggal=' + tanggal.value + ' hasil=', hasil);
      if(!hasil){
        if(info) info.textContent = '⚠️ Tidak ditemukan jadwal untuk kelas & hari ini — isi Jam Mulai/Selesai manual.';
        return;
      }
      if(hasil.jam_mulai)   jamMulai.value   = hasil.jam_mulai;
      if(hasil.jam_selesai) jamSelesai.value = hasil.jam_selesai;
      if(info) info.textContent = '✅ Jam otomatis terisi dari Jadwal Mengajar — boleh diubah kalau ada penyesuaian.';
    })
    .withFailureHandler(err=>{
      console.error('[AUTO JAM] error:', err);
      if(info) info.textContent = '⚠️ Gagal cek Jadwal Mengajar — isi Jam Mulai/Selesai manual.';
    })
    .getJamMengajarUntukKelas(kelas.value, tanggal.value);
}

function renderRiwayatPagination(){
  const box = document.getElementById('riwayatPagination');
  box.innerHTML = '';

  const totalPage = Math.ceil(riwayatTotal / riwayatLimit);
  if(totalPage <= 1) return;

  const maxBtn  = 7;
  let   btnFrom = Math.max(1, riwayatPage - Math.floor(maxBtn/2));
  let   btnTo   = Math.min(totalPage, btnFrom + maxBtn - 1);
  if(btnTo - btnFrom < maxBtn - 1) btnFrom = Math.max(1, btnTo - maxBtn + 1);

  if(btnFrom > 1) box.innerHTML += `<button class="ghost" onclick="loadRiwayat(1)">« 1</button>`;

  for(let i = btnFrom; i <= btnTo; i++){
    box.innerHTML += `
      <button class="ghost"
        onclick="loadRiwayat(${i})"
        style="${i===riwayatPage?'font-weight:700;background:#dbeafe':''}">
        ${i}
      </button>
    `;
  }

  if(btnTo < totalPage) box.innerHTML += `<button class="ghost" onclick="loadRiwayat(${totalPage})">${totalPage} »</button>`;
  box.innerHTML += `<span class="muted" style="font-size:12px;align-self:center;margin-left:4px">(${riwayatTotal} jurnal)</span>`;
}

/* ================= NAV ================= */
let _currentTab = 'dashboard';
// Tab yang tidak disimpan ke localStorage (butuh inisialisasi manual)
var TABS_NO_RESTORE = ['inputNilai', 'DashboardSuperAdmin'];

function showTab(id){
  if(window._dblog) _dblog('showTab(' + id + ')');
  // Jangan simpan tab yang butuh inisialisasi manual
  if (!TABS_NO_RESTORE.includes(id)) {
    localStorage.setItem('lastTab', id);
  }
  _currentTab = id;

  // Try current doc first, fallback to parent/top frame
  var _doc = document;
  var tabs = _doc.querySelectorAll('[data-tabid]');
  if(tabs.length === 0 && window.parent && window.parent !== window){
    try{ _doc = window.parent.document; tabs = _doc.querySelectorAll('[data-tabid]'); }catch(e){}
  }
  if(tabs.length === 0 && window.top && window.top !== window){
    try{ _doc = window.top.document; tabs = _doc.querySelectorAll('[data-tabid]'); }catch(e){}
  }
  if(window._dblog) _dblog('tabs=' + tabs.length + ' in ' + (_doc === document ? 'self' : 'parent/top'));

  tabs.forEach(t=>{ t.style.removeProperty('display'); t.style.setProperty('display','none','important'); });

  var el = _doc.getElementById(id) || _doc.querySelector('[data-tabid="' + id + '"]');
  if(window._dblog) _dblog('target ' + id + ': ' + (el ? 'FOUND' : 'NULL'));
  if(el){ el.style.removeProperty('display'); el.style.setProperty('display','block','important'); }

  // Update FAB context
  updateFab_(id);

  // 🔥 AUTO LOAD RIWAYAT SAAT TAB DIBUKA
  if(id === 'riwayat'){
    restoreRiwayatFilterState();  // ✅ restore filter state
    loadRiwayat();
    loadArsipRiwayat(); // tetap aman
    loadRiwayatFilterKelas(); // isi dropdown filter kelas
  }

  // 🔥 LOAD REKAP ABSENSI (rentang tanggal + rekap per kelas)
  if(id === 'rekap'){
    initLaporanAbsensiKelas();
  }

  // 🔥 AUTO LOAD SETTING + JADWAL
  if(id === 'setting'){
    loadSettingForm();
    if(typeof loadJadwalSetting === 'function'){
      loadJadwalSetting();
    } else {
      console.warn('[JADWAL] loadJadwalSetting belum tersedia saat tab setting dibuka');
    }
  }

  // 🔥 LOAD KELAS SAAT BUKA JURNALKU
  if(id === 'jurnalku'){
    loadKelas();
    if(!editingJurnalId && typeof _setModeEditJurnalUI_ === 'function') _setModeEditJurnalUI_(false);
    // Restore draft (hanya jika bukan mode edit)
    setTimeout(function() { if (!editingJurnalId) restoreDraft_(); }, 300);
  }

  // 🔥 LOAD JURNAL GURU WALI
  if(id === 'jurnalGuruWali'){
    loadJurnalGuruWali();
    setTimeout(function() { if (typeof gwRestoreDraft_ === 'function') gwRestoreDraft_(); }, 300);
  }

  // 🔥 DASHBOARD FIX
  if(id === 'dashboard'){
    initDashboardMeta();
    // Load jadwal independently — use loadJadwalDashboard_ if available, else fallback
    if(typeof loadJadwalDashboard_ === 'function'){
      loadJadwalDashboard_();
    } else if(typeof _loadJadwalFallback_ === 'function'){
      _loadJadwalFallback_();
    }

    setTimeout(()=>{
      if(typeof chartJurnal !== 'undefined' && chartJurnal) chartJurnal.resize();
      if(typeof chartAbsen  !== 'undefined' && chartAbsen)  chartAbsen.resize();
    },50);
  }
}

/* ===== FAB context-aware ===== */
function updateFab_(tabId) {
  const fab = document.getElementById('fabJurnal');
  if (!fab) return;

  if (tabId === 'jurnalku') {
    fab.textContent = '+';
    fab.title = 'Tambah Jurnal Baru';
    fab.style.background = '#22c55e';
    fab.style.boxShadow = '0 18px 40px rgba(34,197,94,.45)';
    fab.classList.remove('hide');
  } else if (tabId === 'inputNilai'
    && typeof nilaiState !== 'undefined'
    && nilaiState.rows && nilaiState.rows.length > 0
    && nilaiState.locked) {
    // Hanya tampil jika data sudah dimuat dan sedang terkunci (belum edit)
    fab.textContent = '+';
    fab.title = 'Input Nilai';
    fab.style.background = '#6C63FF';
    fab.style.boxShadow = '0 18px 40px rgba(108,99,255,.45)';
    fab.classList.remove('hide');
  } else {
    fab.classList.add('hide');
  }
}

/* ================= KELAS & SISWA ================= */
let pendingAbsensiData = []; // untuk restore absensi saat editJurnal

// Token anti-race: kalau loadKelas() sempat terpanggil dobel (mis. showTab
// ke jurnalku terpicu 2x hampir bersamaan), respons yang BASI diabaikan
// supaya daftar Kelas tidak dobel-tampil.
let _loadKelasToken_ = 0;
function loadKelas(onDone){
  const myToken = ++_loadKelasToken_;
  kelas.innerHTML='<option value="">-- Pilih Kelas --</option>';
  google.script.run.withSuccessHandler(d=>{
    if(myToken !== _loadKelasToken_) return;
    d.forEach(k=>kelas.innerHTML+=`<option>${k}</option>`);
    if(typeof onDone === 'function') onDone();
  }).getKelas();
}

function loadSiswa(){
  if(!kelas.value) return;
  startProgress();
  siswaBody.innerHTML='';
  google.script.run.withSuccessHandler(d=>{
    d.forEach(s=>{
      siswaBody.innerHTML+=`
      <tr>
        <td>${s.no_absen}</td>
        <td class="left">${s.nama}</td>
        <td>${s.jk}</td>
        <td>
          <select data-nis="${s.nis}">
            <option>H</option>
            <option>S</option>
            <option>I</option>
            <option>A</option>
          </select>
        </td>
      </tr>`;
    });
    // Restore absensi jika sedang edit
    if(pendingAbsensiData && pendingAbsensiData.length){
      pendingAbsensiData.forEach(ab=>{
        const sel = siswaBody.querySelector('select[data-nis="'+ab.nis+'"]');
        if(sel) sel.value = ab.status;
      });
      pendingAbsensiData = [];
    }
    endProgress();
  }).getSiswaByKelas(kelas.value);

  // Sarankan "Pertemuan Ke" berikutnya untuk kelas ini (dropdown 1-24
  // sebelumnya statis, diam-diam nyangkut di pilihan pertama kalau lupa
  // diganti manual) — TIDAK dijalankan saat mode edit (editJurnal sudah
  // set nilai pertemuan yang benar sebelum manggil loadSiswa) atau saat
  // draft sedang dipulihkan (restoreDraft_ menimpa nilai ini lagi
  // setelahnya kalau draft.pertemuan ada, jadi aman tetap dipanggil).
  if(!editingJurnalId && typeof pertemuan !== 'undefined' && pertemuan){
    google.script.run
      .withSuccessHandler(function(next){
        if(pertemuan && next) pertemuan.value = String(next);
      })
      .withFailureHandler(function(){})
      .getNextPertemuanKe(kelas.value);
  }

  if(!editingJurnalId){
    _populateSalinJurnalBox_(kelas.value);
  }
  _autoIsiJamDariJadwal_();
}

// Guru mengajar beberapa kelas tingkat sama (mis. 7A, 7B, 7C) dengan
// Materi/Tujuan/Asesmen/Refleksi yang sama, cuma Kelas & Absensi yang
// beda — box ini menawarkan salin dari kelas lain tingkat sama yang
// sudah diisi duluan, supaya tidak ketik ulang. Tetap bisa diedit
// setelah disalin.
let _salinJurnalData_ = [];
function _populateSalinJurnalBox_(kelasVal){
  const box = document.getElementById('salinJurnalBox');
  const sel = document.getElementById('salinJurnalSelect');
  if(!box || !sel) return;
  if(!kelasVal){ box.style.display = 'none'; return; }
  google.script.run
    .withSuccessHandler(list=>{
      _salinJurnalData_ = list || [];
      if(!_salinJurnalData_.length){ box.style.display = 'none'; return; }
      sel.innerHTML = _salinJurnalData_.map((d,i)=>{
        const ringkas = (d.materi || '').slice(0,40);
        return `<option value="${i}">${d.kelas} — ${d.tanggal} — ${ringkas}${(d.materi||'').length>40?'…':''}</option>`;
      }).join('');
      box.style.display = 'block';
    })
    .withFailureHandler(()=>{ box.style.display = 'none'; })
    .getRecentJurnalUntukSalin(kelasVal);
}

function salinJurnalDariKelasLain_(){
  const sel = document.getElementById('salinJurnalSelect');
  if(!sel || !_salinJurnalData_.length) return;
  const d = _salinJurnalData_[Number(sel.value)];
  if(!d) return;
  if(typeof materi !== 'undefined' && materi) materi.value = d.materi || '';
  if(typeof tujuan !== 'undefined' && tujuan) tujuan.value = d.tujuan || '';
  if(typeof asesmen !== 'undefined' && asesmen) asesmen.value = d.asesmen || '';
  if(typeof refleksi !== 'undefined' && refleksi) refleksi.value = d.refleksi || '';
  if(typeof showToast === 'function') showToast('📋 Disalin dari ' + d.kelas + ' — boleh diedit sebelum simpan', 'success', 3000);
}
/* ================= RIWAYAT ================= */
function loadRiwayatFilterKelas(){
  const sel = document.getElementById('riwayatFilterKelas');
  if(!sel || sel.options.length > 1) return;
  google.script.run.withSuccessHandler(d=>{
    d.forEach(k=> sel.innerHTML += '<option>' + k + '</option>');
    // ✅ Restore persisted kelas after dropdown populated
    const restoreVal = sel.getAttribute('data-restore');
    if(restoreVal){
      sel.value = restoreVal;
      sel.removeAttribute('data-restore');
    }
  }).getKelas();
}

function resetRiwayatFilter(){
  ['riwayatFilterDari','riwayatFilterSampai','riwayatFilterCari'].forEach(function(id){
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  const sel = document.getElementById('riwayatFilterKelas');
  if(sel) sel.value = '';
  // ✅ Clear persisted filter state
  localStorage.removeItem('riwayatFilter');
  loadRiwayat(1);
}

/* ✅ Save filter state to localStorage */
function saveRiwayatFilterState(){
  const state = {
    dari  : (document.getElementById('riwayatFilterDari')   || {}).value || '',
    sampai: (document.getElementById('riwayatFilterSampai') || {}).value || '',
    kelas : (document.getElementById('riwayatFilterKelas')  || {}).value || '',
    cari  : (document.getElementById('riwayatFilterCari')   || {}).value || ''
  };
  localStorage.setItem('riwayatFilter', JSON.stringify(state));
}

/* ✅ Restore filter state from localStorage */
function restoreRiwayatFilterState(){
  try{
    const saved = localStorage.getItem('riwayatFilter');
    if(!saved) return;
    const state = JSON.parse(saved);
    const dari   = document.getElementById('riwayatFilterDari');
    const sampai = document.getElementById('riwayatFilterSampai');
    const kelas  = document.getElementById('riwayatFilterKelas');
    const cari   = document.getElementById('riwayatFilterCari');
    if(dari   && state.dari)   dari.value   = state.dari;
    if(sampai && state.sampai) sampai.value = state.sampai;
    if(cari   && state.cari)   cari.value   = state.cari;
    // kelas dropdown may not have its options yet — restored after loadRiwayatFilterKelas
    if(kelas  && state.kelas)  kelas.setAttribute('data-restore', state.kelas);
  }catch(e){}
}

function loadRiwayat(page = 1){
  riwayatPage = page;
  startProgress();
  renderRiwayatSkeleton(cols);

  const filters = {
    dari  : (document.getElementById('riwayatFilterDari')   || {}).value || '',
    sampai: (document.getElementById('riwayatFilterSampai') || {}).value || '',
    kelas : (document.getElementById('riwayatFilterKelas')  || {}).value || '',
    cari  : (document.getElementById('riwayatFilterCari')   || {}).value || ''
  };

  const tbody = document.getElementById('riwayatBody');

  google.script.run
    .withFailureHandler(err=>{
      console.error('Gagal load riwayat:', err);
      if(tbody){
        tbody.innerHTML = `
          <tr>
            <td colspan="10" class="muted">
              ❌ Gagal memuat riwayat jurnal
            </td>
          </tr>
        `;
      }
      endProgress();
      if(typeof showToast === 'function') showToast('❌ Gagal memuat riwayat: ' + err.message, 'error');
    })
    .withSuccessHandler(resp=>{
      riwayatData  = resp.rows  || [];
      riwayatTotal = resp.total || 0;
      renderRiwayat();
      endProgress();
    })
    .getRiwayatJurnalPaged(page, riwayatLimit, filters);
}

function $(id){
  return document.getElementById(id);
}

function _escAttr_(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Sel tabel Riwayat dengan teks panjang (Materi/TP/Asesmen/Absensi/
// Refleksi) — dibatasi 2 baris lewat CSS (.riwayat-clamp), teks lengkap
// (atau versi lain kalau hoverText dikasih terpisah, mis. Absensi yang
// tampilannya cuma hitungan tapi hover-nya daftar nama) muncul lewat
// tooltip title bawaan browser.
function _clampCell_(text, hoverText){
  const visible = (text == null || text === '') ? '-' : text;
  if(visible === '-') return '-';
  const hover = hoverText != null ? hoverText : visible;
  return `<span class="riwayat-clamp" title="${_escAttr_(hover)}">${_escAttr_(visible)}</span>`;
}

function renderRiwayat(){

  const tbody = document.getElementById('riwayatBody');
  const pageData = riwayatData; // already the correct page from server

  tbody.innerHTML = '';

  if(pageData.length === 0){
    tbody.innerHTML =
      '<tr><td colspan="10" class="muted">📭 Belum ada jurnal.</td></tr>';
    renderRiwayatPagination();
    return;
  }

  pageData.forEach(function(x){

    /* ================= FOTO FINAL FIX ABSOLUTE ================= */
      let fotoHtml = x.foto && x.foto !== '-'
        ? x.foto
        : '-';

    /* ================= ROW RENDER ================= */
    tbody.innerHTML += `
      <tr class="${x.locked ? 'locked' : ''}">
        <td>${x.no}</td>
        <td>${x.tanggal || '-'}</td>
        <td>${x.kelas || '-'}</td>
        <td>${_escAttr_(x.jam_ke) || '-'}</td>
        <td>${x.pertemuan || '-'}</td>
        <td class="left">${_clampCell_(x.materi)}</td>
        <td class="left">${_clampCell_(x.asesmen)}</td>
        <td class="left">${_clampCell_(x.absensi, x.absensiDetail)}</td>
        <td>${fotoHtml}</td>
        <td class="actions">
          <button class="ghost" onclick="toggleAksiMenu_(event, '${x.jurnalId}')" title="Menu aksi">⋮</button>
        </td>
      </tr>
    `;
  });

  renderRiwayatPagination();
}

// Refleksi disimpan kadang sebagai string biasa, kadang ter-JSON-encode
// dari perubahan lama — dipakai bersama oleh renderRiwayat (tidak lagi,
// sejak kolom Refleksi dipindah ke modal Detail) dan showDetailJurnal_.
function _normalisasiRefleksi_(raw){
  let refleksiTxt = '-';
  if(raw && raw !== '-' && raw !== '[]'){
    let ref = raw;
    if(typeof ref === 'string'){
      try{
        const parsed = JSON.parse(ref);
        if(typeof parsed === 'string') ref = parsed;
      }catch(e){}
    }
    refleksiTxt = ref;
  }
  return refleksiTxt;
}

// ===== FLOATING AKSI MENU (Detail / Edit / Duplikat / Hapus) =====
let _aksiMenuOpenId_ = null;

function toggleAksiMenu_(ev, id){
  ev.stopPropagation();
  const menu = document.getElementById('aksiFloatingMenu');
  if(!menu) return;
  if(_aksiMenuOpenId_ === id){
    closeAksiMenu_();
    return;
  }
  const x = riwayatData.find(r => String(r.jurnalId) === String(id));
  if(!x) return;

  menu.innerHTML = `
    <button onclick="closeAksiMenu_();showDetailJurnal_('${id}')">🔍 Detail</button>
    <button onclick="closeAksiMenu_();editJurnal('${id}', event)" ${x.locked ? 'disabled' : ''}>✏️ Edit</button>
    <button onclick="closeAksiMenu_();duplikatJurnal_('${id}')">📋 Duplikat</button>
    <button class="danger" onclick="closeAksiMenu_();hapusJurnal('${id}')">🗑️ Hapus</button>
    <div class="aksi-menu-info">Diedit ${x.edit_count || 0}/3</div>
  `;
  menu.style.display = 'flex';

  const rect = ev.currentTarget.getBoundingClientRect();
  const menuWidth = 176, menuHeightEstimate = 190;
  let left = rect.right - menuWidth;
  if(left < 8) left = 8;
  if(left + menuWidth > window.innerWidth - 8) left = window.innerWidth - menuWidth - 8;
  let top = rect.bottom + 4;
  if(top + menuHeightEstimate > window.innerHeight) top = rect.top - menuHeightEstimate;
  if(top < 8) top = 8;
  menu.style.left = left + 'px';
  menu.style.top  = top + 'px';

  _aksiMenuOpenId_ = id;
}

function closeAksiMenu_(){
  const menu = document.getElementById('aksiFloatingMenu');
  if(menu) menu.style.display = 'none';
  _aksiMenuOpenId_ = null;
}

document.addEventListener('click', function(ev){
  const menu = document.getElementById('aksiFloatingMenu');
  if(menu && menu.style.display !== 'none' && !menu.contains(ev.target)){
    closeAksiMenu_();
  }
});

function cetakJurnalUI_(){
  const sel = document.getElementById('cetakJurnalKelas');
  if(sel && sel.options.length <= 1){
    google.script.run.withSuccessHandler(d=>{
      (d || []).forEach(k => sel.innerHTML += '<option>' + k + '</option>');
    }).getKelas();
  }
  // Pastikan nama/NIP guru (dipakai di kop cetak) sudah tersedia — kalau
  // guru belum pernah buka tab Setting/Nilai di sesi ini, window._settingCache
  // masih kosong.
  if(!window._settingCache){
    google.script.run.withSuccessHandler(s=>{
      window._settingCache = s || {};
    }).getSetting();
  }
  // Default rentang tanggal: ikut filter Riwayat yang sedang aktif kalau ada
  const dari   = document.getElementById('riwayatFilterDari');
  const sampai = document.getElementById('riwayatFilterSampai');
  const cDari   = document.getElementById('cetakJurnalDari');
  const cSampai = document.getElementById('cetakJurnalSampai');
  if(cDari)   cDari.value   = (dari && dari.value)     ? dari.value   : '';
  if(cSampai) cSampai.value = (sampai && sampai.value) ? sampai.value : '';
  const cKelas = document.getElementById('cetakJurnalKelas');
  const fKelas = document.getElementById('riwayatFilterKelas');
  if(cKelas) cKelas.value = (fKelas && fKelas.value) ? fKelas.value : '';

function tutupCetakJurnal_(){
  const modal = document.getElementById('cetakJurnalModal');
  if(modal) modal.style.display = 'none';
}

function prosesCetakJurnal_(){
  const kelas  = (document.getElementById('cetakJurnalKelas')  || {}).value || '';
  const dari   = (document.getElementById('cetakJurnalDari')   || {}).value || '';
  const sampai = (document.getElementById('cetakJurnalSampai') || {}).value || '';
  const kertas = (document.getElementById('cetakJurnalKertas') || {}).value || 'A4';

  if(!dari || !sampai){
    if(typeof showToast === 'function') showToast('⚠️ Isi Dari Tanggal dan Sampai Tanggal dulu', 'warning');
    else alert('Isi Dari Tanggal dan Sampai Tanggal dulu');
    return;
  }
  if(sampai < dari){
    if(typeof showToast === 'function') showToast('⚠️ Sampai Tanggal tidak boleh sebelum Dari Tanggal', 'warning');
    else alert('Sampai Tanggal tidak boleh sebelum Dari Tanggal');
    return;
  }

  const btn = event && event.currentTarget ? event.currentTarget : null;
  const btnOrigHtml = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ Menyiapkan...'; }

  google.script.run
    .withSuccessHandler(rows=>{
      if(btn){ btn.disabled = false; btn.innerHTML = btnOrigHtml; }
      if(!rows || rows.length === 0){
        if(typeof showToast === 'function') showToast('📭 Tidak ada jurnal pada rentang ini', 'warning');
        else alert('Tidak ada jurnal pada rentang tanggal/kelas ini');
        return;
      }
      _bukaJendelaCetakJurnal_(rows, kelas, dari, sampai, kertas);
      tutupCetakJurnal_();
    })
    .withFailureHandler(err=>{
      if(btn){ btn.disabled = false; btn.innerHTML = btnOrigHtml; }
      if(typeof showToast === 'function') showToast('❌ Gagal menyiapkan laporan: ' + err.message, 'error');
      else alert('Gagal menyiapkan laporan: ' + err.message);
    })
    .getJurnalUntukCetak(kelas, dari, sampai);
}

function editJurnal(id, ev){
  // Progres + hitungan detik di tombol yang diklik, supaya guru tahu
  // proses memuat data jurnal sedang berlangsung (bukan diam tanpa
  // respons) sebelum form edit terisi.
  const btn = ev && ev.currentTarget ? ev.currentTarget : null;
  const btnOrigHtml = btn ? btn.innerHTML : null;
  if(btn) btn.disabled = true;
  if(typeof startProgress === 'function') startProgress();
  const stopElapsed = typeof startElapsedNotice_ === 'function' ? startElapsedNotice_(btn, '⏳') : function(){};
  const selesaiMemuat = () => {
    stopElapsed();
    if(typeof endProgress === 'function') endProgress();
    if(btn){ btn.innerHTML = btnOrigHtml; btn.disabled = false; }
  };

  google.script.run.withSuccessHandler(d=>{
    selesaiMemuat();
    if(d.locked){
      if(typeof showToast === 'function') showToast('🔒 Jurnal terkunci (≥45 hari)', 'warning');
      else alert('Jurnal terkunci (≥45 hari)');
      return;
    }
    if(d.edit_count>=3){
      if(typeof showToast === 'function') showToast('⚠️ Batas edit jurnal (3x) tercapai', 'warning');
      else alert('Batas edit jurnal tercapai');
      return;
    }
    editingJurnalId=id;
    // Simpan absensi sebelum loadSiswa agar bisa di-restore
    pendingAbsensiData = d.absensi || [];
    showTab('jurnalku');
    tanggal.value = d.tanggal || tanggal.value;
    const _jamEdit = _pecahJamKe_(d.jam_ke);
    if(_jamEdit.mulai)   jamMulai.value   = _jamEdit.mulai;
    if(_jamEdit.selesai) jamSelesai.value = _jamEdit.selesai;
    pertemuan.value=d.pertemuan;
    materi.value=d.materi;
    tujuan.value=d.tujuan||'';
    asesmen.value=d.asesmen;
    if(typeof refleksi !== 'undefined') refleksi.value = d.refleksi && d.refleksi !== '-' ? d.refleksi : '';
    _isiKelasDenganRetry_(d.kelas);
    _setModeEditJurnalUI_(true);
    if(typeof showToast === 'function') showToast('✏️ Mode edit: kelas ' + d.kelas + ' · pertemuan ' + d.pertemuan, 'info', 4000);
  }).withFailureHandler(err=>{
    selesaiMemuat();
    if(typeof showToast === 'function') showToast('❌ Gagal memuat detail jurnal', 'error');
  }).getJurnalDetail(id);
}

// Duplikat jurnal — isi ulang form dari entri yang sudah ada (Kelas,
// Tanggal, Jam Ke, Materi, Tujuan, Asesmen, Refleksi, Absensi), TAPI
// TIDAK diset sebagai mode edit (editingJurnalId tetap kosong) supaya
// saat Simpan hasilnya jadi jurnal BARU, bukan menimpa yang lama. Guru
// tinggal sesuaikan Kelas/Tanggal/Jam Ke/Absensi yang beda, sisanya boleh
// dibiarkan sama. Boleh dipakai walau jurnal sumbernya sudah terkunci
// (≥45 hari) atau sudah 3x diedit, karena tidak mengubah baris itu sendiri.
function duplikatJurnal_(id){
  google.script.run.withSuccessHandler(d=>{
    editingJurnalId = null;
    pendingAbsensiData = d.absensi || [];
    showTab('jurnalku');
    tanggal.value = d.tanggal || tanggal.value;
    const _jamDup = _pecahJamKe_(d.jam_ke);
    if(_jamDup.mulai)   jamMulai.value   = _jamDup.mulai;
    if(_jamDup.selesai) jamSelesai.value = _jamDup.selesai;
    materi.value = d.materi;
    tujuan.value = d.tujuan || '';
    asesmen.value = d.asesmen;
    if(typeof refleksi !== 'undefined') refleksi.value = d.refleksi && d.refleksi !== '-' ? d.refleksi : '';
    _isiKelasDenganRetry_(d.kelas);
    _setModeEditJurnalUI_(false);
    if(typeof showToast === 'function') showToast('📋 Jurnal diduplikat — sesuaikan Kelas/Tanggal/Jam Ke/Absensi lalu Simpan', 'info', 4500);
  }).withFailureHandler(err=>{
    if(typeof showToast === 'function') showToast('❌ Gagal memuat jurnal untuk diduplikat', 'error');
  }).getJurnalDetail(id);
}

// Isi dropdown Kelas dengan retry — dropdown-nya dimuat ASYNC lewat
// loadKelas() (dipicu oleh showTab('jurnalku')). Kalau opsinya belum
// sempat terisi saat langsung di-set, kelas.value=... diam-diam gagal
// "nempel" (browser mengabaikan value yang belum ada opsinya) — guru
// harus klik pilih Kelas manual lagi baru Absensi/Pertemuan ikut termuat.
// Dipakai baik oleh Edit maupun Duplikat jurnal.
function _isiKelasDenganRetry_(kelasVal){
  // Dulu menebak-nebak lama loadKelas() selesai lewat retry+setTimeout
  // (nyerah kalau lebih dari 3 detik, dropdown Kelas tetap kosong kalau
  // server sedang lambat). Sekarang loadKelas() sendiri yang memberi
  // tahu kapan opsinya benar-benar siap (onDone) — tidak ada lagi
  // batas waktu tebakan, dijamin nempel begitu opsinya ada.
  loadKelas(function(){
    kelas.value = kelasVal;
    loadSiswa();
  });
}

// Ganti tampilan tombol Simpan/Batal sesuai mode: jurnal baru cuma ada
// "Simpan Jurnal"; mode edit ada "Update Jurnal" + "Batal" (kembali ke

// kondisi bersih (bukan nyangkut mode edit/duplikat sebelumnya) sebelum
// pindah ke form Jurnalku.
function mulaiJurnalBaru_(){

  _setModeEditJurnalUI_(false);
  if(typeof openJurnalFocus === 'function') openJurnalFocus();
  else showTab('jurnalku');

function batalEditJurnal_(){
  editingJurnalId = null;
  _setModeEditJurnalUI_(false);
  if(typeof clearDraft_ === 'function') clearDraft_();
  showTab('riwayat');
  if(typeof loadRiwayat === 'function') loadRiwayat();
  _scrollKeAtasRiwayat_();
  if(typeof showToast === 'function') showToast('↩️ Edit dibatalkan', 'info', 2500);

// Setelah Simpan/Update/Batal, pastikan tabel Riwayat Jurnal langsung
// terlihat dari atas (bukan nyangkut di posisi scroll sebelumnya).
function _scrollKeAtasRiwayat_(){
  setTimeout(function(){
    const el = document.getElementById('riwayat');
    if(el && typeof el.scrollIntoView === 'function'){
      el.scrollIntoView({ block: 'start' });
    }
    if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  }, 50);
}

function hapusJurnal(id){
  if(!confirm('Yakin menghapus jurnal ini?')) return;
  startProgress();
  google.script.run
    .withFailureHandler(err=>{
      endProgress();
      if(typeof showToast === 'function') showToast('❌ Gagal hapus jurnal: ' + err.message, 'error');
      else alert('❌ ' + err.message);
    })
    .withSuccessHandler(()=>{
      endProgress();
      loadRiwayat();
      if(typeof showToast === 'function') showToast('🗑️ Jurnal berhasil dihapus', 'success');
    }).hapusJurnal(id);
}

  rekapBody.innerHTML='';
  google.script.run.withSuccessHandler(d=>{

/**
 * _batasBulanTahunAjaran_()
 * Tahun ajaran Indonesia berjalan Juli s/d Juni tahun berikutnya. Dari
 * format "2026/2027" hasilkan rentang bulan Juli 2026 - Juni 2027, dipakai
 * sebagai min/max input#laporanBulan supaya guru cuma bisa pilih bulan di
 * DALAM tahun ajaran aktif (sesuai permintaan), bukan bulan bebas kapan saja.
 */
function _batasBulanTahunAjaran_(tahunPelajaran){
  const m = String(tahunPelajaran || '').match(/^(\d{4})\/(\d{4})$/);
  if(!m) return null;
  return { min: m[1] + '-07', max: m[2] + '-06' };
}

function initLaporanAbsensiKelas(){
  const sel = document.getElementById('laporanKelas');
  const inp = document.getElementById('laporanBulan');

  const batas = _batasBulanTahunAjaran_(window._settingCache && window._settingCache.tahun_pelajaran);
  if(inp && batas){
    inp.min = batas.min;
    inp.max = batas.max;
  }

  if(!sel || sel.options.length > 1) return;
  google.script.run.withSuccessHandler(d=>{
    d.forEach(k=> sel.innerHTML += `<option>${k}</option>`);
  }).getKelas();

  // Default bulan = bulan sekarang, tapi tetap di dalam rentang tahun ajaran aktif
  if(inp && !inp.value){
    const now = new Date();
    let ym = now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
    if(batas){
      if(ym < batas.min) ym = batas.min;
      if(ym > batas.max) ym = batas.max;
    }
    inp.value = ym;
  }
}

async function simpan(){
  const now = Date.now();

  // 📱 TAP DELAY GUARD (KHUSUS MOBILE)
  if(now - lastTapTime < TAP_DELAY_MS){
    return;
  }
  lastTapTime = now;

  // 🚫 CEGAH DOUBLE SUBMIT LOGIC
  if(isSavingJurnal){
    return;
  }
  isSavingJurnal = true;
  const btn = document.getElementById('btnSimpanJurnal');
  if(btn){
    btn.disabled = true;
    btn.innerText = '⏳ Menyimpan...';
  }

  // 🔒 LOCK FORM (MOBILE UX)
  lockJurnalForm(true);
  startProgress();

  try{
    // ===== VALIDASI KELAS & JAM KE =====
    // Dulu Jam Ke tidak diwajibkan sama sekali — kalau lupa/kelupaan
    // kekosongan (mis. field belum sempat terisi ulang saat Duplikat/
    // Edit lalu tidak disadari), tersimpan kosong tanpa peringatan apa
    // pun. Sekarang dicegat di sini sebelum terkirim ke server.
    if(!kelas.value){
      alert('⚠️ Kelas belum dipilih');
      throw new Error('Kelas wajib');
    }
    if(!jamMulai.value || !jamSelesai.value){
      alert('⚠️ Jam Ke (Mulai/Selesai) belum diisi');
      throw new Error('Jam Ke wajib');
    }
    if(jamSelesai.value < jamMulai.value){
      alert('⚠️ Jam Selesai tidak boleh lebih kecil dari Jam Mulai');
      throw new Error('Jam Ke tidak valid');
    }

    let abs = [];
    document.querySelectorAll('#siswaBody select').forEach(s=>{
      abs.push({
        nis: s.dataset.nis,
        status: s.value
      });
    });

    // ===== VALIDASI FOTO =====
    // Minimal 1 foto HANYA wajib untuk jurnal BARU — saat edit, guru boleh
    // tidak menyentuh foto sama sekali (foto lama otomatis dipertahankan
    // oleh updateJurnal di server, lihat Jurnal.js), jadi tidak boleh
    // dipaksa pilih ulang file cuma untuk mengubah teks materi/refleksi.
    const fileInputs = ['foto1','foto2','foto3'];
    const fotoFiles = fileInputs
      .map(id => document.getElementById(id).files[0])
      .filter(f => f);
    if(!editingJurnalId && fotoFiles.length < 1){
      alert('⚠️ Minimal 1 foto dokumentasi wajib diupload');
      throw new Error('Foto wajib');
    }
    if(fotoFiles.length > 3){
      alert('⚠️ Maksimal 3 foto dokumentasi');
      throw new Error('Foto berlebih');
    }

    // ===== CEK UKURAN FILE SEBELUM UPLOAD =====
    // (Batas longgar — kompresi canvas otomatis akan mengecilkan ukuran)
    const MAX_SINGLE_KB = 15000; // 15MB raw — canvas compression handles the rest
    const MAX_TOTAL_KB  = 45000;
    const oversizeFile = fotoFiles.find(f => f.size / 1024 > MAX_SINGLE_KB);
    if (oversizeFile) {
      if(typeof showToast === 'function') showToast('⚠️ Foto terlalu besar (maks 15MB per foto)', 'warning');
      else alert('⚠️ Foto "' + oversizeFile.name + '" melebihi batas 15MB');
      throw new Error('Foto terlalu besar');
    }

    // ===== KONVERSI FOTO → BASE64 =====
    const fotos = await Promise.all(
      fotoFiles.map(f => fileToBase64(f))
    );
    const data = {
      jurnalId: editingJurnalId,
      tanggal: tanggal.value,
      kelas: kelas.value,
      jam_ke: _gabungJamKe_(jamMulai.value, jamSelesai.value),
      pertemuan: pertemuan.value,
      materi: materi.value,
      tujuan: tujuan.value,
      asesmen: asesmen.value || '-',
      refleksi: refleksi.value || '-',
      absensi: abs,
      dokumentasi: fotos
    };

    const fn = editingJurnalId ? 'updateJurnal' : 'simpanJurnal';
      google.script.run
    .withFailureHandler(err=>{
      endProgress();
      if(typeof showToast === 'function') showToast('❌ Gagal simpan jurnal: ' + err.message, 'error', 6000);
      else alert('❌ Gagal menyimpan jurnal:\n' + err.message);
      resetSimpanButton();
    })
    .withSuccessHandler(res=>{
      endProgress();

      // 🔴 CEK STATUS DARI BACKEND
      if(res && res.status === false){
        if(typeof showToast === 'function') showToast('⚠️ ' + (res.msg || 'Gagal menyimpan jurnal'), 'warning');
        else alert('⚠️ ' + (res.msg || 'Gagal menyimpan jurnal'));
        resetSimpanButton();
        return;
      }

      // ✅ BENAR-BENAR SUKSES — tapi kalau foto gagal diupload (mis. Drive
      // diblokir kebijakan domain), jurnalnya tetap tersimpan (cuma butuh
      // akses Sheets), jadi tetap diberi tahu sukses + peringatan terpisah
      // soal fotonya, bukan dianggap gagal total.
      if(res && res.fotoGagal){
        if(typeof showToast === 'function') showToast('✅ Jurnal tersimpan, tapi foto GAGAL diupload (masalah akses Drive) — coba simpan ulang tanpa foto dulu kalau perlu.', 'warning', 8000);
        else alert('✅ Jurnal tersimpan, tapi foto gagal diupload (masalah akses Drive).');
      } else {
        if(typeof showToast === 'function') showToast('✅ Jurnal berhasil disimpan!', 'success', 4000);
        else alert('✅ Jurnal berhasil disimpan');
      }
      editingJurnalId = null;
      _setModeEditJurnalUI_(false);
      clearDraft_(); // 🗑 hapus draft setelah simpan sukses
      showTab('riwayat');
      loadRiwayat();
      _scrollKeAtasRiwayat_();
      resetSimpanButton();
    })[fn](data);
    }catch(e){
    endProgress();
    resetSimpanButton();
  }
}

function resetSimpanButton(){
  isSavingJurnal = false;
  const btn = document.getElementById('btnSimpanJurnal');
  if(btn){
    btn.disabled = false;
    btn.innerText = '💾 Simpan Jurnal';
    btn.style.opacity = '1';
  }
  // 🔓 UNLOCK FORM
  lockJurnalForm(false);
}

// Kunci draft per-user agar tidak tercampur di PC yang dipakai bergantian
function getDraftKey_() {
  return 'jurnalDraft_' + (window._currentUserEmail || 'anon');
}

function saveDraft_() {
  try {
    const draft = {
      tanggal   : (document.getElementById('tanggal')   || {}).value || '',
      kelas     : (document.getElementById('kelas')     || {}).value || '',
      pertemuan : (document.getElementById('pertemuan') || {}).value || '',
      jam_ke    : _gabungJamKe_(
                    (document.getElementById('jamMulai')   || {}).value || '',
                    (document.getElementById('jamSelesai') || {}).value || ''
                  ),
      materi    : (document.getElementById('materi')    || {}).value || '',
      tujuan    : (document.getElementById('tujuan')    || {}).value || '',
      asesmen   : (document.getElementById('asesmen')   || {}).value || '',
      refleksi  : (document.getElementById('refleksi')  || {}).value || '',
      savedAt   : new Date().toISOString()
    };
    localStorage.setItem(getDraftKey_(), JSON.stringify(draft));
  } catch(e) {}
}

function restoreDraft_() {
  try {
    const raw = localStorage.getItem(getDraftKey_());
    if (!raw) return;
    const draft = JSON.parse(raw);
    // Hanya restore jika bukan mode edit (edit diisi manual oleh editJurnal())
    if (editingJurnalId) return;
    const fields = ['materi','tujuan','asesmen','refleksi'];
    fields.forEach(function(id) {
      const el = document.getElementById(id);
      if (el && draft[id]) el.value = draft[id];
    });
    if (draft.tanggal) {
      const el = document.getElementById('tanggal');
      if (el) el.value = draft.tanggal;
    }
    if (draft.jam_ke) {
      const jamDraft = _pecahJamKe_(draft.jam_ke);
      const elMulai = document.getElementById('jamMulai');
      const elSelesai = document.getElementById('jamSelesai');
      if (elMulai && jamDraft.mulai) elMulai.value = jamDraft.mulai;
      if (elSelesai && jamDraft.selesai) elSelesai.value = jamDraft.selesai;
    }
    // Kelas & pertemuan direstore terakhir: memilih kelas memuat ulang tabel
    // absensi (loadSiswa), jadi pertemuan baru diisi setelah itu supaya tidak
    // ikut ter-reset oleh proses muat ulang tersebut.
    if (draft.kelas) {
      let kelasRetry = 0;
      const applyKelas = function() {
        const selKelas = document.getElementById('kelas');
        if (!selKelas) return;
        selKelas.value = draft.kelas;
        if (selKelas.value === draft.kelas) {
          if (typeof loadSiswa === 'function') loadSiswa();
          if (draft.pertemuan) {
            const sel = document.getElementById('pertemuan');
            if (sel) sel.value = draft.pertemuan;
          }
        } else if (kelasRetry < 6) {
          // Dropdown kelas (dimuat via loadKelas async) belum siap, coba lagi sebentar
          kelasRetry++;
          setTimeout(applyKelas, 500);
        }
      };
      applyKelas();
    } else if (draft.pertemuan) {
      const sel = document.getElementById('pertemuan');
      if (sel) sel.value = draft.pertemuan;
    }
    // Toast ringan
    if (draft.materi && typeof showToast === 'function')
      showToast('\ud83d\udcbe Draft dipulihkan', 'info', 2500);
  } catch(e) {}
}

function clearDraft_() {
  try { localStorage.removeItem(getDraftKey_()); } catch(e) {}
}

// Pasang auto-save listeners setelah DOM siap
(function() {
  const ids = ['tanggal','materi','tujuan','asesmen','refleksi','pertemuan','jamMulai','jamSelesai','kelas'];
  function _attachDraftListeners() {
    ids.forEach(function(id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', saveDraft_);
      if (el) el.addEventListener('change', saveDraft_);
    });
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(_attachDraftListeners, 500);
  } else {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(_attachDraftListeners, 500); });
  }
})();
