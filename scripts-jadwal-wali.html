<script>
try { console.log('[BUILD-CHECK] scripts-jadwal-wali.html loaded, saveJadwalUI will be defined below — build 2026-08-16 (split from wali/cetak)'); } catch(e){}

// 🛟 Binding via event delegation di document, BUKAN inline onclick di
// tombol. Ini sengaja lebih kuat/tahan banting: tidak peduli kapan atau
// berapa kali tombol #btnSimpanJadwal dirender ulang, listener di
// document ini akan selalu menangkap kliknya selama halaman terbuka —
// menghindari kelas masalah "onclick tidak ke-bind" yang susah dilacak
// lewat kode statis saja. Dipasang sekali saat script ini dimuat.
document.addEventListener('click', function(e){
  var btn = e.target && e.target.closest && e.target.closest('#btnSimpanJadwal');
  if(btn){
    try { window._jadwalSaveDebug = { clickedAt: new Date().toISOString(), source: 'document-click' }; } catch(e){}
    saveJadwalUI();
  }
});

// _renderJadwalGrid_(obj, container) dulu didefinisikan DOBEL di sini dan di
// scripts-dashboard.html (last-loaded-wins, jadi versi di file ini yang
// sebenarnya aktif — dua salinan itu sudah mulai berbeda kecil, mis. guard
// typeof sebelum panggil _scheduleJadwalNotif_). Sudah digabung jadi SATU
// definisi kanonik di scripts-dashboard.html (dimuat lebih dulu di
// index.html, jadi sudah tersedia secara global saat baris di bawah ini
// dieksekusi) — lihat komentar di sana. Jangan tambahkan lagi di sini.

function loadJadwalMengajar(){
  // Refresh jadwal dashboard via endpoint khusus agar filter periode aktif
  // konsisten dengan jalur dashboard utama dan tidak ikut menarik bundle
  // dashboard penuh yang lebih lambat.
  var container = document.getElementById('jadwalGridContainer');
  if(!container) return;
  container.innerHTML = '<p class="muted" id="jadwalGridLoadingText"></p>';
  var stopTimer = startElapsedNotice_(document.getElementById('jadwalGridLoadingText'), '⏳ Memuat ulang jadwal...');
  google.script.run
    .withSuccessHandler(function(obj){
      stopTimer();
      if(!obj || obj._error) {
        container.innerHTML = '<p class="muted">📭 Belum ada jadwal untuk semester ini.</p>';
        return;
      }
      _renderJadwalGrid_(obj, container);
    })
    .withFailureHandler(function(err){
      stopTimer();
      console.error('[JADWAL] reload failed:', err);
      container.innerHTML = '<p class="muted" style="color:#ef4444">❌ Gagal muat ulang jadwal: '+(err&&err.message?err.message:'Refresh halaman')+'</p>';
    })
    .getDashboardJadwal();
}

/**
 * Dedicated jadwal loader — calls getDashboardJadwal() directly.
 * Called from showTab('dashboard') so jadwal always renders independently.
 */
function loadJadwalDashboard_(){
  var container = document.getElementById('jadwalGridContainer');
  if(!container) return;
  // Only show loading if still showing placeholder
  var stopTimer = function(){};
  if(container.innerHTML.indexOf('Memuat jadwal') !== -1){
    container.innerHTML = '<p class="muted" id="jadwalDashLoadingText"></p>';
    stopTimer = startElapsedNotice_(document.getElementById('jadwalDashLoadingText'), '⏳ Memuat jadwal...');
  }

  // Safety timeout: jika 15 detik belum ada response, tampilkan pesan & tombol reload
  var _jwTimer = setTimeout(function(){
    var c3 = document.getElementById('jadwalGridContainer');
    if(c3 && c3.innerHTML.indexOf('Memuat jadwal') !== -1){
      stopTimer();
      c3.innerHTML =
        '<div style="text-align:center;padding:20px 10px">' +
          '<div style="font-size:28px;margin-bottom:8px">⏱️</div>' +
          '<p style="color:#6b7280;font-size:13px;margin:0 0 12px">Server lambat merespons.</p>' +
          '<button onclick="loadJadwalDashboard_()" style="background:#6366f1;color:#fff;border:none;' +
            'border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer">🔄 Coba Lagi</button>' +
        '</div>';
    }
  }, 15000);

  google.script.run
    .withSuccessHandler(function(obj){
      clearTimeout(_jwTimer);
      stopTimer();
      var c2 = document.getElementById('jadwalGridContainer');
      if(!obj || obj._error) {
        console.warn('[JADWAL] getDashboardJadwal error:', obj && obj._error);
        if(c2) c2.innerHTML =
          '<div style="text-align:center;padding:20px 10px">' +
            '<div style="font-size:32px;margin-bottom:8px">📭</div>' +
            '<p style="color:#6b7280;font-size:13px;margin:0 0 12px">Belum ada jadwal untuk semester ini.</p>' +
            '<button onclick="showTab(\'setting\')" style="background:#6366f1;color:#fff;border:none;' +
              'border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer">➕ Tambah Jadwal</button>' +
          '</div>';
        return;
      }
      if(!c2) return;
      try {
        _renderJadwalGrid_(obj, c2);
      } catch(renderErr) {
        console.error('[JADWAL] _renderJadwalGrid_ threw:', renderErr);
        c2.innerHTML =
          '<div style="text-align:center;padding:16px">' +
            '<p style="color:#ef4444;font-size:13px;margin:0 0 8px">⚠️ Gagal render jadwal: ' +
              (renderErr && renderErr.message ? renderErr.message : 'JS Error') + '</p>' +
            '<button onclick="loadJadwalDashboard_()" style="background:#6366f1;color:#fff;border:none;' +
              'border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer">🔄 Coba Lagi</button>' +
          '</div>';
      }
    })
    .withFailureHandler(function(err){
      clearTimeout(_jwTimer);
      stopTimer();
      console.error('[JADWAL] getDashboardJadwal failed:', err && err.message);
      var c2 = document.getElementById('jadwalGridContainer');
      if(c2) c2.innerHTML =
        '<div style="text-align:center;padding:16px">' +
          '<p style="color:#ef4444;font-size:13px;margin:0 0 8px">⚠️ ' +
            (err && err.message ? err.message : 'Gagal memuat jadwal') + '</p>' +
          '<button onclick="loadJadwalDashboard_()" style="background:#6366f1;color:#fff;border:none;' +
            'border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer">🔄 Coba Lagi</button>' +
        '</div>';
    })
    .getDashboardJadwal();
}

function saveJadwalUI(){
  try { _saveJadwalUIInner_(); }
  catch(fatalErr){
    if(typeof endProgress==='function') endProgress();
    _jadwalFeedback_('❌ Error tak terduga: '+(fatalErr&&fatalErr.message?fatalErr.message:fatalErr),'error');
  }
}

function _jadwalFeedback_(msg, type){
  var el = document.getElementById('jadwalSaveFeedback');
  if(!el) return;
  var palette = { info:'#dbeafe:#1e40af', success:'#dcfce7:#166534', error:'#fee2e2:#991b1b', warning:'#fef3c7:#92400e' };
  var c = (palette[type]||palette.info).split(':');
  el.innerHTML = '<div style="padding:10px 14px;border-radius:8px;margin:8px 0;background:'+c[0]+';color:'+c[1]+';font-size:13px;font-weight:600">'+msg+'</div>';
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function _saveJadwalUIInner_(){

  const btn = document.getElementById('btnSimpanJadwal');

  const elHari    = document.getElementById('jadwal_hari');
  const elKelas   = document.getElementById('jadwal_kelas');
  const elMapel   = document.getElementById('jadwal_mapel');
  const elMulai   = document.getElementById('jadwal_mulai');
  const elSelesai = document.getElementById('jadwal_selesai');

  if(!elHari || !elKelas || !elMapel || !elMulai || !elSelesai){
    alert('❌ Form jadwal tidak ditemukan. Coba refresh halaman.');
    return;
  }

  // tahun_pelajaran/semester TIDAK dibaca dari DOM — backend sudah punya
  // fallback chain via getActiveJadwalPeriod_ → getUserAcademicPeriod.
  const data = {
    hari: elHari.value,
    kelas: elKelas.value.trim(),
    mapel: elMapel.value.trim(),
    jam_mulai: elMulai.value,
    jam_selesai: elSelesai.value
  };

  if(!data.kelas){
    _jadwalFeedback_('⚠️ Kelas wajib diisi', 'warning');
    return;
  }
  if(!data.mapel){
    _jadwalFeedback_('⚠️ Pilih Mapel terlebih dahulu. Pastikan Mata Pelajaran sudah disimpan di Setting.', 'warning');
    return;
  }
  if(!data.jam_mulai || !data.jam_selesai){
    _jadwalFeedback_('⚠️ Jam Mulai dan Jam Selesai wajib diisi', 'warning');
    return;
  }

  if(btn){ btn.disabled = true; btn.innerText = '⏳ Menyimpan...'; }
  _jadwalFeedback_('⏳ Mengirim data ke spreadsheet...', 'info');
  startProgress();

  const _watchdog = setTimeout(function(){
    if(btn && btn.disabled){
      btn.disabled = false; btn.innerText = '💾 Simpan Jadwal';
      endProgress();
      _jadwalFeedback_('⏱️ Server tidak merespons (>40 detik). Cek daftar jadwal apakah sudah tersimpan.', 'warning');
    }
  }, 40000);

  google.script.run
    .withSuccessHandler(function(){
      clearTimeout(_watchdog);
      endProgress();
      if(btn){ btn.disabled = false; btn.innerText = '💾 Simpan Jadwal'; }
      _jadwalFeedback_('✅ Jadwal berhasil disimpan!', 'success');
      if(typeof showToast==='function') showToast('✅ Jadwal disimpan', 'success');
      elKelas.value = ''; elMulai.value = ''; elSelesai.value = '';
      if(typeof loadJadwalSetting==='function') loadJadwalSetting();
      if(typeof loadJadwalMengajar==='function') loadJadwalMengajar();
      if(typeof loadJadwalDashboard_==='function') loadJadwalDashboard_();
    })
    .withFailureHandler(function(err){
      clearTimeout(_watchdog);
      endProgress();
      if(btn){ btn.disabled = false; btn.innerText = '💾 Simpan Jadwal'; }
      var msg = (err && err.message) ? err.message : String(err);
      var feedType = msg.toLowerCase().includes('bentrok') ? 'warning' : 'error';
      var feedMsg  = feedType === 'warning'
        ? '⚠️ ' + msg
        : '❌ Gagal simpan jadwal: ' + msg;
      _jadwalFeedback_(feedMsg, feedType);
      // alert() sebagai fallback agar user pasti melihat error
      alert(msg);
    })
    .saveJadwalSemester(data);
}
function loadJadwalSetting(){
  return __loadJadwalSettingImpl();
}

window.loadJadwalSetting = loadJadwalSetting;
window.saveJadwalUI = saveJadwalUI;

function __loadJadwalSettingImpl(){
  var listEl = document.getElementById('jadwalList');
  if(listEl) listEl.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;padding:16px 0;color:#6b7280;font-size:13px">'+
    '<div style="width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0"></div>'+
    'Memuat jadwal...</div>';

  google.script.run
    .withSuccessHandler(function(data){
      if(!data || data.length === 0){
        listEl.innerHTML = '<p class="muted">📭 Belum ada jadwal.</p>';
        return;
      }

      var html =
        '<table class="jadwal-table" style="width:100%;border-collapse:collapse;margin-top:8px">'+
        '<thead><tr style="background:#f3f4f6">'+
        '<th style="padding:8px 10px;text-align:left">Hari</th>'+
        '<th style="padding:8px 10px;text-align:left">Kelas</th>'+
        '<th style="padding:8px 10px;text-align:left">Mapel</th>'+
        '<th style="padding:8px 10px;text-align:left">Jam</th>'+
        '<th style="padding:8px 10px;text-align:center">Aksi</th>'+
        '</tr></thead><tbody>';

      data.forEach(function(j){
        var esc = function(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
        html += '<tr id="row-'+j.row+'" style="border-bottom:1px solid #f3f4f6">'+
          '<td style="padding:7px 10px">'+esc(j.hari)+'</td>'+
          '<td style="padding:7px 10px">'+esc(j.kelas)+'</td>'+
          '<td style="padding:7px 10px">'+esc(j.mapel)+'</td>'+
          '<td style="padding:7px 10px;white-space:nowrap">'+esc(j.jam_mulai)+' – '+esc(j.jam_selesai)+'</td>'+
          '<td style="padding:4px 10px;text-align:center;white-space:nowrap">'+
            '<button onclick="editInline('+j.row+')" style="margin-right:4px">✏️</button>'+
            '<button onclick="deleteJadwalAdvanced('+j.row+')">🗑️</button>'+
          '</td>'+
          '</tr>';
      });

      html += '</tbody></table>';
      listEl.innerHTML = html;

    })
    .withFailureHandler(function(err){
      if(listEl) listEl.innerHTML = '<p style="color:#ef4444;font-size:13px">❌ Gagal memuat jadwal: '+(err&&err.message?err.message:err)+'</p>';
    })
    .getJadwalForSetting();
}

function editInline(row){

  const tr = document.getElementById("row-"+row);
  tr.classList.add("jadwal-editing");

  const hari  = tr.children[0].innerText;
  const kelas = tr.children[1].innerText;
  const mapel = tr.children[2].innerText;
  const jam   = tr.children[3].innerText.split(" - ");

  tr.innerHTML =
    '<td><select id="edit_hari_'+row+'">'+
    ['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'].map(function(h){ return '<option'+(h===hari?' selected':'')+'>'+h+'</option>'; }).join('')+
    '</select></td>'+
    '<td><input id="edit_kelas_'+row+'" value="'+kelas+'"></td>'+
    '<td><input id="edit_mapel_'+row+'" value="'+mapel+'"></td>'+
    '<td><input type="time" id="edit_mulai_'+row+'" value="'+jam[0]+'"> – <input type="time" id="edit_selesai_'+row+'" value="'+jam[1]+'"></td>'+
    '<td><button id="btnSave_'+row+'" onclick="saveInlineAdvanced('+row+')">✔️</button> <button onclick="loadJadwalSetting()">✖️</button></td>';
}

function saveInlineAdvanced(row){

  const tr = document.getElementById("row-"+row);
  const btn = document.getElementById("btnSave_"+row);

  btn.classList.add("btn-saving");
  if (typeof startProgress === 'function') startProgress();

  const data = {
    hari: document.getElementById("edit_hari_"+row).value,
    kelas: document.getElementById("edit_kelas_"+row).value,
    mapel: document.getElementById("edit_mapel_"+row).value,
    jam_mulai: document.getElementById("edit_mulai_"+row).value,
    jam_selesai: document.getElementById("edit_selesai_"+row).value
  };

  google.script.run
    .withSuccessHandler(()=>{
      if (typeof endProgress === 'function') endProgress();

      tr.classList.remove("jadwal-editing");
      tr.classList.add("save-success");

      setTimeout(()=>{
        loadJadwalSetting();
        loadJadwalMengajar();
      },400);

    })
    .withFailureHandler(err=>{
      if (typeof endProgress === 'function') endProgress();
      alert("⚠ " + err.message);
      btn.classList.remove("btn-saving");
    })
    .updateJadwalSemester(row,data);
}

function checkInlineConflict(row){

  const hari  = document.getElementById("edit_hari_"+row).value;
  const mulai = document.getElementById("edit_mulai_"+row).value;
  const selesai = document.getElementById("edit_selesai_"+row).value;

  if(!mulai || !selesai) return;

  const toMin = t=>{
    const [h,m] = t.split(':').map(Number);
    return h*60 + m;
  };

  const startNew = toMin(mulai);
  const endNew   = toMin(selesai);

  document.querySelectorAll("#jadwalList tr").forEach(tr=>{

    if(!tr.id || tr.id === "row-"+row) return;

    const cols = tr.children;
    if(!cols[0]) return;

    const hariOld = cols[0].innerText;
    if(hariOld !== hari) return;

    const jamText = cols[3]?.innerText;
    if(!jamText) return;

    const jamOld = jamText.split(" - ");
    const startOld = toMin(jamOld[0]);
    const endOld   = toMin(jamOld[1]);

    if(startNew < endOld && endNew > startOld){
      document.getElementById("row-"+row)
        .classList.add("jadwal-conflict");
    }
  });
}

function highlightToday(){

  const todayIndex = new Date().getDay();
  // 1=SENIN, 2=SELASA... (0=MINGGU)

  const mapHari = {
    1:'SENIN',
    2:'SELASA',
    3:'RABU',
    4:'KAMIS',
    5:'JUMAT',
    6:'SABTU'
  };

  const todayName = mapHari[todayIndex];
  if(!todayName) return;

  document.querySelectorAll(".jadwal-header")
    .forEach(th=>{
      if(th.innerText === todayName){
        th.classList.add("hari-today");
      }
    });
}

/* ================= TOOLTIP JADWAL ================= */

let tooltipBox = null;

document.addEventListener("mouseover", function(e){

  const item = e.target.closest(".jadwal-item");
  if(!item) return;

  if(!tooltipBox){
    tooltipBox = document.createElement("div");
    tooltipBox.className = "tooltip-box";
    document.body.appendChild(tooltipBox);
  }

  tooltipBox.innerHTML =
    '<strong>' + item.dataset.mapel + '</strong><br>' +
    'Kelas: ' + item.dataset.kelas + '<br>' +
    'Jam: ' + item.dataset.jam;

  tooltipBox.style.left = e.pageX + 12 + "px";
  tooltipBox.style.top  = e.pageY + 12 + "px";
  tooltipBox.style.opacity = 1;
});

document.addEventListener("mousemove", function(e){
  if(tooltipBox){
    tooltipBox.style.left = e.pageX + 12 + "px";
    tooltipBox.style.top  = e.pageY + 12 + "px";
  }
});

document.addEventListener("mouseout", function(e){
  if(e.target.closest(".jadwal-item") && tooltipBox){
    tooltipBox.style.opacity = 0;
  }
});

function deleteJadwalAdvanced(row){

  if(!confirm("Yakin hapus jadwal ini?")) return;

  const tr = document.getElementById("row-"+row);
  if(tr){
    tr.classList.add("row-deleting");
  }

  setTimeout(()=>{

    google.script.run
      .withSuccessHandler(()=>{
        loadJadwalSetting();
        loadJadwalMengajar();
      })
      .withFailureHandler(err=>{
        alert("❌ Gagal hapus jadwal:\n" + err.message);
        loadJadwalSetting();
      })
      .deleteJadwalSemester(row);

  },250);
}

function loadListJadwal(){

  google.script.run
    .withSuccessHandler(data=>{

      if(!data.length){
        document.getElementById('listJadwalSetting').innerHTML =
          '<p class="muted">Belum ada jadwal.</p>';
        return;
      }

      let html =
        '<table class="table-jadwal">' +
          '<tr>' +
            '<th>Hari</th>' +
            '<th>Kelas</th>' +
            '<th>Mapel</th>' +
            '<th>Jam</th>' +
            '<th>Aksi</th>' +
          '</tr>';

      data.forEach(d=>{
        html +=
          '<tr>' +
            '<td>' + d.hari + '</td>' +
            '<td>' + d.kelas + '</td>' +
            '<td>' + d.mapel + '</td>' +
            '<td>' + d.jam_mulai + ' - ' + d.jam_selesai + '</td>' +
            '<td>' +
              '<button onclick="hapusJadwal(' + d.rowIndex + ')">🗑</button>' +
            '</td>' +
          '</tr>';
      });

      html += '</table>';

      document.getElementById('listJadwalSetting').innerHTML = html;

    })
    .getJadwalForSetting();
}

function hapusJadwal(rowIndex){

  if(!confirm('Yakin ingin menghapus jadwal ini?')) return;

  if (typeof startProgress === 'function') startProgress();
  google.script.run
    .withSuccessHandler(()=>{
      if (typeof endProgress === 'function') endProgress();
      loadListJadwal();
      loadJadwalMengajar(); // refresh dashboard
    })
    .withFailureHandler(err=>{
      if (typeof endProgress === 'function') endProgress();
      if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal menghapus jadwal'), 'error');
      else alert('❌ Gagal menghapus jadwal: ' + err.message);
    })
    .deleteJadwalSemester(rowIndex);
}
</script>
