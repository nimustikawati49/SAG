<script>
/* =====================================================
   JURNAL GURU WALI – FRONTEND JS v1.0
   (loadJurnalGuruWali, loadInfoGuruWali, loadSiswaBinaan
    didefinisikan di scripts-dashboard.html agar always-available)
   ===================================================== */

/* ===================================================================
   SISWA BINAAN YANG DIDAMPINGI — digabung dari fitur Catatan Murid (tab
   terpisah yang sudah dihapus dari navigasi) supaya guru wali cuma
   punya 1 tempat mencatat pendampingan siswa binaan. Cukup 1 daftar
   centang selalu-terlihat (bukan toggle Individu/Kelompok + dropdown/
   checklist terpisah seperti versi sebelumnya) — jenisnya (individu vs
   kelompok) otomatis mengikuti jumlah yang dicentang saat Simpan.
   =================================================================== */
var _gwSiswaBinaanList_ = [];
console.log('[GuruWali] scripts-jadwal-wali-cetak.html dimuat pada ' + new Date().toLocaleTimeString());

function _gwEsc_(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Panggilan MANDIRI (tidak numpang ke fungsi lain) supaya mudah dilacak
// kalau gagal — hasilnya ditulis LANGSUNG ke daftar centang begitu
// selesai (sukses ATAU gagal), jadi tidak ada lagi kondisi "diam macet
// tanpa kabar" kalau ada masalah.
function _gwLoadSiswaBinaanPicker_(){
  console.log('[GuruWali] _gwLoadSiswaBinaanPicker_ dipanggil pada ' + new Date().toLocaleTimeString());
  var box = document.getElementById('gwSiswaBinaanCkList');
  var btn = document.getElementById('gwMuatUlangBtn');
  var btnOrigText = btn ? btn.textContent : null;
  // Tanda visual TEGAS bahwa klik ini benar-benar diterima (bukan cuma
  // teks "Memuat..." yang sama tampil lagi, yang bisa terlihat SEPERTI
  // tidak ada respons kalau kondisi sebelumnya juga sedang "Memuat...").
  if(btn){ btn.disabled = true; btn.textContent = '⏳ ...'; }
  if(box) box.innerHTML = '<p class="muted" style="margin:6px;font-size:12px">⏳ Memuat daftar siswa... (diminta ' + new Date().toLocaleTimeString() + ')</p>';

  google.script.run
    .withSuccessHandler(function(res){
      console.log('[GuruWali] _gwLoadSiswaBinaanPicker_ SUKSES pada ' + new Date().toLocaleTimeString(), res);
      if(btn){ btn.disabled = false; btn.textContent = btnOrigText; }
      var data = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);
      _gwSiswaBinaanList_ = data;
      _gwRenderSiswaBinaanCkList_();
    })
    .withFailureHandler(function(err){
      console.error('[GuruWali] _gwLoadSiswaBinaanPicker_ GAGAL pada ' + new Date().toLocaleTimeString() + ':', err && err.message);
      if(btn){ btn.disabled = false; btn.textContent = btnOrigText; }
      var msg = '❌ Gagal memuat: ' + (err && err.message ? err.message : 'tidak diketahui');
      if(box) box.innerHTML = '<p style="margin:6px;font-size:12px;color:#dc2626">' + msg +
        ' <button type="button" class="gw-retry-btn" style="font-size:11px;padding:2px 8px;margin-left:4px">coba lagi</button></p>';
    })
    .getSiswaBinaan(1, 20);
}

function _gwRenderSiswaBinaanCkList_(){
  var box = document.getElementById('gwSiswaBinaanCkList');
  if(!box) return;
  if(!_gwSiswaBinaanList_.length){
    box.innerHTML = '<p class="muted" style="margin:6px;font-size:12px">Belum ada siswa binaan — tambahkan dulu di kartu "Import Data Siswa Binaan" di atas.</p>';
    _gwUpdateSiswaCounter_();
    _gwSyncCentangSemua_();
    return;
  }
  box.innerHTML = '<table style="width:100%;border-collapse:collapse"><tbody>' +
    _gwSiswaBinaanList_.map(function(s){
      var namaAttr = _gwEsc_(s.nama_siswa || '');
      return '<tr>' +
        '<td style="width:32px;text-align:center;padding:5px 4px;border-bottom:1px solid #f1f2f6">' +
          '<input type="checkbox" class="gwSiswaCk" value="' + _gwEsc_(s.nis) + '" data-nama="' + namaAttr + '">' +
        '</td>' +
        '<td style="text-align:left;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px">' + namaAttr + '</td>' +
        '<td style="width:80px;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px;color:#6b7280">' + _gwEsc_(s.nis) + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  _gwUpdateSiswaCounter_();
  _gwSyncCentangSemua_();
}

function _gwUpdateSiswaCounter_(){
  var checked = document.querySelectorAll('.gwSiswaCk:checked');
  var counter = document.getElementById('gwSiswaCounter');
  if(!counter) return;
  if(!checked.length){ counter.textContent = ''; return; }
  counter.textContent = checked.length === 1
    ? '(1 dipilih — individu)'
    : '(' + checked.length + ' dipilih — kelompok)';
}

// Pasang event listener lewat JS (addEventListener), BUKAN atribut
// onclick/onchange inline di HTML — supaya tidak bergantung sama sekali
// pada bagaimana inline event handler attribute diproses (klik tombol
// Muat Ulang & centang siswa sempat terlihat "tidak ada respons" tanpa
// penyebab yang bisa dipastikan lewat atribut inline).
function _gwSyncCentangSemua_(){
  var all = document.querySelectorAll('.gwSiswaCk');
  var checked = document.querySelectorAll('.gwSiswaCk:checked');
  var master = document.getElementById('gwCentangSemuaCk');
  if (master) master.checked = all.length > 0 && checked.length === all.length;
}

(function() {
  function _gwAttachListeners() {
    var muatUlangBtn = document.getElementById('gwMuatUlangBtn');
    if (muatUlangBtn) {
      muatUlangBtn.addEventListener('click', function(){ _gwLoadSiswaBinaanPicker_(); });
    }
    var ckList = document.getElementById('gwSiswaBinaanCkList');
    if (ckList) {
      ckList.addEventListener('change', function(ev){
        if (ev.target && ev.target.classList.contains('gwSiswaCk')) {
          _gwUpdateSiswaCounter_();
          _gwSyncCentangSemua_();
        }
      });
      ckList.addEventListener('click', function(ev){
        if (ev.target && ev.target.classList.contains('gw-retry-btn')) _gwLoadSiswaBinaanPicker_();
      });
    }
    var centangSemua = document.getElementById('gwCentangSemuaCk');
    if (centangSemua) {
      centangSemua.addEventListener('change', function(){
        document.querySelectorAll('.gwSiswaCk').forEach(function(ck){ ck.checked = centangSemua.checked; });
        _gwUpdateSiswaCounter_();
      });
    }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(_gwAttachListeners, 500);
  } else {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(_gwAttachListeners, 500); });
  }
})();

function autoFillHariWali(dateStr){
  if(!dateStr) return;
  const hariMap = {
    0:'MINGGU', 1:'SENIN', 2:'SELASA', 3:'RABU',
    4:'KAMIS',  5:'JUMAT', 6:'SABTU'
  };
  const d = new Date(dateStr + 'T00:00:00');
  const el = document.getElementById('gwHari');
  if(el) el.value = hariMap[d.getDay()] || '';
}

function salinJurnalWaliTerakhir_(){
  google.script.run
    .withSuccessHandler(d=>{
      if(!d){
        if(typeof showToast === 'function') showToast('📭 Belum ada entri jurnal sebelumnya untuk disalin', 'info');
        else alert('Belum ada entri jurnal sebelumnya untuk disalin');
        return;
      }
      const fokus = document.getElementById('gwFokus');
      const topik = document.getElementById('gwTopik');
      const catatan = document.getElementById('gwCatatan');
      const tindak = document.getElementById('gwTindakLanjut');
      if(fokus) fokus.value = d.fokus_pendampingan || fokus.value;
      if(topik) topik.value = d.topik_pendampingan || '';
      if(catatan) catatan.value = d.catatan && d.catatan !== '-' ? d.catatan : '';
      if(tindak) tindak.value = d.tindak_lanjut && d.tindak_lanjut !== '-' ? d.tindak_lanjut : '';
      if(typeof showToast === 'function') showToast('📋 Disalin dari entri terakhir — boleh diedit sebelum simpan', 'success', 3000);
    })
    .withFailureHandler(err=>{
      if(typeof showToast === 'function') showToast('❌ Gagal ambil entri terakhir', 'error');
    })
    .getJurnalGuruWaliTerakhir();
}

let isSavingJurnalWali = false;

/* ── Photo pick + compress helpers ── */
var _gwFotos = { 1: null, 2: null }; // stored compressed data URLs

function gwPickFoto_(slot, input){
  const file = input.files[0];
  if(!file) return;
  _gwCompressFoto_(file, function(dataUrl){
    _gwFotos[slot] = { data: dataUrl, type: 'image/jpeg', name: file.name };
    const preview = document.getElementById('gwFotoPreview'+slot);
    const placeholder = document.getElementById('gwFotoPlaceholder'+slot);
    const removeBtn   = document.getElementById('gwFotoRemove'+slot);
    if(preview){ preview.src = dataUrl; preview.style.display = 'block'; }
    if(placeholder) placeholder.style.display = 'none';
    if(removeBtn) removeBtn.style.display = 'block';
  });
}

function gwRemoveFoto_(slot){
  _gwFotos[slot] = null;
  const input  = document.getElementById('gwFotoInput'+slot);
  const preview= document.getElementById('gwFotoPreview'+slot);
  const placeholder = document.getElementById('gwFotoPlaceholder'+slot);
  const removeBtn   = document.getElementById('gwFotoRemove'+slot);
  if(input)  { input.value = ''; }
  if(preview){ preview.src = ''; preview.style.display = 'none'; }
  if(placeholder) placeholder.style.display = 'block';
  if(removeBtn) removeBtn.style.display = 'none';
}

function gwOpenLightbox_(url){
  const lb  = document.getElementById('gwLightbox');
  const img = document.getElementById('gwLightboxImg');
  if(!lb || !img) return;
  // Use full-res Drive URL, not thumbnail
  const match = url.match(/[?&]id=([\/\w-]+)/);
  img.src = match ? 'https://drive.google.com/uc?export=view&id='+match[1] : url;
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function gwCloseLightbox_(){
  const lb = document.getElementById('gwLightbox');
  if(lb) lb.style.display = 'none';
  document.body.style.overflow = '';
}

function gwResetFilter_(){
  const b = document.getElementById('gwFilterBulan');
  const f = document.getElementById('gwFilterFokus');
  if(b) b.value = '';
  if(f) f.selectedIndex = 0;
  renderRiwayatGuruWali();
}

/**
 * Client-side image compression using Canvas.
 * Target: ≤500KB, max 1200px wide, JPEG quality 0.75
 */
function _gwCompressFoto_(file, callback){
  const MAX_W = 1200;
  const QUALITY = 0.75;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > MAX_W){ h = Math.round(h * MAX_W / w); w = MAX_W; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', QUALITY));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function simpanJurnalWali(){
  if(isSavingJurnalWali) return;

  const tgl    = document.getElementById('gwTanggal').value;
  const hari   = document.getElementById('gwHari').value.trim();
  const mulai  = document.getElementById('gwWaktuMulai').value;
  const selesai= document.getElementById('gwWaktuSelesai').value;
  const fokus  = document.getElementById('gwFokus').value;
  const topik  = document.getElementById('gwTopik').value.trim();
  const catatan= document.getElementById('gwCatatan').value.trim();
  const tindak = document.getElementById('gwTindakLanjut').value.trim();

  if(!tgl || !mulai || !selesai || !fokus || !topik){
    alert('⚠️ Lengkapi semua field yang bertanda *');
    return;
  }
  if(mulai >= selesai){
    alert('⚠️ Waktu selesai harus lebih besar dari waktu mulai');
    return;
  }

  // ===== Siswa binaan yang didampingi — jenisnya (individu/kelompok)
  // otomatis mengikuti jumlah yang dicentang, bukan toggle terpisah. =====
  const siswaTerpilih = Array.from(document.querySelectorAll('.gwSiswaCk:checked')).map(el => ({
    nis: el.value, nama: el.getAttribute('data-nama') || ''
  }));
  if(!siswaTerpilih.length){
    alert('⚠️ Pilih minimal satu siswa binaan yang didampingi');
    return;
  }
  const gwTipe = siswaTerpilih.length === 1 ? 'individu' : 'kelompok';

  isSavingJurnalWali = true;
  const btn = document.getElementById('btnSimpanJurnalWali');
  if(btn){ btn.disabled = true; btn.innerText = '⏳ Menyimpan...'; }
  startProgress();

  // Collect compressed photos
  const fotos = [_gwFotos[1], _gwFotos[2]].filter(Boolean);

  const payload = {
    tanggal           : tgl,
    hari              : hari.toUpperCase(),
    waktu_mulai       : mulai,
    waktu_selesai     : selesai,
    fokus_pendampingan: fokus,
    topik_pendampingan: topik,
    catatan           : catatan  || '-',
    tindak_lanjut     : tindak   || '-',
    fotos             : fotos,
    tipe              : gwTipe,
    siswa             : siswaTerpilih
  };

  google.script.run
    .withSuccessHandler(res=>{
      endProgress();
      isSavingJurnalWali = false;
      if(btn){ btn.disabled = false; btn.innerText = '💾 Simpan Jurnal'; }
      if(res && res.status){
        showToast('✅ Jurnal berhasil disimpan', 'success');
        gwClearDraft_();
        resetFormGuruWali();
        loadRiwayatGuruWali();
      }else{
        showToast('❌ Gagal menyimpan jurnal', 'error');
      }
    })
    .withFailureHandler(err=>{
      endProgress();
      isSavingJurnalWali = false;
      if(btn){ btn.disabled = false; btn.innerText = '💾 Simpan Jurnal'; }
      showToast('❌ ' + err.message, 'error');
    })
    .simpanJurnalGuruWali(payload);
}

function resetFormGuruWali(){
  ['gwWaktuMulai','gwWaktuSelesai','gwTopik',
   'gwCatatan','gwTindakLanjut']
    .forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
  const fokus = document.getElementById('gwFokus');
  if(fokus) fokus.selectedIndex = 0;
  // reset pilihan siswa binaan
  document.querySelectorAll('.gwSiswaCk:checked').forEach(el => { el.checked = false; });
  _gwUpdateSiswaCounter_();
  _gwSyncCentangSemua_();
  // reset ke hari ini
  const tglEl = document.getElementById('gwTanggal');
  if(tglEl){
    tglEl.value = new Date().toISOString().slice(0,10);
    autoFillHariWali(tglEl.value);
  }
  // reset photo slots
  gwRemoveFoto_(1);
  gwRemoveFoto_(2);
}

/* ===================================================================
   DRAFT AUTO-SAVE — form Jurnal Guru Wali, mirip pola di Jurnalku
   supaya ketikan tidak hilang kalau internet/laptop bermasalah
   sebelum sempat klik Simpan.
   ================================================================= */
function gwGetDraftKey_() {
  return 'jurnalWaliDraft_' + (window._currentUserEmail || 'anon');
}

function gwSaveDraft_() {
  try {
    const draft = {
      tanggal      : (document.getElementById('gwTanggal')      || {}).value || '',
      waktuMulai   : (document.getElementById('gwWaktuMulai')   || {}).value || '',
      waktuSelesai : (document.getElementById('gwWaktuSelesai') || {}).value || '',
      fokus        : (document.getElementById('gwFokus')        || {}).value || '',
      topik        : (document.getElementById('gwTopik')        || {}).value || '',
      catatan      : (document.getElementById('gwCatatan')      || {}).value || '',
      tindak       : (document.getElementById('gwTindakLanjut') || {}).value || '',
      savedAt      : new Date().toISOString()
    };
    localStorage.setItem(gwGetDraftKey_(), JSON.stringify(draft));
  } catch(e) {}
}

function gwRestoreDraft_() {
  try {
    const raw = localStorage.getItem(gwGetDraftKey_());
    if (!raw) return;
    const draft = JSON.parse(raw);
    const map = {
      gwTanggal: draft.tanggal, gwWaktuMulai: draft.waktuMulai, gwWaktuSelesai: draft.waktuSelesai,
      gwFokus: draft.fokus, gwTopik: draft.topik, gwCatatan: draft.catatan, gwTindakLanjut: draft.tindak
    };
    Object.keys(map).forEach(function(id) {
      const el = document.getElementById(id);
      if (el && map[id]) el.value = map[id];
    });
    if (draft.tanggal) autoFillHariWali(draft.tanggal);
    if (draft.topik && typeof showToast === 'function') showToast('💾 Draft jurnal wali dipulihkan', 'info', 2500);
  } catch(e) {}
}

function gwClearDraft_() {
  try { localStorage.removeItem(gwGetDraftKey_()); } catch(e) {}
}

(function() {
  const ids = ['gwTanggal','gwWaktuMulai','gwWaktuSelesai','gwFokus','gwTopik','gwCatatan','gwTindakLanjut'];
  function _attachGwDraftListeners() {
    ids.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', gwSaveDraft_);
      el.addEventListener('change', gwSaveDraft_);
    });
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(_attachGwDraftListeners, 500);
  } else {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(_attachGwDraftListeners, 500); });
  }
})();

let riwayatGuruWaliData = [];

function loadStatusArsipWali(){
  const el   = document.getElementById('statusArsipWali');
  const warn = document.getElementById('warningArsipWali');
  const btn  = document.getElementById('btnArsipWali');
  if(!el) return;

  // Pengecekan ini bisa butuh cari folder/file di Drive (lebih lambat dari
  // baca Sheets biasa) kalau belum ada di cache — tampilkan detik berjalan
  // supaya user tahu prosesnya masih jalan, bukan macet, dan tidak buru-buru
  // reload halaman.
  const stopTimer = startElapsedNotice_(el, '⏳ Mengecek status arsip...');

  google.script.run
    .withSuccessHandler(res => {
      stopTimer();
      if(!res.activeTahun){
        el.innerHTML = '❌ Tahun pelajaran belum diset di pengaturan.';
        return;
      }
      if(res.sudahArsip){
        el.innerHTML = `🔒 Jurnal guru wali tahun <b>${res.activeTahun}</b> sudah diarsipkan.`;
        if(btn) btn.disabled = true;
        return;
      }
      el.innerHTML = `📅 Data tersimpan: <b>${res.totalTahun}</b> tahun pelajaran. Tahun aktif: <b>${res.activeTahun}</b>`;
      if(warn && res.perluArsip) warn.style.display = 'block';
      if(btn) btn.disabled = false;
    })
    .withFailureHandler(err => {
      stopTimer();
      if(el) el.innerHTML = `<span class="muted">❌ ${err.message} — <a href="#" onclick="loadStatusArsipWali();return false;">Coba lagi</a></span>`;
    })
    .getStatusArsipJurnalWali();
}

function arsipJurnalWaliUI(){
  if(!confirm('Arsip jurnal guru wali tahun aktif?\nData akan DIHAPUS dari sheet dan disimpan ke Google Drive.\n\nLanjutkan?')) return;
  const btn = document.getElementById('btnArsipWali');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Mengarsipkan...'; }
  google.script.run
    .withSuccessHandler(res => {
      alert(`✅ ${res.jumlah} entri jurnal guru wali tahun ${res.tahun} berhasil diarsipkan ke Google Drive.`);
      if(btn){ btn.disabled = false; btn.textContent = '📦 Arsip Jurnal Guru Wali Tahun Ini'; }
      loadStatusArsipWali();
      loadRiwayatGuruWali();
    })
    .withFailureHandler(err => {
      alert('❌ Arsip gagal: ' + err.message);
      if(btn){ btn.disabled = false; btn.textContent = '📦 Arsip Jurnal Guru Wali Tahun Ini'; }
    })
    .arsipJurnalGuruWali();
}

function loadRiwayatGuruWali(){
  const tbody = document.getElementById('riwayatGuruWaliBody');
  if(!tbody) return;
  tbody.innerHTML = '<tr><td colspan="9" class="muted"></td></tr>';
  const stopTimer = startElapsedNotice_(tbody.querySelector('td'), '⏳ Memuat...');

  google.script.run
    .withSuccessHandler(data=>{
      stopTimer();
      riwayatGuruWaliData = data || [];
      renderRiwayatGuruWali();
    })
    .withFailureHandler(err=>{
      stopTimer();
      const tbody2 = document.getElementById('riwayatGuruWaliBody');
      if(tbody2)
        tbody2.innerHTML =
          `<tr><td colspan="9" class="muted">❌ ${err.message}</td></tr>`;
    })
    .getRiwayatJurnalGuruWali();
}

function renderRiwayatGuruWali(){
  const tbody = document.getElementById('riwayatGuruWaliBody');
  if(!tbody) return;

  // --- filter values ---
  const filterBulan = (document.getElementById('gwFilterBulan')  || {}).value || '';
  const filterFokus = (document.getElementById('gwFilterFokus')  || {}).value || '';

  // --- filter data ---
  let filtered = (riwayatGuruWaliData || []).filter(r => {
    if(filterBulan && !(r.iso_tanggal || '').startsWith(filterBulan)) return false;
    if(filterFokus && r.fokus_pendampingan !== filterFokus) return false;
    return true;
  });

  // --- update count badge ---
  const countEl = document.getElementById('gwFilterCount');
  if(countEl){
    if(filterBulan || filterFokus){
      countEl.textContent = filtered.length + ' entri';
      countEl.style.display = 'inline';
    } else {
      countEl.textContent = '';
      countEl.style.display = 'none';
    }
  }

  // --- cek bulan berjalan (pakai data asli, bukan filtered) ---
  const box = document.getElementById('gwPesanBulanIni');
  if(box){
    const nowYM = new Date().toISOString().slice(0,7);
    const adaBulanIni = riwayatGuruWaliData.some(
      r => r.iso_tanggal && r.iso_tanggal.slice(0,7) === nowYM
    );
    box.innerHTML = adaBulanIni ? '' : `
      <div class="card"
           style="background:#fff7ed;border-left:6px solid #f97316;
                  padding:14px;margin-bottom:14px">
        <b>⚠️ Belum ada kegiatan pendampingan bulan ini</b>
      </div>`;
  }

  if(!filtered || filtered.length === 0){
    tbody.innerHTML =
      '<tr><td colspan="9" class="muted">📭 ' +
      (filterBulan || filterFokus ? 'Tidak ada jurnal sesuai filter.' : 'Belum ada jurnal pendampingan.') +
      '</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((r, i)=>{
    // Build thumbnail HTML from comma-separated Drive URLs
    let dokHtml = '-';
    if(r.dokumentasi && r.dokumentasi !== '-'){
      const urls = r.dokumentasi.split(',').map(u=>u.trim()).filter(Boolean);
      if(urls.length > 0){
        dokHtml = urls.map(url=>{
          // Extract file ID for thumbnail URL
          const match = url.match(/[?&]id=([\w-]+)/);
          const thumbUrl = match
            ? 'https://drive.google.com/thumbnail?id='+match[1]+'&sz=w90'
            : url;
          return `<span onclick="gwOpenLightbox_('${url.replace(/'/g,"\\'")}')"
            title="Lihat foto" style="cursor:zoom-in;display:inline-block;">
            <img src="${thumbUrl}" alt="Foto" loading="lazy"
              style="width:44px;height:36px;object-fit:cover;border-radius:6px;border:2px solid #e5e7eb;transition:transform .15s"
              onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform=''"
              onerror="this.style.display='none'">
          </span>`;
        }).join('<span style="width:4px;display:inline-block"></span>');
      }
    }
    const siswaHtml = _gwFormatSiswa_(r);
    return `
      <tr>
        <td>${i + 1}</td>
        <td style="white-space:nowrap">${r.tanggal || '-'}</td>
        <td style="white-space:nowrap">${r.waktu || '-'}</td>
        <td class="left">${siswaHtml}</td>
        <td><span class="badge">${r.fokus_pendampingan || '-'}</span></td>
        <td class="left">${r.topik_pendampingan || '-'}</td>
        <td class="left">${r.catatan || '-'}</td>
        <td class="left">${r.tindak_lanjut || '-'}</td>
        <td style="white-space:nowrap">${dokHtml}</td>
      </tr>
    `;
  }).join('');
}

// Kolom Siswa di tabel Riwayat & laporan cetak — 👤 untuk individu (1
// nama langsung), 👥 + bullet list per nama untuk kelompok (>1 siswa)
// supaya rapi (pola sama seperti kolom Absensi di Riwayat Jurnal Mengajar
// & Rekap Absensi).
function _gwFormatSiswa_(r){
  const namaList = String(r.nama_siswa || '').split(',').map(s => s.trim()).filter(Boolean);
  if(!namaList.length) return '-';
  const label = r.tipe === 'kelompok' ? '👥 ' : '👤 ';
  if(namaList.length === 1) return label + namaList[0];
  return label + '(' + namaList.length + ' siswa):<ul style="margin:2px 0 0 14px;padding:0;font-size:11px">' +
    namaList.map(n => '<li>' + n + '</li>').join('') + '</ul>';
}

function cetakLaporanGuruWali(){
  if(!riwayatGuruWaliData || riwayatGuruWaliData.length === 0){
    alert('⚠️ Belum ada jurnal untuk dicetak');
    return;
  }

  // Apply current filter so print matches what user sees
  const filterBulan = (document.getElementById('gwFilterBulan') || {}).value || '';
  const filterFokus = (document.getElementById('gwFilterFokus') || {}).value || '';
  let dataCetak = riwayatGuruWaliData.filter(r => {
    if(filterBulan && !(r.iso_tanggal || '').startsWith(filterBulan)) return false;
    if(filterFokus && r.fokus_pendampingan !== filterFokus) return false;
    return true;
  });
  if(dataCetak.length === 0){ dataCetak = riwayatGuruWaliData; }

  const namaGuru = document.getElementById('gwNamaGuru').innerText || '-';
  const nip      = document.getElementById('gwNip').innerText      || '-';

  const baris = dataCetak.map((r, i)=>{
    // Build photo thumbnails for print
    let photoHtml = '-';
    if(r.dokumentasi && r.dokumentasi !== '-'){
      const imgs = r.dokumentasi.split(',').map(u => u.trim()).filter(Boolean).map(u => {
        const m = u.match(/[?&]id=([\w-]+)/);
        return m
          ? `<img src="https://drive.google.com/thumbnail?id=${m[1]}&sz=w120" style="max-width:110px;max-height:90px;border-radius:4px;margin:2px;object-fit:cover" crossorigin="anonymous">`
          : '';
      }).join('');
      if(imgs) photoHtml = `<div style="display:flex;flex-wrap:wrap;gap:4px">${imgs}</div>`;
    }
    return `
    <tr>
      <td style="text-align:center">${i + 1}</td>
      <td>${r.tanggal || '-'}</td>
      <td style="text-align:center;white-space:nowrap">${r.waktu || '-'}</td>
      <td>${_gwFormatSiswa_(r)}</td>
      <td style="text-align:center">${r.fokus_pendampingan || '-'}</td>
      <td>${r.topik_pendampingan || '-'}</td>
      <td>${r.catatan || '-'}</td>
      <td>${r.tindak_lanjut || '-'}</td>
      <td>${photoHtml}</td>
    </tr>
  `}).join('');

  const html = '<!DOCTYPE html><html><head>' +
    '<meta charset="UTF-8">' +
    '<title>Laporan Jurnal Guru Wali</title>' +
    '<style>' +
      '*{ box-sizing:border-box; }' +
      'body{ font-family:Arial,sans-serif; font-size:12px; margin:24px; color:#111; }' +
      'h2{ text-align:center; font-size:16px; margin-bottom:4px; }' +
      'p.sub{ text-align:center; font-size:12px; color:#555; margin:2px 0 16px; }' +
      'table{ width:100%; border-collapse:collapse; margin-top:8px; }' +
      'th,td{ border:1px solid #bbb; padding:7px 6px; vertical-align:top; font-size:11px; }' +
      'th{ background:#eef2ff; font-weight:700; text-align:center; }' +
      '.ttd-wrap{ margin-top:52px; display:flex; justify-content:flex-end; }' +
      '.ttd-box{ text-align:center; min-width:220px; }' +
      '.ttd-box p{ margin:2px 0; }' +
      '.garis-ttd{ margin-top:68px; border-top:1px solid #333; padding-top:4px; font-weight:700; }' +
      '.btn-cetak{ display:block; margin:20px auto 0; padding:10px 28px; background:#6C63FF; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }' +
      '@media print{ .btn-cetak{ display:none; } }' +
    '</style>' +
    '</head><body>' +
    '<h2>JURNAL PENDAMPINGAN GURU WALI</h2>' +
    '<p class="sub">' + namaGuru + ' &nbsp;&bull;&nbsp; NIP: ' + nip + '</p>' +
    '<table><thead><tr>' +
      '<th style="width:30px">No</th>' +
      '<th>Hari/Tanggal</th>' +
      '<th style="white-space:nowrap">Waktu</th>' +
      '<th>Siswa</th>' +
      '<th>Fokus Pendampingan</th>' +
      '<th>Topik Pendampingan</th>' +
      '<th>Catatan</th>' +
      '<th>Tindak Lanjut</th>' +
      '<th>Dokumentasi</th>' +
    '</tr></thead>' +
    '<tbody>' + baris + '</tbody></table>' +
    '<div class="ttd-wrap"><div class="ttd-box">' +
      '<p><b>Mengetahui</b></p>' +
      '<p>Guru Wali</p>' +
      '<div class="garis-ttd">' + namaGuru + '<br>' +
        '<span style="font-weight:normal">NIP. ' + nip + '</span>' +
      '</div>' +
    '</div></div>' +
    '<button class="btn-cetak" onclick="window.print()">🖨️ Cetak</button>' +
    '</body></html>';

  const win = window.open('', '_blank', 'width=960,height=720');
  if(!win){
    alert('Popup diblokir browser.\nAktifkan popup untuk halaman ini lalu coba lagi.');
    return;
  }
  win.document.write(html);
  win.document.close();
}

/* ===== JADWAL LIVE-REFRESH & BROWSER NOTIFICATIONS ===== */

/**
 * Request browser notification permission once when app loads.
 * Called from loadJurnalGuruWali().
 */
function _requestNotifPermission_(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

/**
 * Schedule browser notifications 15 minutes before each class today.
 * Re-scheduled every time jadwal is rendered (live-refresh).
 */
function _scheduleJadwalNotif_(jadwalObj){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  // Clear existing timers
  if(window._jadwalNotifTimers){
    window._jadwalNotifTimers.forEach(clearTimeout);
  }
  window._jadwalNotifTimers = [];
  if(!jadwalObj) return;

  var hariMap = {1:'SENIN',2:'SELASA',3:'RABU',4:'KAMIS',5:'JUMAT',6:'SABTU'};
  var hariIni = hariMap[new Date().getDay()];
  var items   = (jadwalObj && jadwalObj[hariIni]) || [];

  items.forEach(function(item){
    try{
      var sp = (item.jam_mulai || '').split(':');
      if(sp.length < 2) return;
      var classDate = new Date();
      classDate.setHours(Number(sp[0]), Number(sp[1]), 0, 0);
      var notifTime = classDate.getTime() - 15 * 60 * 1000; // 15 min before
      var delay     = notifTime - Date.now();
      if(delay > 0 && delay < 86400000){ // only schedule future events today
        var t = setTimeout(function(){
          try{
            new Notification('🔔 Kelas Segera Dimulai!', {
              body: (item.kelas || '') + ' — ' + (item.mapel || '') +
                    '\n15 menit lagi pukul ' + item.jam_mulai,
              icon: 'https://fonts.gstatic.com/s/e/notoemoji/latest/1f514/emoji.svg'
            });
          }catch(e){}
        }, delay);
        window._jadwalNotifTimers.push(t);
      }
    }catch(e){}
  });
}

/**
 * Live-refresh jadwal grid every 60 seconds so "SEKARANG" highlight stays current.
 */
if(!window._jadwalLiveRefreshStarted){
  window._jadwalLiveRefreshStarted = true;
  setInterval(function(){
    var container = document.getElementById('jadwalGridContainer');
    if(!container || !window._lastJadwalData) return;
    _renderJadwalGrid_(window._lastJadwalData, container);
  }, 60000);
}

/* ===== END LIVE-REFRESH & NOTIFICATIONS ===== */
