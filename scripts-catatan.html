<script>
/* ============================================================
   scripts-catatan.html — Catatan Khusus Siswa
   Guru dapat menambah/edit/hapus catatan per siswa.
   ============================================================ */

var _catatanKelasAktif = '';
var _catatanSiswaList  = [];
var _catatanMode       = 'individu'; // 'individu' | 'grup'
var _catatanDraftKey   = '';

/* ---- Draft auto-save untuk textarea catatan, supaya ketikan tidak
   hilang kalau modal tertutup tidak sengaja / internet-laptop bermasalah
   sebelum sempat klik Simpan. ---- */
function _catatanBuildDraftKey_(nis) {
  var email = window._currentUserEmail || 'anon';
  return 'catatanDraft_' + email + '_' + (nis || (_catatanKelasAktif || 'new'));
}

function _catatanSaveDraft_() {
  try {
    if (!_catatanDraftKey) return;
    var teksEl = document.getElementById('catatanTeks');
    var teks = teksEl ? teksEl.value : '';
    if (!teks) { localStorage.removeItem(_catatanDraftKey); return; }
    localStorage.setItem(_catatanDraftKey, JSON.stringify({ catatan: teks, savedAt: new Date().toISOString() }));
  } catch(e) {}
}

function _catatanReadDraft_() {
  try {
    if (!_catatanDraftKey) return null;
    var raw = localStorage.getItem(_catatanDraftKey);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function _catatanClearDraft_() {
  try { if (_catatanDraftKey) localStorage.removeItem(_catatanDraftKey); } catch(e) {}
}

(function() {
  function _attachCatatanDraftListener() {
    var el = document.getElementById('catatanTeks');
    if (el) { el.addEventListener('input', _catatanSaveDraft_); }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(_attachCatatanDraftListener, 500);
  } else {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(_attachCatatanDraftListener, 500); });
  }
})();

/** Panggil saat tab catatan dibuka */
function initCatatanSiswa() {
  loadKelasForCatatan();
}

function loadKelasForCatatan() {
  google.script.run
    .withSuccessHandler(function(kelasList) {
      var sel = document.getElementById('catatanKelasSelect');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      (kelasList || []).forEach(function(k) {
        var opt = document.createElement('option');
        opt.value = k; opt.textContent = k;
        sel.appendChild(opt);
      });
      // Jika hanya 1 kelas, langsung tampilkan catatannya
      if(kelasList && kelasList.length === 1){ sel.value = kelasList[0]; loadCatatanByKelas(); }
    })
    .withFailureHandler(function() {})
    // Hanya ambil kelas dari siswa binaan guru ini
    .getKelasSiswaBinaan();
}

function loadCatatanByKelas() {
  var kelas = (document.getElementById('catatanKelasSelect') || {}).value || '';
  _catatanKelasAktif = kelas;

  var container = document.getElementById('catatanContainer');
  if (!container) return;
  if (!kelas) {
    container.innerHTML = '<div class="alert-banner info">Pilih kelas untuk melihat catatan siswa binaan Anda.</div>';
    return;
  }

  container.innerHTML = '<div class="skeleton" style="height:100px;border-radius:12px;margin-bottom:8px"></div>'.repeat(3);

  google.script.run
    .withSuccessHandler(function(items) {
      _catatanSiswaList = items || [];
      _renderCatatanList_(items, kelas);
    })
    .withFailureHandler(function(err) {
      container.innerHTML = '<div class="alert-banner error">❌ ' + (err.message || 'Gagal memuat catatan') + '</div>';
    })
    .getCatatanSiswa(kelas);
}

function _renderCatatanList_(items, kelas) {
  var container = document.getElementById('catatanContainer');
  if (!container) return;

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
    '<h3 style="margin:0;font-size:15px">📝 Catatan Siswa Binaan — Kelas ' + _escC(kelas) + '</h3>' +
    '<button onclick="openCatatanModal()" style="background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">+ Tambah Catatan</button>' +
    '</div>';

  // Load siswa kelas untuk form
  google.script.run
    .withSuccessHandler(function(siswaList) {
      _catatanSiswaList = siswaList || [];
      var siswaSel = document.getElementById('catatanNisSel');
      if (siswaSel) {
        siswaSel.innerHTML = '<option value="">-- Pilih Siswa --</option>';
        (siswaList || []).forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.nis;
          opt.setAttribute('data-nama', s.nama || '');
          opt.textContent = s.nama + ' (' + s.nis + ')';
          siswaSel.appendChild(opt);
        });
      }
    })
    .withFailureHandler(function() {})
    // Hanya tampilkan siswa binaan, bukan semua siswa kelas
    .getSiswaBinaanByKelas(kelas);

  if (!items || items.length === 0) {
    html += '<div class="alert-banner info">Belum ada catatan untuk siswa binaan kelas ini.</div>';
    container.innerHTML = html;
    return;
  }

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
  items.forEach(function(c) {
    var warna = '#fef9c3';
    var isGrup = String(c.tipe || '').toLowerCase() === 'kelompok';
    var badge = isGrup
      ? '<span style="background:#e0e7ff;color:#4338ca;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px">👥 Kelompok</span>'
      : '<span style="background:#fee2e2;color:#991b1b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px">👤 Individu</span>';
    html += '<div style="background:' + warna + ';border:1.5px solid #fde68a;border-radius:14px;padding:14px 16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px">' +
        '<div style="font-weight:700;font-size:14px">🎓 ' + _escC(c.nama) + '</div>' +
        badge +
      '</div>' +
      '<div style="font-size:12px;color:#6b7280;margin-bottom:8px">NIS: ' + _escC(c.nis) + '</div>' +
      '<div style="font-size:13px;white-space:pre-wrap;background:#fff;border-radius:8px;padding:8px 10px">' + _escC(c.catatan) + '</div>' +
      '<div style="font-size:11px;color:#9ca3af;margin-top:8px">📅 ' + _escC(c.tgl) + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' +
        '<button onclick="editCatatan(\'' + _escC(c.nis) + '\',\'' + _escC(c.nama) + '\',\'' + _escC(c.catatan).replace(/'/g,"&#39;").replace(/\n/g,' ') + '\')" style="flex:1;background:#dbeafe;color:#1e40af;border:none;border-radius:8px;padding:6px;font-size:12px;cursor:pointer">✏️ Edit</button>' +
        '<button onclick="deleteCatatan(\'' + _escC(c.nis) + '\')" style="flex:1;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;padding:6px;font-size:12px;cursor:pointer">🗑️ Hapus</button>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

/**
 * setCatatanMode_(mode)
 * 'individu' — satu catatan untuk satu siswa (kasus serius/khusus).
 * 'grup'     — satu catatan yang sama diterapkan ke beberapa siswa
 * binaan sekaligus (guru tidak wajib menulis ulang per siswa).
 */
function setCatatanMode_(mode) {
  _catatanMode = mode === 'grup' ? 'grup' : 'individu';

  var indBtn  = document.getElementById('catatanModeIndividuBtn');
  var grpBtn  = document.getElementById('catatanModeGrupBtn');
  var indBox  = document.getElementById('catatanIndividuBox');
  var grpBox  = document.getElementById('catatanGrupBox');
  var hint    = document.getElementById('catatanModeHint');

  var activeStyle   = 'flex:1;padding:7px 10px;border-radius:10px;border:1.5px solid #f59e0b;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700;cursor:pointer';
  var inactiveStyle = 'flex:1;padding:7px 10px;border-radius:10px;border:1.5px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-size:12px;font-weight:700;cursor:pointer';

  if (_catatanMode === 'grup') {
    if (indBtn) indBtn.style.cssText = inactiveStyle;
    if (grpBtn) grpBtn.style.cssText = activeStyle;
    if (indBox) indBox.style.display = 'none';
    if (grpBox) grpBox.style.display = 'block';
    if (hint) hint.textContent = 'Mode grup: satu catatan yang sama diterapkan ke semua siswa yang dicentang.';
    _renderCatatanGrupList_();
  } else {
    if (indBtn) indBtn.style.cssText = activeStyle;
    if (grpBtn) grpBtn.style.cssText = inactiveStyle;
    if (indBox) indBox.style.display = 'block';
    if (grpBox) grpBox.style.display = 'none';
    if (hint) hint.textContent = 'Mode individu: untuk siswa dengan masalah serius/khusus.';
  }
}

function _renderCatatanGrupList_() {
  var box = document.getElementById('catatanGrupList');
  if (!box) return;
  if (!_catatanSiswaList.length) {
    box.innerHTML = '<p class="muted" style="margin:6px;font-size:12px">Belum ada siswa binaan di kelas ini.</p>';
    return;
  }
  var rows = _catatanSiswaList.map(function(s) {
    var namaAttr = _escC(s.nama || '');
    return '<tr>' +
        '<td style="width:32px;text-align:center;padding:5px 4px;border-bottom:1px solid #f1f2f6">' +
          '<input type="checkbox" class="catatanGrupCk" value="' + _escC(s.nis) + '" data-nama="' + namaAttr + '"' +
            ' onchange="_updateCatatanGrupCounter_()">' +
        '</td>' +
        '<td style="text-align:left;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px">' + namaAttr + '</td>' +
        '<td style="width:80px;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px;color:#6b7280">' + _escC(s.nis) + '</td>' +
      '</tr>';
  }).join('');
  box.innerHTML = '<table style="width:100%;border-collapse:collapse">' +
    '<tbody>' + rows + '</tbody></table>';
  _updateCatatanGrupCounter_();
}

function _updateCatatanGrupCounter_() {
  var checked = document.querySelectorAll('.catatanGrupCk:checked');
  var counter = document.getElementById('catatanGrupCounter');
  if (counter) counter.textContent = checked.length ? '(' + checked.length + ' dipilih)' : '';
}

function openCatatanModal(nis, nama, catatanTeks) {
  var m = document.getElementById('catatanModal');
  if (!m) return;
  m.style.display = 'flex';

  var nisSel   = document.getElementById('catatanNisSel');
  var teksEl   = document.getElementById('catatanTeks');
  var modeRow  = document.getElementById('catatanModeRow');
  if (nis && nisSel) {
    for (var i = 0; i < nisSel.options.length; i++) {
      if (nisSel.options[i].value === nis) { nisSel.selectedIndex = i; break; }
    }
    nisSel.disabled = true;
    // Edit selalu untuk satu baris siswa tertentu — sembunyikan pilihan mode.
    if (modeRow) modeRow.style.display = 'none';
    setCatatanMode_('individu');
  } else if (nisSel) {
    nisSel.selectedIndex = 0;
    nisSel.disabled = false;
    if (modeRow) modeRow.style.display = 'flex';
    setCatatanMode_('individu');
  }
  _catatanDraftKey = _catatanBuildDraftKey_(nis);
  if (teksEl) {
    teksEl.value = catatanTeks || '';
    if (!catatanTeks) {
      var draft = _catatanReadDraft_();
      if (draft && draft.catatan && draft.catatan.trim()) {
        var stamp = draft.savedAt ? new Date(draft.savedAt).toLocaleString('id-ID') : '';
        if (confirm('Ditemukan draft catatan yang belum tersimpan' + (stamp ? ' (' + stamp + ')' : '') + '. Lanjutkan?')) {
          teksEl.value = draft.catatan;
        } else {
          _catatanClearDraft_();
        }
      }
    }
    teksEl.focus();
  }
  document.getElementById('catatanModalTitle').textContent = nis ? 'Edit Catatan Siswa' : 'Tambah Catatan Siswa';
}

function editCatatan(nis, nama, catatanTeks) {
  openCatatanModal(nis, nama, catatanTeks);
}

function closeCatatanModal() {
  var m = document.getElementById('catatanModal');
  if (m) m.style.display = 'none';
  var nisSel = document.getElementById('catatanNisSel');
  if (nisSel) nisSel.disabled = false;
}

function submitCatatan() {
  var kelas  = _catatanKelasAktif;
  var teksEl = document.getElementById('catatanTeks');
  var teks   = teksEl ? teksEl.value.trim() : '';

  if (!kelas) {
    if (typeof showToast === 'function') showToast('⚠️ Pilih kelas terlebih dahulu', 'warning');
    return;
  }
  if (!teks) {
    if (typeof showToast === 'function') showToast('⚠️ Catatan tidak boleh kosong', 'warning');
    return;
  }

  var btn = document.getElementById('catatanSubmitBtn');

  if (_catatanMode === 'grup') {
    var checked = Array.from(document.querySelectorAll('.catatanGrupCk:checked'));
    if (!checked.length) {
      if (typeof showToast === 'function') showToast('⚠️ Pilih minimal satu siswa', 'warning');
      return;
    }
    var siswa = checked.map(function(el) {
      return { nis: el.value, nama: el.getAttribute('data-nama') || '' };
    });

    if (btn) { btn.disabled = true; btn.textContent = '⏳ Menyimpan...'; }
    google.script.run
      .withSuccessHandler(function(res) {
        _catatanClearDraft_();
        closeCatatanModal();
        var msg = '✅ Catatan grup disimpan untuk ' + (res && res.total ? res.total : siswa.length) + ' siswa';
        if (typeof showToast === 'function') showToast(msg, 'success');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
        loadCatatanByKelas();
      })
      .withFailureHandler(function(err) {
        if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal'), 'error');
        if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
      })
      .saveCatatanSiswaGrup({ kelas: kelas, siswa: siswa, catatan: teks });
    return;
  }

  var nisSel = document.getElementById('catatanNisSel');
  var nis  = nisSel ? nisSel.value : '';
  var nama = nisSel && nisSel.selectedOptions[0] ? nisSel.selectedOptions[0].getAttribute('data-nama') || '' : '';

  if (!nis) {
    if (typeof showToast === 'function') showToast('⚠️ Pilih siswa', 'warning');
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Menyimpan...'; }

  google.script.run
    .withSuccessHandler(function() {
      _catatanClearDraft_();
      closeCatatanModal();
      if (typeof showToast === 'function') showToast('✅ Catatan disimpan', 'success');
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
      loadCatatanByKelas();
    })
    .withFailureHandler(function(err) {
      if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal'), 'error');
      if (btn) { btn.disabled = false; btn.textContent = '💾 Simpan'; }
    })
    .saveCatatanSiswa({ kelas: kelas, nis: nis, nama: nama, catatan: teks });
}

function deleteCatatan(nis) {
  if (!confirm('Hapus catatan untuk siswa ini?')) return;
  google.script.run
    .withSuccessHandler(function() {
      if (typeof showToast === 'function') showToast('✅ Catatan dihapus', 'success');
      loadCatatanByKelas();
    })
    .withFailureHandler(function(err) {
      if (typeof showToast === 'function') showToast('❌ ' + (err.message || 'Gagal'), 'error');
    })
    .deleteCatatanSiswa(_catatanKelasAktif, nis);
}

function _escC(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
