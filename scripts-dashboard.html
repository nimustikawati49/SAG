let _dashKpiStopElapsed_ = null;

  ['kpiJurnal','kpiKelas','kpiRata','kpiRisiko'].forEach(function(id){

/* ===== KPI KETUNTASAN KELAS (Predikat A-D) =====
   Total Nilai Murni (nilai_asli, sebelum Katrol) tiap siswa per
   kelas+mapel dikelompokkan ke rubrik predikat tetap (server:
   getKetuntasanPredikatKelas() di api_nilai.js) — terpisah dari status
   Tuntas/Belum Tuntas berbasis KKM yang sudah ada di fitur lain. ===== */
var _ketuntasanPredikatData = [];

function loadKetuntasanPredikatKelas(){
  var box = document.getElementById('ketuntasanPredikatBox');
  if(!box) return;
  box.innerHTML = '<p class="muted" id="ketuntasanPredikatLoadingText" style="font-size:12px"></p><div class="skeleton" style="height:60px;border-radius:10px"></div>';
  var stopTimer = startElapsedNotice_(document.getElementById('ketuntasanPredikatLoadingText'), '⏳ Memuat ketuntasan kelas...');

  google.script.run
    .withSuccessHandler(function(rows){
      stopTimer();
      _ketuntasanPredikatData = rows || [];
      _renderKetuntasanPredikatKelas_();
    })
    .withFailureHandler(function(err){
      stopTimer();
      box.innerHTML = '<div class="alert-banner error">❌ ' + (err && err.message ? err.message : 'Gagal memuat') + '</div>';
    })
    .getKetuntasanPredikatKelas();
}

function _escKPK_(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _renderKetuntasanPredikatKelas_(){
  var box = document.getElementById('ketuntasanPredikatBox');
  if(!box) return;
  var rows = _ketuntasanPredikatData || [];
  if(!rows.length){
    box.innerHTML = '<div class="alert-banner info">ℹ️ Belum ada nilai tersimpan untuk periode aktif — isi dulu di menu Input Nilai.</div>';
    return;
  }

  var badgeStyle = {
    A: 'background:#dcfce7;color:#166534',
    B: 'background:#e0f2fe;color:#0369a1',
    C: 'background:#fef9c3;color:#854d0e',
    D: 'background:#fee2e2;color:#991b1b'
  };

  var html = '<div class="table-wrap"><table><thead><tr>' +
    '<th style="text-align:left">Kelas</th><th style="text-align:left">Mapel</th><th>Siswa</th>' +
    '<th>A</th><th>B</th><th>C</th><th>D</th><th>% Tuntas</th><th>Aksi</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(g, i){
    var pctColor = g.persenTuntas >= 80 ? '#166534' : (g.persenTuntas >= 60 ? '#854d0e' : '#991b1b');
    var pctBg    = g.persenTuntas >= 80 ? '#dcfce7' : (g.persenTuntas >= 60 ? '#fef9c3' : '#fee2e2');
    var jumlahCD = (g.perluTindakLanjut || []).length;
    html += '<tr>' +
      '<td class="left"><b>' + _escKPK_(g.kelas) + '</b></td>' +
      '<td class="left">' + _escKPK_(g.mapel || '-') + '</td>' +
      '<td style="text-align:center">' + g.total + '</td>' +
      '<td style="text-align:center"><span style="' + badgeStyle.A + ';padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700">' + g.counts.A + '</span></td>' +
      '<td style="text-align:center"><span style="' + badgeStyle.B + ';padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700">' + g.counts.B + '</span></td>' +
      '<td style="text-align:center"><span style="' + badgeStyle.C + ';padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700">' + g.counts.C + '</span></td>' +
      '<td style="text-align:center"><span style="' + badgeStyle.D + ';padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700">' + g.counts.D + '</span></td>' +
      '<td style="text-align:center"><span style="background:' + pctBg + ';color:' + pctColor + ';padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700">' + g.persenTuntas + '%</span></td>' +
      '<td style="text-align:center">' +
        (jumlahCD
          ? '<button class="ghost" onclick="_toggleKetuntasanDetail_(' + i + ')" style="font-size:12px">👀 Lihat ' + jumlahCD + ' siswa</button>'
          : '<span class="muted" style="font-size:12px">✅ Semua tuntas</span>') +
      '</td>' +
      '</tr>';
    html += '<tr id="ketuntasanDetail_' + i + '" style="display:none"><td colspan="9" style="background:#f9fafb">' +
      _renderKetuntasanDetailList_(g.perluTindakLanjut || []) +
      '</td></tr>';
  });

  html += '</tbody></table></div>';
  box.innerHTML = html;
}

function _renderKetuntasanDetailList_(list){
  if(!list.length) return '';
  var html = '<div style="padding:8px 4px"><b style="font-size:12.5px">⚠️ Siswa perlu tindak lanjut (predikat C/D, urut dari nilai terendah):</b>' +
    '<ul style="margin:6px 0 0 18px;font-size:12.5px;line-height:1.8">';
  list.forEach(function(s){
    var color = s.predikat === 'D' ? '#991b1b' : '#854d0e';
    html += '<li>' + _escKPK_(s.nama) + ' — <b style="color:' + color + '">' + s.nilai + ' (' + s.predikat + ')</b></li>';
  });
  html += '</ul></div>';
  return html;
}

function _toggleKetuntasanDetail_(i){
  var row = document.getElementById('ketuntasanDetail_' + i);
  if(!row) return;
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

/* ===== KPI SISWA BERPOTENSI BELUM ADA NILAI =====
   Deteksi dini dari kelengkapan komponen nilai RELATIF terhadap teman
   sekelas (server: getSiswaPotensiBelumAdaNilai() di api_nilai.js) —
   sama semangatnya dengan tanda ⚠️ di Riwayat Nilai, tapi diagregasi jadi

  google.script.run
    .withSuccessHandler(function(rows){
      stopTimer();
      _siswaPotensiKosongData = rows || [];
      _renderSiswaPotensiBelumAdaNilai_();
    })
    .withFailureHandler(function(err){
      stopTimer();
      box.innerHTML = '<div class="alert-banner error">❌ ' + (err && err.message ? err.message : 'Gagal memuat') + '</div>';
    })
    .getSiswaPotensiBelumAdaNilai();
}

function _renderSiswaPotensiBelumAdaNilai_(){
  var box = document.getElementById('siswaPotensiKosongBox');
  if(!box) return;
  var rows = _siswaPotensiKosongData || [];
  if(!rows.length){
    box.innerHTML = '<div class="alert-banner success">✅ Tidak ada siswa yang tertandai — kelengkapan nilai semua kelas relatif merata.</div>';
    return;
  }

  var html = '<div class="table-wrap"><table><thead><tr>' +
    '<th style="text-align:left">Kelas</th><th style="text-align:left">Mapel</th><th>Total Siswa</th><th>Berpotensi</th><th>Aksi</th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(g, i){
    html += '<tr>' +
      '<td class="left"><b>' + _escKPK_(g.kelas) + '</b></td>' +
      '<td class="left">' + _escKPK_(g.mapel || '-') + '</td>' +
      '<td style="text-align:center">' + g.totalSiswa + '</td>' +
      '<td style="text-align:center"><span style="background:#fef9c3;color:#854d0e;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700">' + g.siswaBerpotensi.length + '</span></td>' +
      '<td style="text-align:center"><button class="ghost" onclick="_toggleSiswaKosongDetail_(' + i + ')" style="font-size:12px">👀 Lihat daftar</button></td>' +
      '</tr>';
    html += '<tr id="siswaKosongDetail_' + i + '" style="display:none"><td colspan="5" style="background:#f9fafb">' +
      _renderSiswaKosongDetailList_(g.siswaBerpotensi || []) +
      '</td></tr>';
  });

  html += '</tbody></table></div>';
  box.innerHTML = html;
}

function _renderSiswaKosongDetailList_(list){
  if(!list.length) return '';
  var html = '<div style="padding:8px 4px"><b style="font-size:12.5px">🔎 Siswa berpotensi belum ada nilai (urut dari yang paling banyak kosong):</b>' +
    '<ul style="margin:6px 0 0 18px;font-size:12.5px;line-height:1.8">';
  list.forEach(function(s){
    html += '<li>' + _escKPK_(s.nama) + ' <span class="muted">(NIS ' + _escKPK_(s.nis) + ')</span> — ' +
      '<b style="color:#854d0e">' + s.jumlahKosong + ' komponen kosong</b>: ' +
      '<span class="muted">' + s.komponenKosong.map(_escKPK_).join(', ') + '</span></li>';
  });
  html += '</ul></div>';
  return html;
}

function _toggleSiswaKosongDetail_(i){
  var row = document.getElementById('siswaKosongDetail_' + i);
  if(!row) return;
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

function loadDashboardV4(){

  const dari   = document.getElementById('dashDari') ? document.getElementById('dashDari').value : '';
  const sampai = document.getElementById('dashSampai') ? document.getElementById('dashSampai').value : '';

  showKpiSkeleton();
  document.getElementById('dashboard')
    .classList.add('dashboard-loading');

  // Animate progress bar
  _dashSetProgress(0);
  let _p = 0;
  const _pi = setInterval(function(){
    _p = Math.min(_p + 2, 75);
    _dashSetProgress(_p);
    if(_p >= 75) clearInterval(_pi);
  }, 120);

  google.script.run
    .withFailureHandler(err=>{
      _dashKpiStopSkeleton_();
      clearInterval(_pi);
      _dashSetProgress(0);
      document.getElementById('dashboard')
        .classList.remove('dashboard-loading');
      if(typeof showToast === 'function') showToast('❌ Gagal memuat dashboard: ' + err.message, 'error');
      else alert('Gagal memuat dashboard:\n' + err.message);
    })
    .withSuccessHandler(data=>{
      _dashKpiStopSkeleton_();
      clearInterval(_pi);
      _dashSetProgress(100);
      setTimeout(function(){ _dashSetProgress(0); }, 600);
      renderDashboardV4(data);
      document.getElementById('dashboard')
        .classList.remove('dashboard-loading');
    })
    .getDashboardV4Data(dari, sampai);
}

  /* ================= KPI FIX ABSOLUTE ================= */

/* ===== JADWAL RENDERER – defined here so it always loads with dashboard ===== */
/**
 * Render jadwal grid. Definisi TUNGGAL (kanonik) — dulu ada salinan kedua
 * yang hampir identik di scripts-jadwal-wali.html (last-loaded-wins jadi
 * salinan itu yang sebenarnya aktif, sementara salinan di sini jadi dead
 * code kecuali skenario gagal-muat — dua salinan itu sudah mulai berbeda
 * kecil seiring waktu, risiko perbaikan di satu sisi tidak ikut kepakai).
 * Sudah digabung jadi satu di sini: scripts-dashboard.html dimuat LEBIH
 * DULU dari scripts-jadwal-wali.html (lihat urutan include() di
 * index.html), jadi fungsi ini sudah tersedia secara global sebelum
 * scripts-jadwal-wali.html sempat memanggilnya — sekaligus tetap jadi
 * fail-safe kalau script block lain gagal parse.
 */
function _renderJadwalGrid_(obj, container){
  try { window._lastJadwalData = obj; } catch(e){}
  try { if(typeof _scheduleJadwalNotif_ === 'function') _scheduleJadwalNotif_(obj); } catch(e){}

  var semuaHari = ['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
  var hariAktif = semuaHari.filter(function(h){ return obj && obj[h] && obj[h].length > 0; });

  /* ── Empty state ─────────────────────────────────── */
  if(!hariAktif.length){
    container.innerHTML =
      '<div style="text-align:center;padding:32px 16px">' +
        '<div style="font-size:38px;margin-bottom:10px">\uD83D\uDCED</div>' +
        '<p style="color:#6b7280;font-size:13px;margin:0 0 16px">Belum ada jadwal untuk semester ini.</p>' +
        '<button onclick="showTab(\'setting\')" ' +
          'style="background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;' +
          'border-radius:10px;padding:10px 22px;font-size:13px;font-weight:600;cursor:pointer;">' +
          '\u2795 Tambah Jadwal</button>' +
      '</div>';
    return;
  }

  /* ── Inject CSS once ─────────────────────────────── */
  if(!document.getElementById('jwCss')){
    var _s = document.createElement('style');
    _s.id = 'jwCss';
    _s.textContent =
      '@keyframes jwPulse{0%,100%{box-shadow:0 4px 16px rgba(99,102,241,.35)}50%{box-shadow:0 8px 28px rgba(99,102,241,.55)}}' +
      '@keyframes jwDot{0%,100%{opacity:1}50%{opacity:.3}}' +
      '.jw-wrap{display:flex;gap:0;overflow-x:auto;overflow-y:visible;overscroll-behavior-x:contain;' +
        '-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;' +
        'border-radius:14px;border:1px solid #e5e7eb;background:#fff}' +
      '.jw-wrap::-webkit-scrollbar{height:3px}' +
      '.jw-wrap::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}' +
      '.jw-col{flex:0 0 148px;scroll-snap-align:start;display:flex;flex-direction:column;' +
        'border-right:1px solid #f0f0f0;min-width:0}' +
      '.jw-col:last-child{border-right:none}' +
      '.jw-col.jw-today{background:linear-gradient(180deg,#f5f3ff 0%,#fff 60%)}' +
      '.jw-head{padding:9px 8px;text-align:center;border-bottom:1px solid #f0f0f0}' +
      '.jw-col.jw-today .jw-head{background:linear-gradient(135deg,#6366f1,#818cf8);border-bottom:none}' +
      '.jw-head-day{font-size:12px;font-weight:800;letter-spacing:.5px;color:#6b7280}' +
      '.jw-col.jw-today .jw-head-day{color:#fff}' +
      '.jw-head-date{font-size:10px;color:rgba(255,255,255,.8);margin-top:2px}' +
      '.jw-slots{padding:8px 6px;display:flex;flex-direction:column;gap:6px;flex:1}' +
      '.jw-slot{border-radius:9px;padding:9px 9px;cursor:default;transition:transform .12s}' +
      '.jw-slot:active{transform:scale(.96)}' +
      '.jw-slot-kelas{font-weight:700;font-size:12px}' +
      '.jw-slot-mapel{font-size:11px;margin-top:2px}' +
      '.jw-slot-time{font-size:10px;margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}' +
      '.jw-now-badge{padding:1px 6px;border-radius:99px;font-size:9px;font-weight:800;' +
        'letter-spacing:.3px;background:rgba(255,255,255,.22)}' +
      '.jw-dot{display:inline-block;width:6px;height:6px;border-radius:50%;' +
        'background:#fff;animation:jwDot 1.2s infinite;flex-shrink:0}' +
      '.jw-libur-badge{margin:8px 6px;padding:10px 8px;text-align:center;border-radius:9px;' +
        'background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;line-height:1.5}' +
      'body.dark .jw-libur-badge{background:#422006;color:#fde68a}' +
      '@media(min-width:540px){.jw-col{flex:1}}' +
      'body.dark .jw-wrap{background:#1f2937;border-color:#374151}' +
      'body.dark .jw-col{border-color:#374151}' +
      'body.dark .jw-col.jw-today{background:linear-gradient(180deg,#312e81 0%,#1f2937 60%)}' +
      'body.dark .jw-head{border-color:#374151}' +
      'body.dark .jw-head-day{color:#9ca3af}' +
      'body.dark .jw-slot-mapel{color:#9ca3af!important}' +
      'body.dark .jw-slot-time{color:#6b7280!important}';
    document.head.appendChild(_s);
  }

  function _esc_(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function _pad_(n){ return n<10?'0'+n:''+n; }

  var now       = new Date();
  var _hMap     = {1:'SENIN',2:'SELASA',3:'RABU',4:'KAMIS',5:'JUMAT',6:'SABTU'};
  var hariIni   = _hMap[now.getDay()] || null;
  var curMin    = now.getHours()*60 + now.getMinutes();
  var todayDate = _pad_(now.getDate())+'/'+_pad_(now.getMonth()+1);
  var _abbr     = {SENIN:'Senin',SELASA:'Selasa',RABU:'Rabu',KAMIS:'Kamis',JUMAT:'Jumat',SABTU:'Sabtu'};

  var palette = [
    {bg:'#6366f1',light:'#ede9fe',text:'#4338ca'},
    {bg:'#0ea5e9',light:'#e0f2fe',text:'#0369a1'},
    {bg:'#10b981',light:'#d1fae5',text:'#065f46'},
    {bg:'#f59e0b',light:'#fef3c7',text:'#92400e'},
    {bg:'#ef4444',light:'#fee2e2',text:'#991b1b'},
    {bg:'#a855f7',light:'#f3e8ff',text:'#6b21a8'},
    {bg:'#ec4899',light:'#fce7f3',text:'#9d174d'},
    {bg:'#14b8a6',light:'#ccfbf1',text:'#134e4a'}
  ];
  var clrMap = {}, ci = 0;
  hariAktif.forEach(function(h){
    (obj[h]||[]).forEach(function(item){
      if(!clrMap[item.mapel]) clrMap[item.mapel] = palette[ci++ % palette.length];
    });
  });

  // Hari libur (nasional/sekolah) minggu berjalan \u2014 lihat Kalender.js,
  // dikirim server lewat key '_libur' di objek jadwal yang sama (bukan
  // request terpisah). Dipetakan ke tanggal ASLI minggu ini per nama hari
  // supaya kolom yang kebetulan bertepatan dengan tanggal libur bisa
  // ditandai, walau jadwalnya sendiri recurring mingguan (tidak per
  // tanggal spesifik).
  var liburMap = (obj && obj._libur) || {};
  var hariDateMap = {};
  try {
    var _dayIdx = now.getDay(); // 0=Minggu
    var _mondayOffset = _dayIdx === 0 ? -6 : 1 - _dayIdx;
    var _monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + _mondayOffset);
    semuaHari.forEach(function(h, i){
      var d = new Date(_monday.getTime() + i*24*60*60*1000);
      hariDateMap[h] = d.getFullYear()+'-'+_pad_(d.getMonth()+1)+'-'+_pad_(d.getDate());
    });
  } catch(e){}

  var html = '<div class="jw-wrap" id="jwWrap">';

  hariAktif.forEach(function(h){
    var isToday = (h === hariIni);
    var liburKet = liburMap[hariDateMap[h]] || '';
    html += '<div class="jw-col'+(isToday?' jw-today':'')+'" data-hari="'+h+'">';

      '<div class="jw-head-day">'+(_abbr[h]||h)+'</div>' +

    if(liburKet){
      html += '<div class="jw-libur-badge">\ud83c\udf89 Tidak Efektif Belajar<br>'+_esc_(liburKet)+'</div>';
    } else {
      (obj[h]||[]).forEach(function(item){
        var sMin=0, eMin=1440;
        try{ var sp=item.jam_mulai.split(':'); sMin=+sp[0]*60+ +sp[1]; }catch(e){}
        try{ var ep=item.jam_selesai.split(':'); eMin=+ep[0]*60+ +ep[1]; }catch(e){}
        var isNow = isToday && curMin>=sMin && curMin<=eMin;
        var clr   = clrMap[item.mapel] || palette[0];
        var slotBg = isNow
          ? 'background:'+clr.bg+';animation:jwPulse 2s ease-in-out infinite;'
          : 'background:'+clr.light+';border-left:3px solid '+clr.bg+';';
        var kelasClr = isNow ? 'color:#fff;' : 'color:'+clr.text+';';
        var mapelClr = isNow ? 'color:rgba(255,255,255,.85);' : 'color:#6b7280;';
        var timeClr  = isNow ? 'color:rgba(255,255,255,.7);' : 'color:#9ca3af;';
        html +=
          '<div class="jw-slot" style="'+slotBg+'">' +
            '<div class="jw-slot-kelas" style="'+kelasClr+'">'+_esc_(item.kelas)+'</div>' +
            '<div class="jw-slot-mapel" style="'+mapelClr+'">'+_esc_(item.mapel)+'</div>' +
            '<div class="jw-slot-time" style="'+timeClr+'">' +
              (isNow
                ? '<span class="jw-dot"></span>'+_esc_(item.jam_mulai)+'\u2013'+_esc_(item.jam_selesai)+
                  ' <span class="jw-now-badge">SEKARANG</span>'
                : _esc_(item.jam_mulai)+'\u2013'+_esc_(item.jam_selesai)
              ) +
            '</div>' +
          '</div>';
      });
    }
    html += '</div></div>';
  });

  html += '</div>';
  container.innerHTML = html;

  setTimeout(function(){
    var wrap    = document.getElementById('jwWrap');
    var todayEl = wrap && wrap.querySelector('.jw-col.jw-today');
    if(todayEl && wrap) todayEl.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});

function _renderAllDashboard(allData){

  if(elKelas) elKelas.textContent = allData.kelasDiampu ?? allData.totalKelas ?? 0;

  );
  if(hasSetting && typeof _applySettingToHeader_ === 'function'){
    _applySettingToHeader_(allData.setting);

  // Render jadwal dari bundled getDashboardAllData() — hanya jika ada data
  var jContainer = document.getElementById('jadwalGridContainer');
  if(jContainer && typeof _renderJadwalGrid_ === 'function'){

function initDashboardMeta(){
  // Prevent simultaneous double calls (e.g. from showTab + direct call)
  if(_metaCallInProgress) return;
  _metaCallInProgress = true;

  // 1. Set date filter defaults IMMEDIATELY — no waiting for server
  const elDari   = document.getElementById('dashDari');
  const elSampai = document.getElementById('dashSampai');
  if(elDari   && !elDari.value)   elDari.value   = _dashDefaultDari();
  if(elSampai && !elSampai.value) elSampai.value = _dashDefaultSampai();

  // 2. Jadwal dimuat via getDashboardAllData() — tidak perlu call terpisah

  // 3. Show stale cache instantly (stale-while-revalidate)
  const cacheKey = 'dashCache_' + (window._currentUserEmail || 'anon');
  let hasCache = false;
  try {
    const raw = sessionStorage.getItem(cacheKey);
    if(raw){
      const {ts, data} = JSON.parse(raw);
      if(Date.now() - ts < 5 * 60 * 1000){ // 5-minute TTL
        _renderAllDashboard(data);
        hasCache = true;
        // Update date inputs from cache
        if(data.firstDate && elDari)   elDari.value   = data.firstDate;
        if(data.lastDate  && elSampai) elSampai.value = data.lastDate;
        // NOTE: jadwal is loaded separately above via loadJadwalMengajar()
      }
    }
  } catch(e){ /* ignore */ }

  // 4. Skeleton only if no cache
  if(!hasCache) showKpiSkeleton();
  document.getElementById('dashboard').classList.add('dashboard-loading');

  // Jadwal dimuat terpisah via loadJadwalMengajar() di atas

  // 5. Animate progress bar 0 → 78% while waiting for GAS
  _dashSetProgress(0);
  let _prog = 0;
  const _progInterval = setInterval(function(){
    _prog = Math.min(_prog + 1.5, 78);
    _dashSetProgress(_prog);
    if(_prog >= 78) clearInterval(_progInterval);
  }, 150);

  // 6. Peringatan lembut kalau masih lama (BUKAN batal — request GAS di
  //    balik layar TIDAK BISA dibatalkan dari client, jadi kalau ini
  //    terpicu, data asli tetap akan muncul begitu selesai lewat
  //    withSuccessHandler di bawah; ini cuma kasih tahu user supaya tidak
  //    kira aplikasi macet. Tidak lagi menghapus/menandai KPI dengan "—"
  //    supaya begitu data asli datang, tidak ada kedipan status error.
  const _slowWarnTimeout = setTimeout(function(){
    if (typeof showToast === 'function') {
      showToast('⏳ Sedang menyiapkan data akun Anda, mohon tunggu sebentar...', 'info', 8000);
    }
  }, 20000);

  // 7. Safety timeout lebih panjang — kalau BENAR-BENAR macet (bukan cuma
  //    lambat), baru tampilkan status gagal supaya user bisa coba lagi.
  const _skeletonTimeout = setTimeout(function(){
    _dashKpiStopSkeleton_();
    clearInterval(_progInterval);
    _dashSetProgress(0);
    _metaCallInProgress = false;
    document.getElementById('dashboard').classList.remove('dashboard-loading');
    if(!hasCache){
      const dash = document.getElementById('dashboard');
      if (dash && typeof showToast === 'function') {
        showToast('⚠️ Dashboard masih memuat data. Coba lagi sebentar.', 'warning', 7000);
      }
    }
  }, 90000);

  // 7. Single GAS call — getDashboardAllData() combines meta + V4
  google.script.run
    .withFailureHandler(function(err){
      _dashKpiStopSkeleton_();
      clearTimeout(_slowWarnTimeout);
      clearTimeout(_skeletonTimeout);
      clearInterval(_progInterval);
      _dashSetProgress(0);
      _metaCallInProgress = false;
      document.getElementById('dashboard').classList.remove('dashboard-loading');
      if(typeof showToast === 'function')
        showToast('❌ Gagal memuat dashboard: ' + (err.message || 'Coba refresh'), 'error', 6000);
    })
    .withSuccessHandler(function(allData){
      _dashKpiStopSkeleton_();
      clearTimeout(_slowWarnTimeout);
      clearTimeout(_skeletonTimeout);
      clearInterval(_progInterval);
      _metaCallInProgress = false;

      // Complete progress bar then hide
      _dashSetProgress(100);
      setTimeout(function(){ _dashSetProgress(0); }, 600);

      document.getElementById('dashboard').classList.remove('dashboard-loading');
      if(!allData) return;

      // Update date filter from actual journal date range
      if(allData.firstDate && elDari)   elDari.value   = allData.firstDate;
      if(allData.lastDate  && elSampai) elSampai.value = allData.lastDate;

      // Render profile + KPI + chart + ranking + insight
      _renderAllDashboard(allData);

      // Update "last synced" timestamp
      const syncEl = document.getElementById('dashSyncTime');
      if(syncEl){
        const now = new Date();
        syncEl.textContent = 'Diperbarui ' + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
      }

      // Persist to sessionStorage for instant display next visit
      try {
        sessionStorage.setItem(cacheKey, JSON.stringify({ts: Date.now(), data: allData}));
      } catch(e){ /* quota exceeded — ignore */ }

      // Track last refresh timestamp
      window._dashLastRefresh = Date.now();

      // Auto-refresh: only when tab + page are both visible
      if(window.dashboardInterval) clearInterval(window.dashboardInterval);
      window.dashboardInterval = setInterval(function(){
        if(document.visibilityState !== 'visible') return;
        if(typeof _currentTab !== 'undefined' && _currentTab !== 'dashboard') return;
        loadDashboardV4();
      }, 60000);
    })
    .getDashboardAllData();
}

// Refetch dashboard when user returns to tab after being away >= 2 min

});

    loadDashboardV4();
  }, 60000);
}

/* ── Foto Jurnal Guru Wali: pick + compress ──
   Dipindah dari scripts-jadwal-wali-cetak.html ke sini — file itu pernah
   terbukti tidak reliable untuk JS interaktif baru terkait Guru Wali
   (lihat riwayat "Centang Semua"), jadi logika foto ditaruh di file yang
   sudah terbukti stabil (loadSiswaBinaan() di bawah ini sudah lama jalan
   normal). _gwFotos tetap variabel global — dibaca simpanJurnalWali() di
   scripts-jadwal-wali-cetak.html seperti biasa. */
var _gwFotos = { 1: null, 2: null }; // stored compressed data URLs

function gwPickFoto_(slot, input){
  const file = input.files[0];
  if(!file) return;
  _gwCompressFoto_(file, function(dataUrl){
    _gwFotos[slot] = { data: dataUrl, type: 'image/jpeg', name: file.name };
    const preview = document.getElementById('gwFotoPreview'+slot);
    const placeholder = document.getElementById('gwFotoPlaceholder'+slot);
    const removeBtn   = document.getElementById('gwFotoRemove'+slot);
    if(preview){ preview.src = dataUrl; preview.style.display = 'block'; }
    if(placeholder) placeholder.style.display = 'none';
    if(removeBtn) removeBtn.style.display = 'block';
  });
  input.value = ''; // biar bisa pilih file yang sama lagi dari sumber lain (kamera/galeri) tanpa perlu ganti nama
}

function gwRemoveFoto_(slot){
  _gwFotos[slot] = null;
  const input   = document.getElementById('gwFotoInput'+slot);
  const inputCam= document.getElementById('gwFotoInput'+slot+'Camera');
  const preview = document.getElementById('gwFotoPreview'+slot);
  const placeholder = document.getElementById('gwFotoPlaceholder'+slot);
  const removeBtn    = document.getElementById('gwFotoRemove'+slot);
  if(input)   { input.value = ''; }
  if(inputCam){ inputCam.value = ''; }
  if(preview){ preview.src = ''; preview.style.display = 'none'; }
  if(placeholder) placeholder.style.display = 'block';
  if(removeBtn) removeBtn.style.display = 'none';
}

/**
 * Client-side image compression using Canvas.
 * Target: ≤500KB, max 1200px wide, JPEG quality 0.75
 */
function _gwCompressFoto_(file, callback){
  const MAX_W = 1200;
  const QUALITY = 0.75;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > MAX_W){ h = Math.round(h * MAX_W / w); w = MAX_W; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', QUALITY));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function simpanJurnalWali(){
  if(isSavingJurnalWali) return;

  const tgl    = document.getElementById('gwTanggal').value;
  const hari   = document.getElementById('gwHari').value.trim();
  const mulai  = document.getElementById('gwWaktuMulai').value;

  if(!tgl || !mulai || !selesai || !fokus || !topik){
    alert('⚠️ Lengkapi semua field yang bertanda *');
    return;
  }
  if(mulai >= selesai){
    alert('⚠️ Waktu selesai harus lebih besar dari waktu mulai');
    return;
  }

  // ===== Siswa binaan yang didampingi — jenisnya (individu/kelompok)

  const siswaTerpilih = Array.from(document.querySelectorAll('.gwSiswaCk:checked')).map(el => ({

  }));
  if(!siswaTerpilih.length){

    return;
  }
  const gwTipe = siswaTerpilih.length === 1 ? 'individu' : 'kelompok';

  isSavingJurnalWali = true;
  const btn = document.getElementById('btnSimpanJurnalWali');
  const isEdit = !!editingJurnalWaliId;
  if(btn){ btn.disabled = true; btn.innerText = isEdit ? '⏳ Memperbarui...' : '⏳ Menyimpan...'; }
  startProgress();

  // Collect photos — bisa campuran { data,type,name } (baru) dan
  // { existingUrl } (dipertahankan dari mode Edit)
  const fotos = [_gwFotos[1], _gwFotos[2]].filter(Boolean);

  const payload = {
    id                : editingJurnalWaliId || undefined,

    hari              : hari.toUpperCase(),
    waktu_mulai       : mulai,
    waktu_selesai     : selesai,

    tindak_lanjut     : tindak   || '-',
    fotos             : fotos,
    tipe              : gwTipe,
    siswa             : siswaTerpilih
  };

  const fn = isEdit ? 'updateJurnalGuruWali' : 'simpanJurnalGuruWali';

  google.script.run
    .withSuccessHandler(res=>{
      endProgress();
      isSavingJurnalWali = false;
      if(btn){ btn.disabled = false; btn.innerText = '💾 Simpan Jurnal'; }
      if(res && res.status){
        // Jurnal tetap tersimpan walau foto gagal upload (mis. Drive
        // diblokir kebijakan domain) — beri tahu jelas, bukan diam-diam
        // kehilangan foto. Sama seperti Jurnal Mengajar (res.fotoGagal).
        if(res.fotoGagal){
          showToast('✅ Jurnal tersimpan, tapi foto GAGAL diupload (masalah akses Drive) — coba simpan ulang tanpa foto dulu kalau perlu.', 'warning', 8000);
        } else {
          showToast(isEdit ? '✅ Jurnal berhasil diperbarui' : '✅ Jurnal berhasil disimpan', 'success');
        }
        gwClearDraft_();
        editingJurnalWaliId = null;
        resetFormGuruWali();
        _setModeEditJurnalWaliUI_(false);
        loadRiwayatGuruWali();
        _scrollKeRiwayatWali_();
      }else{
        showToast('❌ Gagal menyimpan jurnal', 'error');
      }
    })
    .withFailureHandler(err=>{
      endProgress();
      isSavingJurnalWali = false;
      if(btn){ btn.disabled = false; btn.innerText = isEdit ? '✏️ Update Jurnal' : '💾 Simpan Jurnal'; }
      showToast('❌ ' + err.message, 'error');
    })
    [fn](payload);
}

function resetFormGuruWali(){
  ['gwWaktuMulai','gwWaktuSelesai','gwTopik',
   'gwCatatan','gwTindakLanjut']
    .forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
  const fokus = document.getElementById('gwFokus');
  if(fokus) fokus.selectedIndex = 0;
  // reset pilihan siswa binaan
  document.querySelectorAll('.gwSiswaCk:checked').forEach(el => { el.checked = false; });
  if(typeof _gwUpdateSiswaCounter_ === 'function') _gwUpdateSiswaCounter_();
  // reset ke hari ini
  const tglEl = document.getElementById('gwTanggal');
  if(tglEl){
    tglEl.value = new Date().toISOString().slice(0,10);
    if(typeof autoFillHariWali === 'function') autoFillHariWali(tglEl.value);
  }
  // reset photo slots
  gwRemoveFoto_(1);
  gwRemoveFoto_(2);
  // batal mode edit kalau sedang aktif (mis. user klik Reset di tengah edit)
  if(editingJurnalWaliId){
    editingJurnalWaliId = null;
    _setModeEditJurnalWaliUI_(false);
  }
}

function _scrollKeRiwayatWali_(){
  const body = document.getElementById('riwayatGuruWaliBody');
  const card = body && body.closest ? body.closest('.card') : null;
  if(card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function _setModeEditJurnalWaliUI_(isEdit){
  const btn = document.getElementById('btnSimpanJurnalWali');
  if(btn) btn.innerText = isEdit ? '✏️ Update Jurnal' : '💾 Simpan Jurnal';
  let cancelBtn = document.getElementById('btnBatalEditJurnalWali');
  if(isEdit){
    if(!cancelBtn && btn && btn.parentNode){
      cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.id = 'btnBatalEditJurnalWali';
      cancelBtn.className = 'ghost';
      cancelBtn.textContent = '✕ Batal Edit';
      cancelBtn.onclick = function(){ resetFormGuruWali(); };
      btn.insertAdjacentElement('afterend', cancelBtn);
    }
  } else if(cancelBtn){
    cancelBtn.remove();
  }
}

function editJurnalWali_(id){
  const x = (riwayatGuruWaliData || []).find(r => String(r.id) === String(id));
  if(!x) return;

  editingJurnalWaliId = id;

  const tglEl = document.getElementById('gwTanggal');
  if(tglEl && x.iso_tanggal){
    tglEl.value = x.iso_tanggal;
    if(typeof autoFillHariWali === 'function') autoFillHariWali(x.iso_tanggal);
  }

  const waktuParts = String(x.waktu || '').split(' - ');
  const mulaiEl   = document.getElementById('gwWaktuMulai');
  const selesaiEl = document.getElementById('gwWaktuSelesai');
  if(mulaiEl)   mulaiEl.value   = (waktuParts[0] || '').trim().replace('.', ':');
  if(selesaiEl) selesaiEl.value = (waktuParts[1] || '').trim().replace('.', ':');

  const fokusEl = document.getElementById('gwFokus');
  if(fokusEl) fokusEl.value = x.fokus_pendampingan || '';
  const topikEl = document.getElementById('gwTopik');
  if(topikEl) topikEl.value = x.topik_pendampingan || '';
  const catatanEl = document.getElementById('gwCatatan');
  if(catatanEl) catatanEl.value = (x.catatan && x.catatan !== '-') ? x.catatan : '';
  const tindakEl = document.getElementById('gwTindakLanjut');
  if(tindakEl) tindakEl.value = (x.tindak_lanjut && x.tindak_lanjut !== '-') ? x.tindak_lanjut : '';

  // Pre-check siswa binaan yang didampingi di entri ini
  const nisSet = String(x.nis_siswa || '').split(',').map(s => s.trim()).filter(Boolean);
  document.querySelectorAll('.gwSiswaCk').forEach(function(el){
    el.checked = nisSet.indexOf(el.value) > -1;
  });
  if(typeof _gwUpdateSiswaCounter_ === 'function') _gwUpdateSiswaCounter_();

  // Muat foto lama ke slot 1/2 — bisa dihapus lewat tombol × yang sudah
  // ada, atau diganti dengan upload baru (galeri/kamera) di slot yang sama.
  gwRemoveFoto_(1);
  gwRemoveFoto_(2);
  const urls = (x.dokumentasi && x.dokumentasi !== '-')
    ? x.dokumentasi.split(',').map(u => u.trim()).filter(Boolean)
    : [];
  urls.slice(0, 2).forEach(function(url, i){
    const slot = i + 1;
    _gwFotos[slot] = { existingUrl: url };
    const preview     = document.getElementById('gwFotoPreview'+slot);
    const placeholder = document.getElementById('gwFotoPlaceholder'+slot);
    const removeBtn   = document.getElementById('gwFotoRemove'+slot);
    const m = url.match(/[-\w]{25,}/);
    const thumbUrl = m ? ('https://lh3.googleusercontent.com/d/' + m[0] + '=w300-h220') : url;
    if(preview){ preview.src = thumbUrl; preview.style.display = 'block'; }
    if(placeholder) placeholder.style.display = 'none';
    if(removeBtn) removeBtn.style.display = 'block';
  });

  _setModeEditJurnalWaliUI_(true);
  if(tglEl && tglEl.scrollIntoView) tglEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if(typeof showToast === 'function') showToast('✏️ Mode edit — ubah field yang perlu lalu klik Update Jurnal', 'info', 3500);
}

function duplikatJurnalWali_(id){
  const x = (riwayatGuruWaliData || []).find(r => String(r.id) === String(id));
  if(!x) return;

  // Beda dari Edit: TIDAK menunjuk id manapun, jadi Simpan berikutnya
  // membuat entri BARU (bukan menimpa entri asal).
  editingJurnalWaliId = null;

  const tglEl = document.getElementById('gwTanggal');
  if(tglEl){
    tglEl.value = new Date().toISOString().slice(0,10);
    if(typeof autoFillHariWali === 'function') autoFillHariWali(tglEl.value);
  }
  const fokusEl = document.getElementById('gwFokus');
  if(fokusEl) fokusEl.value = x.fokus_pendampingan || '';
  const topikEl = document.getElementById('gwTopik');
  if(topikEl) topikEl.value = x.topik_pendampingan || '';
  const catatanEl = document.getElementById('gwCatatan');
  if(catatanEl) catatanEl.value = (x.catatan && x.catatan !== '-') ? x.catatan : '';
  const tindakEl = document.getElementById('gwTindakLanjut');
  if(tindakEl) tindakEl.value = (x.tindak_lanjut && x.tindak_lanjut !== '-') ? x.tindak_lanjut : '';

  const nisSet = String(x.nis_siswa || '').split(',').map(s => s.trim()).filter(Boolean);
  document.querySelectorAll('.gwSiswaCk').forEach(function(el){
    el.checked = nisSet.indexOf(el.value) > -1;
  });
  if(typeof _gwUpdateSiswaCounter_ === 'function') _gwUpdateSiswaCounter_();

  // Foto TIDAK ikut diduplikat (sama seperti "Salin dari entri terakhir") —
  // upload foto baru dulu di form kalau perlu, biar tidak dikira foto yang sama dipakai 2 entri.
  gwRemoveFoto_(1);
  gwRemoveFoto_(2);

  _setModeEditJurnalWaliUI_(false);
  if(tglEl && tglEl.scrollIntoView) tglEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if(typeof showToast === 'function') showToast('📋 Disalin — cek Tanggal & Waktu, siswa binaan sudah tercentang, lalu Simpan', 'success', 3500);
}

function hapusJurnalWali_(id){
  if(!confirm('Hapus jurnal pendampingan ini?\nTindakan tidak bisa dibatalkan.')) return;
  if (typeof startProgress === 'function') startProgress();
  google.script.run
    .withSuccessHandler(function(){
      if (typeof endProgress === 'function') endProgress();
      riwayatGuruWaliData = (riwayatGuruWaliData || []).filter(r => String(r.id) !== String(id));
      renderRiwayatGuruWali();
      if(typeof showToast === 'function') showToast('🗑️ Jurnal dihapus', 'success');
      if(String(editingJurnalWaliId) === String(id)) resetFormGuruWali();
    })
    .withFailureHandler(function(err){
      if (typeof endProgress === 'function') endProgress();
      const msg = err && err.message ? err.message : 'tidak diketahui';
      if(typeof showToast === 'function') showToast('❌ Gagal menghapus: ' + msg, 'error');
      else alert('❌ Gagal menghapus jurnal: ' + msg);
    })
    .hapusJurnalGuruWali(id);
}

/* ── Menu aksi (⋮) Riwayat Jurnal Guru Wali — dipisah dari punya Jurnal
   Belajar (toggleAksiMenu_ di scripts-jurnal.html) karena sumber datanya
   beda (riwayatGuruWaliData) dan aksinya cuma Edit/Duplikat/Hapus (tanpa
   Detail — tabelnya sudah menampilkan semua kolom langsung), tapi tetap
   numpang div #aksiFloatingMenu & closeAksiMenu_() yang sama supaya cuma
   1 menu floating yang aktif di halaman. ── */
let _aksiMenuOpenIdWali_ = null;

function _closeAksiMenuWali_(){
  if(typeof closeAksiMenu_ === 'function') closeAksiMenu_();
  _aksiMenuOpenIdWali_ = null;
}

function toggleAksiMenuWali_(ev, id){
  ev.stopPropagation();
  const menu = document.getElementById('aksiFloatingMenu');
  if(!menu) return;
  if(_aksiMenuOpenIdWali_ === id && menu.style.display !== 'none'){
    _closeAksiMenuWali_();
    return;
  }
  const x = (riwayatGuruWaliData || []).find(r => String(r.id) === String(id));
  if(!x) return;

  menu.innerHTML =
    '<button onclick="_closeAksiMenuWali_();editJurnalWali_(\'' + id + '\')">✏️ Edit</button>' +
    '<button onclick="_closeAksiMenuWali_();duplikatJurnalWali_(\'' + id + '\')">📋 Duplikat</button>' +
    '<button class="danger" onclick="_closeAksiMenuWali_();hapusJurnalWali_(\'' + id + '\')">🗑️ Hapus</button>';
  menu.style.display = 'flex';

  const rect = ev.currentTarget.getBoundingClientRect();
  const menuWidth = 176, menuHeightEstimate = 140;
  let left = rect.right - menuWidth;
  if(left < 8) left = 8;
  if(left + menuWidth > window.innerWidth - 8) left = window.innerWidth - menuWidth - 8;
  let top = rect.bottom + 4;
  if(top + menuHeightEstimate > window.innerHeight) top = rect.top - menuHeightEstimate;
  if(top < 8) top = 8;
  menu.style.left = left + 'px';
  menu.style.top  = top + 'px';

  _aksiMenuOpenIdWali_ = id;
}

/* ── Cetak Jurnal Guru Wali (preview + A4/F4 landscape) — pola & helper
   (_UKURAN_KERTAS_MM_, _escAttr_, _isoKeDdMmYyyy_) dipakai ulang dari
   fitur Cetak Jurnal Mengajar yang sudah ada di scripts-jurnal.html,
   supaya pengaturannya persis sama seperti yang diminta. Ditaruh di sini
   (bukan scripts-jadwal-wali-cetak.html) karena melibatkan google.script.run
   yang dipicu tombol — kategori yang pernah bermasalah di file itu. ── */
function cetakJurnalWaliUI_(){
  if(!window._settingCache){
    google.script.run.withSuccessHandler(s=>{
      window._settingCache = s || {};
    }).getSetting();
  }
  // Default rentang tanggal: ikut filter Bulan Riwayat yang sedang aktif kalau ada
  const filterBulan = (document.getElementById('gwFilterBulan') || {}).value || '';
  const cDari   = document.getElementById('cetakJurnalWaliDari');
  const cSampai = document.getElementById('cetakJurnalWaliSampai');
  if(filterBulan){
    if(cDari)   cDari.value   = filterBulan + '-01';
    if(cSampai) cSampai.value = filterBulan + '-28';
  } else {
    if(cDari)   cDari.value   = '';
    if(cSampai) cSampai.value = '';
  }

  const modal = document.getElementById('cetakJurnalWaliModal');
  if(modal) modal.style.display = 'flex';
}

function tutupCetakJurnalWali_(){
  const modal = document.getElementById('cetakJurnalWaliModal');
  if(modal) modal.style.display = 'none';
}

function prosesCetakJurnalWali_(){
  const dari   = (document.getElementById('cetakJurnalWaliDari')   || {}).value || '';
  const sampai = (document.getElementById('cetakJurnalWaliSampai') || {}).value || '';
  const kertas = (document.getElementById('cetakJurnalWaliKertas') || {}).value || 'A4';

  if(!dari || !sampai){
    if(typeof showToast === 'function') showToast('⚠️ Isi Dari Tanggal dan Sampai Tanggal dulu', 'warning');
    else alert('Isi Dari Tanggal dan Sampai Tanggal dulu');
    return;
  }
  if(sampai < dari){
    if(typeof showToast === 'function') showToast('⚠️ Sampai Tanggal tidak boleh sebelum Dari Tanggal', 'warning');
    else alert('Sampai Tanggal tidak boleh sebelum Dari Tanggal');
    return;
  }

  const btn = event && event.currentTarget ? event.currentTarget : null;
  const btnOrigHtml = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ Menyiapkan...'; }
  if (typeof startProgress === 'function') startProgress();

  google.script.run
    .withSuccessHandler(rows=>{
      if (typeof endProgress === 'function') endProgress();
      if(btn){ btn.disabled = false; btn.innerHTML = btnOrigHtml; }
      if(!rows || rows.length === 0){
        if(typeof showToast === 'function') showToast('📭 Tidak ada jurnal pendampingan pada rentang ini', 'warning');
        else alert('Tidak ada jurnal pendampingan pada rentang tanggal ini');
        return;
      }
      _bukaJendelaCetakJurnalWali_(rows, dari, sampai, kertas);
      tutupCetakJurnalWali_();
    })
    .withFailureHandler(err=>{
      if (typeof endProgress === 'function') endProgress();
      if(btn){ btn.disabled = false; btn.innerHTML = btnOrigHtml; }
      if(typeof showToast === 'function') showToast('❌ Gagal menyiapkan laporan: ' + err.message, 'error');
      else alert('Gagal menyiapkan laporan: ' + err.message);
    })
    .getJurnalGuruWaliUntukCetak(dari, sampai);
}

                return '<tr>' +
                  '<td style="width:32px;text-align:center;padding:5px 4px;border-bottom:1px solid #f1f2f6">' +
                    '<input type="checkbox" class="gwSiswaCk" value="' + nisEsc + '" data-nama="' + namaEsc + '">' +
                  '</td>' +
                  '<td style="text-align:left;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px">' + namaEsc + '</td>' +
                  '<td style="width:80px;padding:5px 8px;border-bottom:1px solid #f1f2f6;font-size:12px;color:#6b7280">' + nisEsc + '</td>' +
                '</tr>';
              }).join('') + '</tbody></table>';
          }
          if(typeof _gwUpdateSiswaCounter_ === 'function') _gwUpdateSiswaCounter_();
        }
      }

      if(!data.length){
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#9ca3af;padding:16px">📭 Belum ada siswa binaan. Upload via template CSV.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(function(s){
        var nisSafe = String(s.nis || '').replace(/'/g, "\\'");
        var namaSafe = String(s.nama_siswa || '').replace(/'/g, "\\'");
        return '<tr>' +
          '<td style="text-align:center">' + (s.no || '') + '</td>' +
          '<td class="left">' + (s.nama_siswa || '-') + '</td>' +
          '<td style="text-align:center">' + (s.nis || '-') + '</td>' +
          '<td style="text-align:center">' + (s.kelas || '-') + '</td>' +
          '<td style="text-align:center">' +
            '<button type="button" onclick="showRiwayatSiswaBinaan_(\'' + nisSafe + '\',\'' + namaSafe + '\')" ' +
              'style="background:#eef2ff;color:#4338ca;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer">📜 Riwayat</button>' +
          '</td>' +
          '</tr>';
      }).join('');
      var ctrl = document.getElementById('siswaBinaanPager');
      if(ctrl){
        ctrl.innerHTML = '';
        if(res && res.totalPages && res.totalPages > 1){
          for(var i=1;i<=res.totalPages;i++){
            var btn = document.createElement('button');
            btn.textContent = i;
            btn.style.cssText = 'margin:0 2px;padding:2px 8px';
            if(i === res.page) btn.style.fontWeight = 'bold';
            (function(pg){ btn.onclick = function(){ loadSiswaBinaan(pg); }; })(i);
            ctrl.appendChild(btn);
          }
        }
      }
    })
    .withFailureHandler(function(err){
      stopTimer();
      if(tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ef4444;padding:12px">❌ ' + (err && err.message ? err.message : 'Gagal memuat') + '</td></tr>';
    })
    .getSiswaBinaan(p, 20);
}

/**
 * showRiwayatSiswaBinaan_(nis, nama)
 * Tampilkan riwayat kelas satu siswa binaan lintas tahun ajaran (mis. kelas 7
 * di 2024/2025, kelas 8 di 2025/2026, dst) SEKALIGUS riwayat catatan siswa
 * ini (individu maupun kelompok) — memakai modal wizard akademik yang sudah
 * ada supaya tidak perlu bikin modal baru.
 */
function showRiwayatSiswaBinaan_(nis, nama){
  var m = document.getElementById('academicWizardModal');
  var t = document.getElementById('academicWizardTitle');
  var b = document.getElementById('academicWizardBody');
  var a = document.getElementById('academicWizardActions');
  var p = document.getElementById('academicWizardProgress');
  if(!m || !t || !b || !a || !p) return;

  t.textContent = 'Riwayat — ' + (nama || nis);
  b.innerHTML = '<p class="muted">Memuat riwayat...</p>';
  a.innerHTML = '';
  p.style.width = '100%';
  m.style.display = 'flex';

  var done = { kelas: false, catatan: false };
  var kelasRows = [], catatanRows = [];

  var render = function(){
    if(!done.kelas || !done.catatan) return;

    var kelasHtml = '<div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:6px">📚 Riwayat Kelas</div>';
    if(!kelasRows.length){
      kelasHtml += '<p class="muted" style="font-size:12px">Belum ada riwayat kelas tercatat.</p>';
    } else {
      kelasHtml += '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px">' +
        '<thead><tr>' +
          '<th style="text-align:left;padding:6px;border-bottom:1px solid #e5e7eb">Tahun Ajaran</th>' +
          '<th style="text-align:center;padding:6px;border-bottom:1px solid #e5e7eb">Kelas</th>' +
          '<th style="text-align:center;padding:6px;border-bottom:1px solid #e5e7eb">Status</th>' +
        '</tr></thead><tbody>' +
        kelasRows.map(function(r){
          return '<tr>' +
            '<td style="padding:6px;border-bottom:1px solid #f3f4f6">' + (r.tahun_pelajaran || '-') + '</td>' +
            '<td style="text-align:center;padding:6px;border-bottom:1px solid #f3f4f6">' + (r.kelas || '-') + '</td>' +
            '<td style="text-align:center;padding:6px;border-bottom:1px solid #f3f4f6">' + (r.status || '-') + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table>';
    }

    var catatanHtml = '<div style="font-size:13px;font-weight:700;color:#374151;margin:14px 0 6px">📝 Riwayat Catatan</div>';
    if(!catatanRows.length){
      catatanHtml += '<p class="muted" style="font-size:12px">Belum ada catatan tercatat untuk siswa ini.</p>';
    } else {
      catatanHtml += '<div style="display:flex;flex-direction:column;gap:8px">' +
        catatanRows.map(function(c){
          var isGrup = String(c.tipe || '').toLowerCase() === 'kelompok';
          var badge = isGrup
            ? '<span style="background:#e0e7ff;color:#4338ca;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px">👥 Kelompok</span>'
            : '<span style="background:#fee2e2;color:#991b1b;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px">👤 Individu</span>';
          return '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
              '<span style="font-size:11px;color:#6b7280">Kelas ' + (c.kelas || '-') + ' &bull; ' + (c.tgl || '-') + '</span>' +
              badge +
            '</div>' +
            '<div style="font-size:13px;white-space:pre-wrap">' + (c.catatan || '-') + '</div>' +
          '</div>';
        }).join('') +
        '</div>';
    }

    b.innerHTML = kelasHtml + catatanHtml;
  };

  google.script.run
    .withSuccessHandler(function(rows){ kelasRows = rows || []; done.kelas = true; render(); })
    .withFailureHandler(function(err){
      console.error('[Riwayat] getRiwayatKelasSiswaBinaan:', err && err.message);
      done.kelas = true; render();
    })
    .getRiwayatKelasSiswaBinaan(nis);

  google.script.run
    .withSuccessHandler(function(rows){ catatanRows = rows || []; done.catatan = true; render(); })
    .withFailureHandler(function(err){
      console.error('[Riwayat] getCatatanRiwayatSiswa:', err && err.message);
      done.catatan = true; render();
    })
    .getCatatanRiwayatSiswa(nis);
}

function loadJurnalGuruWali(){
  // Isi dari cache setting dulu
  var cached = window._settingCache || {};
  var elNama = document.getElementById('gwNamaGuru');
  var elNip  = document.getElementById('gwNip');
  if(elNama && cached.nama_guru) elNama.innerText = cached.nama_guru;
  if(elNip  && cached.nip_guru)  elNip.innerText  = cached.nip_guru;

  // Muat dari backend (info + siswa binaan)
  loadInfoGuruWali();
  loadSiswaBinaan(1);

  // Panggil fungsi lain dari scripts-jadwal-wali.html jika tersedia
  if(typeof loadRiwayatGuruWali === 'function') loadRiwayatGuruWali();
  if(typeof loadStatusArsipWali === 'function') loadStatusArsipWali();
  if(typeof loadKelasUntukImportBinaan === 'function') loadKelasUntukImportBinaan();
  // Daftar centang Siswa Binaan di Form Jurnal Pendampingan diisi dari
  // dalam loadSiswaBinaan(1) di atas (lihat scripts-dashboard.html) —
  // TIDAK ada panggilan getSiswaBinaan terpisah lagi di sini. Tombol
  // "🔄 Muat Ulang" di form tetap tersedia sebagai cara memuat ulang
  // manual (memanggil _gwLoadSiswaBinaanPicker_ sendiri) kalau perlu.

  // Set default tanggal hari ini
  var tglEl = document.getElementById('gwTanggal');
  if(tglEl && !tglEl.value){
    tglEl.value = new Date().toISOString().slice(0,10);
    if(typeof autoFillHariWali === 'function') autoFillHariWali(tglEl.value);
  }
}
